<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07150d" />
  <meta name="description" content="Football Manager Mini Online — Blueprint 100% Frontend V1" />
  <title>Football Manager Mini Online — Matchday Edition</title>
<style>
:root{
  --bg:#0b1020;
  --panel:#121a2c;
  --panel-2:#182238;
  --panel-3:#0f1728;
  --text:#f7f9fc;
  --muted:#94a3b8;
  --line:#273249;
  --accent:#5eead4;
  --accent-2:#67e8f9;
  --good:#4ade80;
  --warn:#fbbf24;
  --danger:#fb7185;
  --shadow:0 18px 45px rgba(0,0,0,.22);
  --radius:18px;
  --radius-sm:12px;
}

*{box-sizing:border-box}
html{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
body{margin:0;min-width:320px;background:
  radial-gradient(circle at 10% 0%,rgba(94,234,212,.08),transparent 24rem),
  radial-gradient(circle at 100% 25%,rgba(103,232,249,.06),transparent 28rem),
  var(--bg);
}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app-shell{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}
.sidebar{
  position:sticky;top:0;height:100vh;padding:24px 18px;border-right:1px solid var(--line);
  background:rgba(10,15,29,.92);backdrop-filter:blur(16px);display:flex;flex-direction:column;z-index:30
}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 24px}
.brand-mark{
  width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
  font-weight:900;color:#07111d;background:linear-gradient(135deg,var(--accent),var(--accent-2))
}
.brand strong{display:block;font-size:15px;letter-spacing:.01em}
.brand span{display:block;font-size:12px;color:var(--muted);margin-top:2px}

.nav{display:grid;gap:8px}
.nav-item{
  border:0;background:transparent;color:var(--muted);display:flex;align-items:center;gap:12px;
  min-height:46px;border-radius:12px;padding:0 12px;text-align:left
}
.nav-item:hover{background:rgba(255,255,255,.04);color:var(--text)}
.nav-item.active{background:rgba(94,234,212,.11);color:var(--accent)}
.nav-icon{
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  border:1px solid currentColor;font-size:12px;font-weight:800
}
.sidebar-footer{margin-top:auto;display:grid;gap:12px;padding:16px 8px 0}
.season-chip{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:16px;color:var(--muted)}
.season-chip strong{color:var(--text)}
.demo-note{font-size:11px;color:#64748b}

.main{min-width:0}
.topbar{
  min-height:88px;display:flex;align-items:center;justify-content:space-between;gap:18px;
  padding:18px clamp(18px,3vw,40px);border-bottom:1px solid var(--line);
  background:rgba(11,16,32,.78);backdrop-filter:blur(14px);position:sticky;top:0;z-index:20
}
.topbar-left{display:flex;align-items:center;gap:14px}
.eyebrow{margin:0 0 5px;font-size:10px;letter-spacing:.18em;color:var(--accent);font-weight:800}
h1,h2,h3,p{margin-top:0}
h1{font-size:clamp(22px,3vw,30px);margin-bottom:0}
.topbar-actions{display:flex;align-items:center;gap:12px}
.match-countdown{display:grid;text-align:right;font-size:11px;color:var(--muted)}
.match-countdown strong{font-size:13px;color:var(--text);margin-top:2px}
.avatar-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font-weight:800}
.mobile-menu{display:none;width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text)}

.view-root{padding:clamp(18px,3vw,38px);max-width:1500px;margin:0 auto}
.grid{display:grid;gap:16px}
.kpi-grid{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}
.card{background:linear-gradient(180deg,rgba(24,34,56,.94),rgba(16,24,41,.94));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.kpi{padding:18px}
.kpi-label{color:var(--muted);font-size:12px;margin-bottom:8px}
.kpi-value{font-size:clamp(22px,3vw,30px);font-weight:900}
.kpi-sub{margin-top:8px;font-size:11px;color:var(--muted)}
.good{color:var(--good)}
.warn{color:var(--warn)}
.danger{color:var(--danger)}

.dashboard-grid{grid-template-columns:minmax(0,1.4fr) minmax(300px,.8fr)}
.stack{display:grid;gap:16px}
.section-card{padding:20px}
.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.section-head h2{font-size:17px;margin-bottom:3px}
.section-head p{font-size:12px;color:var(--muted);margin-bottom:0}
.badge{
  display:inline-flex;align-items:center;min-height:26px;padding:0 9px;border-radius:999px;
  border:1px solid var(--line);font-size:11px;color:var(--muted);white-space:nowrap
}
.badge.live{color:var(--accent);border-color:rgba(94,234,212,.35);background:rgba(94,234,212,.08)}

.fixture-card{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;
  padding:22px;border-radius:16px;background:var(--panel-3);border:1px solid var(--line)
}
.team{text-align:center}
.team-logo{
  width:58px;height:58px;margin:0 auto 10px;border-radius:18px;display:grid;place-items:center;
  background:linear-gradient(145deg,#25344f,#131d30);border:1px solid #34425d;font-weight:900
}
.team strong{display:block;font-size:14px}
.team span{font-size:11px;color:var(--muted)}
.fixture-meta{text-align:center;min-width:110px}
.fixture-meta strong{font-size:18px}
.fixture-meta span{display:block;font-size:11px;color:var(--muted);margin-top:5px}
.primary-btn{
  margin-top:16px;width:100%;min-height:44px;border:0;border-radius:12px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#06111d;font-weight:900
}
.secondary-btn{
  min-height:40px;padding:0 14px;border-radius:11px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--text);font-weight:700
}

.form-bars{display:grid;gap:12px}
.form-row{display:grid;grid-template-columns:90px 1fr 42px;gap:10px;align-items:center;font-size:12px}
.form-row span:first-child{color:var(--muted)}
.bar{height:8px;border-radius:999px;background:#222d43;overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.form-row strong{text-align:right}

.activity-list{display:grid;gap:10px}
.activity{
  display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--line)
}
.activity:last-child{border-bottom:0}
.activity-icon{width:32px;height:32px;border-radius:10px;background:#202c44;display:grid;place-items:center;font-size:12px}
.activity strong{font-size:12px;display:block}
.activity p{margin:3px 0 0;color:var(--muted);font-size:11px}
.activity time{font-size:10px;color:#64748b}

.quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.quick-card{padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--panel-3)}
.quick-card strong{font-size:14px}
.quick-card p{font-size:11px;color:var(--muted);margin:6px 0 0}

.squad-toolbar{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px
}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filter-btn{
  min-height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);color:var(--muted);font-size:12px
}
.filter-btn.active{border-color:rgba(94,234,212,.4);background:rgba(94,234,212,.09);color:var(--accent)}
.search-box{
  min-height:40px;min-width:min(280px,100%);border:1px solid var(--line);border-radius:11px;
  padding:0 13px;background:var(--panel);color:var(--text)
}
.search-box::placeholder{color:#64748b}

.table-card{overflow:hidden}
.table-wrap{overflow:auto}
.squad-table{width:100%;border-collapse:collapse;min-width:850px}
.squad-table th{
  text-align:left;padding:13px 15px;font-size:10px;letter-spacing:.08em;color:#718096;
  background:#0e1626;border-bottom:1px solid var(--line);position:sticky;top:0
}
.squad-table td{padding:13px 15px;border-bottom:1px solid var(--line);font-size:12px}
.squad-table tr:last-child td{border-bottom:0}
.squad-table tbody tr{transition:.18s}
.squad-table tbody tr:hover{background:rgba(255,255,255,.025)}
.player-cell{display:flex;align-items:center;gap:11px;min-width:210px}
.player-avatar{
  width:36px;height:36px;border-radius:12px;background:#24314b;display:grid;place-items:center;font-weight:900;font-size:11px
}
.player-name-btn{border:0;background:none;color:var(--text);padding:0;text-align:left;font-weight:800}
.player-name-btn:hover{color:var(--accent)}
.subtext{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.pos{
  display:inline-grid;place-items:center;min-width:34px;height:26px;border-radius:8px;
  background:#1e293b;border:1px solid #334155;font-weight:800;font-size:10px
}
.ovr{
  display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;
  background:rgba(94,234,212,.11);border:1px solid rgba(94,234,212,.35);color:var(--accent);font-weight:900
}
.fitness{display:flex;align-items:center;gap:8px}
.fitness-bar{width:70px;height:6px;border-radius:999px;background:#253047;overflow:hidden}
.fitness-bar i{display:block;height:100%;background:var(--good)}
.tag{display:inline-flex;align-items:center;min-height:25px;padding:0 8px;border-radius:999px;font-size:10px;border:1px solid var(--line);color:var(--muted)}
.tag.high{color:var(--good);border-color:rgba(74,222,128,.3);background:rgba(74,222,128,.07)}
.tag.med{color:var(--warn);border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.07)}

.player-dialog{
  width:min(720px,calc(100% - 28px));max-height:88vh;overflow:auto;padding:0;border:1px solid var(--line);
  border-radius:22px;background:#0f1728;color:var(--text);box-shadow:0 28px 80px rgba(0,0,0,.5)
}
.player-dialog::backdrop{background:rgba(3,8,18,.72);backdrop-filter:blur(4px)}
.dialog-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:22px;
  position:sticky;top:0;background:#0f1728;border-bottom:1px solid var(--line);z-index:2
}
.dialog-head h2{margin-bottom:0}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
.player-summary{padding:20px;display:grid;grid-template-columns:130px minmax(0,1fr);gap:18px}
.big-rating{
  border:1px solid rgba(94,234,212,.3);border-radius:20px;background:rgba(94,234,212,.07);
  min-height:130px;display:grid;place-items:center;text-align:center
}
.big-rating strong{font-size:44px;line-height:1;color:var(--accent)}
.big-rating span{font-size:11px;color:var(--muted)}
.player-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fact{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.fact span{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}
.fact strong{font-size:13px}
.attributes{padding:0 20px 22px}
.attributes h3{font-size:14px;margin-bottom:12px}
.attr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.attr{display:grid;grid-template-columns:110px 1fr 34px;align-items:center;gap:10px;font-size:11px}
.attr span:first-child{color:var(--muted)}
.attr-bar{height:7px;border-radius:999px;background:#243047;overflow:hidden}
.attr-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.attr strong{text-align:right}

.placeholder{
  min-height:300px;display:grid;place-items:center;text-align:center;padding:30px
}
.placeholder strong{display:block;font-size:20px;margin-bottom:7px}
.placeholder p{color:var(--muted);max-width:460px}

.toast{
  position:fixed;right:18px;bottom:18px;max-width:min(360px,calc(100% - 36px));padding:13px 16px;border-radius:12px;
  background:#172136;border:1px solid var(--line);box-shadow:var(--shadow);font-size:12px;
  opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s;z-index:100
}
.toast.show{opacity:1;transform:translateY(0)}

.mobile-backdrop{display:none}

@media(max-width:1050px){
  .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dashboard-grid{grid-template-columns:1fr}
}

@media(max-width:760px){
  .app-shell{grid-template-columns:1fr}
  .sidebar{
    position:fixed;left:0;top:0;width:250px;transform:translateX(-105%);transition:.22s;
    box-shadow:20px 0 60px rgba(0,0,0,.35)
  }
  .sidebar.open{transform:translateX(0)}
  .mobile-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25}
  .mobile-backdrop.show{display:block}
  .mobile-menu{display:grid;place-items:center}
  .topbar{padding:14px 16px;min-height:74px}
  .view-root{padding:16px}
  .match-countdown{display:none}
  .kpi-grid{grid-template-columns:1fr 1fr}
  .fixture-card{grid-template-columns:1fr auto 1fr;padding:16px;gap:8px}
  .team-logo{width:48px;height:48px}
  .quick-grid{grid-template-columns:1fr}
  .player-summary{grid-template-columns:1fr}
  .big-rating{min-height:100px}
}

@media(max-width:470px){
  .kpi-grid{grid-template-columns:1fr}
  .topbar h1{font-size:21px}
  .fixture-meta{min-width:80px}
  .player-facts{grid-template-columns:1fr 1fr}
  .attr-grid{grid-template-columns:1fr}
  .filters{display:grid;grid-template-columns:repeat(3,1fr);width:100%}
  .filter-btn{padding:0 8px}
  .search-box{width:100%;min-width:0}
}


/* ===========================
   TACTICS V1
   =========================== */

.tactics-layout{
  display:grid;
  grid-template-columns:minmax(520px,1.25fr) minmax(320px,.75fr);
  gap:18px;
  align-items:start;
}

.tactics-left,.tactics-right{display:grid;gap:16px}

.tactics-toolbar{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:16px 18px;
}

.select-group{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
}
.select-group label{
  font-size:11px;
  color:var(--muted);
  font-weight:700;
}
.game-select{
  min-height:40px;
  padding:0 12px;
  border-radius:11px;
  border:1px solid var(--line);
  background:#10192a;
  color:var(--text);
  font-weight:700;
  outline:none;
}
.game-select:focus{border-color:rgba(94,234,212,.55)}
.tactics-actions{display:flex;gap:8px;flex-wrap:wrap}

.pitch-card{padding:18px}
.pitch-shell{
  position:relative;
  width:100%;
  aspect-ratio:68 / 100;
  max-height:740px;
  margin:0 auto;
  border-radius:20px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.12);
  background:
    repeating-linear-gradient(
      90deg,
      rgba(255,255,255,.018) 0,
      rgba(255,255,255,.018) 12.5%,
      rgba(255,255,255,.035) 12.5%,
      rgba(255,255,255,.035) 25%
    ),
    linear-gradient(180deg,#123c32,#0b2f29);
}
.pitch-lines{position:absolute;inset:4%;pointer-events:none}
.pitch-lines::before{
  content:"";
  position:absolute;inset:0;
  border:2px solid rgba(255,255,255,.44);
  border-radius:2px;
}
.pitch-mid{
  position:absolute;left:4%;right:4%;top:50%;height:2px;
  background:rgba(255,255,255,.44);
}
.pitch-circle{
  position:absolute;left:50%;top:50%;
  width:19%;aspect-ratio:1;border:2px solid rgba(255,255,255,.44);
  border-radius:50%;transform:translate(-50%,-50%);
}
.pitch-circle::after{
  content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;
  background:rgba(255,255,255,.55);transform:translate(-50%,-50%);
}
.penalty-box{
  position:absolute;left:24%;width:52%;height:16%;
  border:2px solid rgba(255,255,255,.44)
}
.penalty-box.top{top:4%;border-top:0}
.penalty-box.bottom{bottom:4%;border-bottom:0}
.goal-box{
  position:absolute;left:38%;width:24%;height:7%;
  border:2px solid rgba(255,255,255,.44)
}
.goal-box.top{top:4%;border-top:0}
.goal-box.bottom{bottom:4%;border-bottom:0}
.goal-mouth{
  position:absolute;left:42%;width:16%;height:2%;
  border:2px solid rgba(255,255,255,.44)
}
.goal-mouth.top{top:2.2%}
.goal-mouth.bottom{bottom:2.2%}

.pitch-players{
  position:absolute;inset:0;
}
.pitch-player{
  position:absolute;
  width:82px;
  transform:translate(-50%,-50%);
  text-align:center;
  user-select:none;
}
.pitch-player button{
  width:54px;height:54px;border-radius:50%;
  border:2px solid rgba(255,255,255,.66);
  background:linear-gradient(145deg,#233650,#132033);
  color:var(--text);
  font-weight:900;
  box-shadow:0 8px 16px rgba(0,0,0,.28);
  transition:.16s;
}
.pitch-player button:hover{
  transform:translateY(-2px);
  border-color:var(--accent);
}
.pitch-player.selected button{
  border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(94,234,212,.12),0 10px 18px rgba(0,0,0,.32)
}
.pitch-player .pname{
  display:block;
  margin-top:5px;
  font-size:9px;
  font-weight:800;
  text-shadow:0 2px 4px rgba(0,0,0,.75);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.pitch-player .ppos{
  display:inline-block;
  margin-top:2px;
  padding:2px 6px;
  font-size:8px;
  border-radius:999px;
  background:rgba(7,17,28,.78);
  border:1px solid rgba(255,255,255,.14);
  color:#d8e2f0;
}
.pitch-player .ovr-dot{
  position:absolute;
  top:-4px;right:6px;
  min-width:22px;height:22px;
  padding:0 4px;
  display:grid;place-items:center;
  border-radius:999px;
  background:var(--accent);
  color:#051018;
  border:2px solid #0d1728;
  font-size:9px;
  font-weight:900;
}

.lineup-summary{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
  margin-top:14px;
}
.lineup-stat{
  padding:11px 12px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#0f1728;
}
.lineup-stat span{display:block;font-size:9px;color:var(--muted);margin-bottom:4px}
.lineup-stat strong{font-size:14px}

.bench-list{display:grid;gap:8px}
.bench-player{
  display:grid;
  grid-template-columns:36px minmax(0,1fr) auto;
  gap:10px;
  align-items:center;
  padding:10px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#0f1728;
}
.bench-player .bench-num{
  width:34px;height:34px;border-radius:10px;
  background:#213049;display:grid;place-items:center;
  font-size:10px;font-weight:900
}
.bench-player strong{font-size:11px;display:block}
.bench-player span{font-size:9px;color:var(--muted)}
.bench-player button{
  min-height:32px;
  padding:0 9px;
  border-radius:9px;
  border:1px solid var(--line);
  background:#172136;
  color:var(--text);
  font-size:10px;
  font-weight:800
}

.tactic-control-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.tactic-control{
  padding:12px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#0f1728;
}
.tactic-control label{
  display:block;
  color:var(--muted);
  font-size:9px;
  margin-bottom:7px;
  text-transform:uppercase;
  letter-spacing:.08em;
  font-weight:800;
}
.tactic-control select{width:100%}

.tactical-profile{
  display:grid;
  gap:9px;
}
.profile-line{
  display:grid;
  grid-template-columns:100px 1fr 36px;
  gap:8px;
  align-items:center;
  font-size:10px
}
.profile-line span:first-child{color:var(--muted)}
.profile-bar{height:7px;background:#253047;border-radius:999px;overflow:hidden}
.profile-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.profile-line strong{text-align:right}

.selection-panel{
  display:none;
  border:1px solid rgba(94,234,212,.25);
  border-radius:14px;
  background:rgba(94,234,212,.05);
  padding:12px;
}
.selection-panel.show{display:block}
.selection-panel h3{font-size:12px;margin-bottom:8px}
.selection-info{font-size:10px;color:var(--muted);margin-bottom:10px}

.player-picker{
  display:grid;gap:7px;max-height:260px;overflow:auto;padding-right:4px
}
.pick-row{
  display:grid;
  grid-template-columns:34px minmax(0,1fr) auto;
  gap:9px;align-items:center;
  width:100%;
  padding:8px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#121c2f;
  color:var(--text);
  text-align:left
}
.pick-row:hover{border-color:rgba(94,234,212,.45)}
.pick-row .pick-av{
  width:32px;height:32px;border-radius:9px;background:#22314b;
  display:grid;place-items:center;font-size:9px;font-weight:900
}
.pick-row strong{display:block;font-size:10px}
.pick-row span{font-size:9px;color:var(--muted)}
.pick-row .pick-ovr{
  width:30px;height:30px;border-radius:50%;
  border:1px solid rgba(94,234,212,.35);
  display:grid;place-items:center;color:var(--accent);font-size:10px;font-weight:900
}

.status-strip{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  margin-top:12px;padding-top:12px;border-top:1px solid var(--line)
}
.status-strip .tag{font-size:9px}

@media(max-width:1100px){
  .tactics-layout{grid-template-columns:1fr}
  .pitch-shell{max-width:650px}
}
@media(max-width:760px){
  .tactic-control-grid{grid-template-columns:1fr 1fr}
  .pitch-card{padding:12px}
  .pitch-player{width:62px}
  .pitch-player button{width:46px;height:46px;font-size:11px}
  .pitch-player .pname{font-size:8px}
  .pitch-player .ovr-dot{right:0}
}
@media(max-width:480px){
  .tactic-control-grid{grid-template-columns:1fr}
  .lineup-summary{grid-template-columns:1fr 1fr}
  .pitch-player{width:54px}
  .pitch-player button{width:42px;height:42px;font-size:10px}
  .pitch-player .pname{max-width:54px;margin-left:auto;margin-right:auto}
  .tactics-toolbar{padding:13px}
}


/* ===========================
   TRAINING V1
   =========================== */

.training-layout{
  display:grid;
  grid-template-columns:minmax(0,1.2fr) minmax(320px,.8fr);
  gap:18px;
  align-items:start;
}
.training-main,.training-side{display:grid;gap:16px}

.training-mode-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
}
.training-mode{
  min-height:112px;
  padding:14px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#0f1728;
  color:var(--text);
  text-align:left;
  transition:.16s;
}
.training-mode:hover{border-color:rgba(94,234,212,.35);transform:translateY(-1px)}
.training-mode.active{
  border-color:rgba(94,234,212,.55);
  background:rgba(94,234,212,.08);
  box-shadow:inset 0 0 0 1px rgba(94,234,212,.06);
}
.training-mode strong{display:block;font-size:13px;margin-bottom:6px}
.training-mode span{display:block;font-size:10px;color:var(--muted);line-height:1.45}
.training-mode .mode-value{margin-top:8px;color:var(--accent);font-weight:800}

.training-focus-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:9px;
}
.focus-btn{
  min-height:42px;
  border-radius:11px;
  border:1px solid var(--line);
  background:#111a2b;
  color:var(--muted);
  font-size:11px;
  font-weight:800;
}
.focus-btn.active{
  color:var(--accent);
  border-color:rgba(94,234,212,.45);
  background:rgba(94,234,212,.08);
}

.training-impact{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
}
.impact-card{
  padding:12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#0f1728;
}
.impact-card span{display:block;font-size:9px;color:var(--muted);margin-bottom:5px}
.impact-card strong{font-size:15px}
.impact-card small{display:block;margin-top:4px;font-size:9px;color:#64748b}

.readiness-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
}
.readiness-card{
  padding:12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#0f1728;
}
.readiness-card span{font-size:9px;color:var(--muted);display:block}
.readiness-card strong{display:block;font-size:20px;margin-top:4px}

.training-table{
  width:100%;
  border-collapse:collapse;
  min-width:800px;
}
.training-table th{
  text-align:left;
  padding:12px 14px;
  font-size:9px;
  color:#718096;
  letter-spacing:.08em;
  border-bottom:1px solid var(--line);
  background:#0e1626;
}
.training-table td{
  padding:11px 14px;
  border-bottom:1px solid var(--line);
  font-size:11px;
}
.training-table tr:last-child td{border-bottom:0}
.readiness-pill{
  display:inline-flex;
  min-height:24px;
  align-items:center;
  padding:0 8px;
  border-radius:999px;
  border:1px solid var(--line);
  font-size:9px;
  font-weight:800;
}
.readiness-pill.ready{color:var(--good);border-color:rgba(74,222,128,.3);background:rgba(74,222,128,.07)}
.readiness-pill.manage{color:var(--warn);border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.07)}
.readiness-pill.risk{color:var(--danger);border-color:rgba(251,113,133,.3);background:rgba(251,113,133,.07)}

.individual-focus-select{
  min-height:34px;
  border-radius:9px;
  border:1px solid var(--line);
  background:#111a2b;
  color:var(--text);
  padding:0 8px;
  font-size:10px;
}

.training-warning{
  padding:12px 13px;
  border:1px solid rgba(251,191,36,.25);
  border-radius:12px;
  background:rgba(251,191,36,.05);
  color:#d6b865;
  font-size:10px;
  line-height:1.5;
}

.training-safe{
  padding:12px 13px;
  border:1px solid rgba(74,222,128,.22);
  border-radius:12px;
  background:rgba(74,222,128,.05);
  color:#8fe0aa;
  font-size:10px;
  line-height:1.5;
}

.history-list{display:grid;gap:9px}
.history-row{
  display:grid;
  grid-template-columns:54px minmax(0,1fr) auto;
  gap:10px;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid var(--line);
}
.history-row:last-child{border-bottom:0}
.history-day{
  width:50px;height:34px;border-radius:10px;background:#1b2940;
  display:grid;place-items:center;font-size:9px;font-weight:900
}
.history-row strong{display:block;font-size:11px}
.history-row span{font-size:9px;color:var(--muted)}
.history-impact{text-align:right;font-size:9px}
.history-impact b{display:block;color:var(--accent)}

.recovery-bars{display:grid;gap:11px}
.recovery-row{
  display:grid;
  grid-template-columns:110px 1fr 42px;
  gap:8px;
  align-items:center;
  font-size:10px;
}
.recovery-row span:first-child{color:var(--muted)}
.recovery-bar{height:7px;border-radius:999px;background:#253047;overflow:hidden}
.recovery-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.recovery-row strong{text-align:right}

@media(max-width:1100px){
  .training-layout{grid-template-columns:1fr}
}
@media(max-width:760px){
  .training-mode-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .training-focus-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .training-impact{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:470px){
  .training-mode-grid{grid-template-columns:1fr}
  .training-focus-grid{grid-template-columns:1fr 1fr}
  .readiness-grid{grid-template-columns:1fr}
}


/* ===========================
   TRANSFERS V1
   =========================== */

.transfer-shell{display:grid;gap:16px}
.transfer-summary{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
}
.transfer-stat{
  padding:14px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#0f1728;
}
.transfer-stat span{display:block;font-size:9px;color:var(--muted);margin-bottom:6px}
.transfer-stat strong{font-size:18px}
.transfer-tabs{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  padding:8px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#0f1728;
}
.transfer-tab{
  min-height:38px;
  padding:0 13px;
  border-radius:10px;
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:11px;
  font-weight:800;
}
.transfer-tab.active{background:rgba(94,234,212,.1);color:var(--accent)}
.transfer-toolbar{
  display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;
}
.transfer-filter-group{display:flex;flex-wrap:wrap;gap:8px}
.transfer-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
}
.market-card{
  padding:15px;
  border:1px solid var(--line);
  border-radius:15px;
  background:#0f1728;
  display:grid;
  gap:12px;
}
.market-card:hover{border-color:rgba(94,234,212,.28)}
.market-head{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center}
.market-avatar{
  width:42px;height:42px;border-radius:12px;background:#22314b;display:grid;place-items:center;font-size:10px;font-weight:900
}
.market-head strong{display:block;font-size:12px}
.market-head span{display:block;font-size:9px;color:var(--muted);margin-top:2px}
.market-ovr{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  border:1px solid rgba(94,234,212,.35);color:var(--accent);font-weight:900;font-size:12px
}
.market-meta{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:7px;
}
.market-meta div{
  padding:8px;border-radius:10px;background:#121c2f;border:1px solid var(--line)
}
.market-meta span{display:block;font-size:8px;color:var(--muted);margin-bottom:3px}
.market-meta strong{font-size:10px}
.market-actions{display:flex;gap:8px}
.market-actions button{flex:1}
.offer-btn{
  min-height:38px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#06111d;font-weight:900;font-size:10px
}
.watch-btn{
  min-height:38px;border:1px solid var(--line);border-radius:10px;background:#172136;color:var(--text);font-size:10px;font-weight:800
}

.transfer-table{width:100%;border-collapse:collapse;min-width:820px}
.transfer-table th{
  text-align:left;padding:12px 14px;font-size:9px;color:#718096;letter-spacing:.08em;
  border-bottom:1px solid var(--line);background:#0e1626
}
.transfer-table td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:11px}
.transfer-table tr:last-child td{border-bottom:0}

.status-badge{
  display:inline-flex;min-height:24px;align-items:center;padding:0 8px;border-radius:999px;
  border:1px solid var(--line);font-size:9px;font-weight:800
}
.status-badge.pending{color:var(--warn);border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.07)}
.status-badge.accepted{color:var(--good);border-color:rgba(74,222,128,.3);background:rgba(74,222,128,.07)}
.status-badge.rejected,.status-badge.outbid{color:var(--danger);border-color:rgba(251,113,133,.3);background:rgba(251,113,133,.07)}

.offer-panel{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.45fr);gap:16px;
}
.offer-box{padding:18px}
.offer-player{
  display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:12px;align-items:center;
  padding:12px;border:1px solid var(--line);border-radius:13px;background:#0f1728
}
.offer-player .market-avatar{width:50px;height:50px}
.offer-form{display:grid;gap:12px}
.offer-form label{font-size:9px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.money-input{
  width:100%;min-height:42px;border-radius:11px;border:1px solid var(--line);background:#111a2b;color:var(--text);padding:0 12px
}
.offer-preview{
  display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#0f1728
}
.preview-row{display:flex;justify-content:space-between;gap:12px;font-size:10px}
.preview-row span{color:var(--muted)}
.preview-row strong{font-size:10px}
.finance-warning{
  padding:11px 12px;border-radius:11px;border:1px solid rgba(251,113,133,.25);
  background:rgba(251,113,133,.05);color:#f6a1af;font-size:10px;line-height:1.45
}
.finance-ok{
  padding:11px 12px;border-radius:11px;border:1px solid rgba(74,222,128,.22);
  background:rgba(74,222,128,.05);color:#94e3ad;font-size:10px;line-height:1.45
}

.auction-card{
  padding:15px;border:1px solid var(--line);border-radius:15px;background:#0f1728;display:grid;gap:11px
}
.auction-countdown{font-size:10px;color:var(--warn);font-weight:800}
.bid-row{display:flex;justify-content:space-between;align-items:end;gap:10px}
.bid-row .market-actions{min-width:140px}

.offer-response-actions{display:flex;gap:7px;flex-wrap:wrap}
.accept-btn,.reject-btn,.counter-btn{
  min-height:34px;padding:0 10px;border-radius:9px;font-size:9px;font-weight:900
}
.accept-btn{border:1px solid rgba(74,222,128,.3);background:rgba(74,222,128,.08);color:var(--good)}
.reject-btn{border:1px solid rgba(251,113,133,.3);background:rgba(251,113,133,.08);color:var(--danger)}
.counter-btn{border:1px solid var(--line);background:#172136;color:var(--text)}

@media(max-width:1100px){
  .transfer-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .offer-panel{grid-template-columns:1fr}
}
@media(max-width:760px){
  .transfer-summary{grid-template-columns:repeat(2,minmax(0,1fr))}
  .transfer-grid{grid-template-columns:1fr}
}
@media(max-width:470px){
  .transfer-summary{grid-template-columns:1fr}
  .market-meta{grid-template-columns:1fr 1fr}
  .transfer-tabs{display:grid;grid-template-columns:1fr 1fr}
}


/* ===========================
   LEAGUE / MATCH / CLUB
   =========================== */

.module-tabs{
  display:flex;flex-wrap:wrap;gap:8px;padding:8px;border:1px solid var(--line);
  border-radius:14px;background:#0f1728;margin-bottom:16px
}
.module-tab{
  min-height:38px;padding:0 13px;border:0;border-radius:10px;background:transparent;
  color:var(--muted);font-size:11px;font-weight:800
}
.module-tab.active{background:rgba(94,234,212,.1);color:var(--accent)}

.league-table{width:100%;border-collapse:collapse;min-width:860px}
.league-table th{
  text-align:center;padding:12px 10px;font-size:9px;color:#718096;letter-spacing:.06em;
  background:#0e1626;border-bottom:1px solid var(--line)
}
.league-table th:nth-child(2){text-align:left}
.league-table td{
  padding:12px 10px;border-bottom:1px solid var(--line);font-size:11px;text-align:center
}
.league-table td:nth-child(2){text-align:left;font-weight:800}
.league-table tr.highlight{background:rgba(94,234,212,.05)}
.position-badge{
  width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
  background:#1b2940;margin:0 auto;font-size:10px;font-weight:900
}
.form-dots{display:flex;gap:4px;justify-content:center}
.form-dot{
  width:20px;height:20px;border-radius:6px;display:grid;place-items:center;
  font-size:8px;font-weight:900;background:#1b2940;color:var(--muted)
}
.form-dot.w{color:var(--good)}
.form-dot.d{color:var(--warn)}
.form-dot.l{color:var(--danger)}

.fixture-list{display:grid;gap:9px}
.fixture-row{
  display:grid;grid-template-columns:70px minmax(0,1fr) 70px minmax(0,1fr) 90px;
  gap:10px;align-items:center;padding:11px 12px;border:1px solid var(--line);
  border-radius:12px;background:#0f1728
}
.fixture-row strong{font-size:11px}
.fixture-row span{font-size:9px;color:var(--muted)}
.fixture-score{text-align:center;font-weight:900}
.fixture-status{text-align:right}

.stats-podium{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px
}
.podium-card{
  padding:16px;border:1px solid var(--line);border-radius:14px;background:#0f1728
}
.podium-card span{display:block;font-size:9px;color:var(--muted)}
.podium-card strong{display:block;font-size:14px;margin-top:4px}
.podium-card b{display:block;font-size:24px;margin-top:8px;color:var(--accent)}

.match-layout{
  display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,.75fr);gap:18px;align-items:start
}
.scoreboard{
  padding:20px;border:1px solid var(--line);border-radius:18px;background:#0f1728
}
.score-main{
  display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;text-align:center
}
.score-team .team-logo{margin-bottom:8px}
.score-team strong{display:block;font-size:14px}
.score-centre strong{font-size:38px;letter-spacing:.04em}
.score-centre span{display:block;font-size:10px;color:var(--muted);margin-top:4px}
.match-progress{
  margin-top:16px;height:7px;border-radius:999px;background:#253047;overflow:hidden
}
.match-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.match-controls{display:flex;gap:8px;margin-top:14px}
.match-controls button{flex:1}

.match-stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.match-stat{
  padding:11px;border:1px solid var(--line);border-radius:12px;background:#0f1728
}
.match-stat span{display:block;font-size:9px;color:var(--muted)}
.match-stat strong{font-size:15px;margin-top:4px;display:block}

.event-timeline{display:grid;gap:7px;max-height:460px;overflow:auto;padding-right:4px}
.event-row{
  display:grid;grid-template-columns:42px 30px minmax(0,1fr);gap:8px;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--line)
}
.event-row:last-child{border-bottom:0}
.event-minute{font-size:10px;color:var(--muted);text-align:right}
.event-icon{
  width:28px;height:28px;border-radius:9px;background:#1d2a41;display:grid;place-items:center;font-size:10px
}
.event-row strong{font-size:10px}

.club-layout{
  display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:18px;align-items:start
}
.finance-grid{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px
}
.finance-card{
  padding:13px;border:1px solid var(--line);border-radius:13px;background:#0f1728
}
.finance-card span{display:block;font-size:9px;color:var(--muted);margin-bottom:5px}
.finance-card strong{font-size:16px}
.ledger-list{display:grid;gap:8px}
.ledger-row{
  display:grid;grid-template-columns:72px 110px minmax(0,1fr) auto;gap:10px;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--line);font-size:10px
}
.ledger-row:last-child{border-bottom:0}
.ledger-row span{color:var(--muted)}
.ledger-amount.positive{color:var(--good)}
.ledger-amount.negative{color:var(--danger)}

.facility-grid{display:grid;gap:10px}
.facility-card{
  padding:15px;border:1px solid var(--line);border-radius:14px;background:#0f1728
}
.facility-head{display:flex;justify-content:space-between;gap:12px;align-items:start}
.facility-head strong{font-size:12px}
.facility-level{
  min-width:58px;text-align:center;padding:5px 8px;border-radius:999px;
  border:1px solid rgba(94,234,212,.3);color:var(--accent);font-size:9px;font-weight:900
}
.facility-card p{font-size:10px;color:var(--muted);margin:8px 0}
.facility-next{font-size:9px;color:#b7c4d8}
.facility-action{
  display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:12px
}
.facility-action span{font-size:10px;font-weight:800}

@media(max-width:1100px){
  .match-layout,.club-layout{grid-template-columns:1fr}

.match-countdown{
  min-width:132px;padding:9px 11px;border-radius:8px;
  border:1px solid #2d543b;background:#08160d;
}
.match-countdown span{text-transform:uppercase;letter-spacing:.12em;font-size:8px}
.match-countdown strong{color:var(--accent);font-size:12px}
.avatar-btn,.notification-btn,.mobile-menu{
  background:#0b1d12;border-color:#2c5139;color:#f4f8f2;
}
.notification-btn span{background:var(--accent);color:#06100a;border-color:#06100a}

/* Cards become match-program panels */
.card{
  position:relative;
  background:linear-gradient(180deg,rgba(14,31,20,.97),rgba(8,20,13,.97));
  border:1px solid #244530;
  border-radius:14px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.card::before{
  content:"";position:absolute;left:0;right:0;top:0;height:2px;
  background:linear-gradient(90deg,var(--accent),rgba(74,222,128,.28),transparent 82%);
  opacity:.9;
}
.section-head h2{font-size:18px;text-transform:uppercase;letter-spacing:.04em}
.section-head p{color:#91a698}
.badge{
  border-radius:6px;
  border-color:#315740;
  background:#0a1a10;
  text-transform:uppercase;
  letter-spacing:.08em;
  font-size:8px;
  font-weight:900;
}
.badge.live{background:rgba(183,245,42,.09);color:var(--accent);border-color:rgba(183,245,42,.38)}

/* Scoreboard KPIs */
.kpi{
  min-height:124px;
  background:
    linear-gradient(145deg,rgba(183,245,42,.045),transparent 58%),
    linear-gradient(180deg,#0e2116,#09170f);
}
.kpi-label{text-transform:uppercase;letter-spacing:.12em;font-size:9px;color:#88a091}
.kpi-value{font-size:32px;letter-spacing:-.02em}
.kpi-sub{border-top:1px solid rgba(183,245,42,.10);padding-top:8px}

/* Hero fixture = matchday ticket / stadium board */
.fixture-card{
  position:relative;
  border-radius:12px;
  border:1px solid #356247;
  background:
    linear-gradient(90deg,rgba(183,245,42,.045),transparent 30%,transparent 70%,rgba(183,245,42,.045)),
    repeating-linear-gradient(90deg,#0c2416 0 68px,#0a1e13 68px 136px);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.015);
}
.fixture-card::before{
  content:"MATCHDAY";position:absolute;left:50%;top:9px;transform:translateX(-50%);
  font-size:8px;letter-spacing:.34em;font-weight:900;color:rgba(255,255,255,.22);
}
.team-logo{
  border-radius:0;
  clip-path:polygon(50% 0,92% 14%,87% 72%,50% 100%,13% 72%,8% 14%);
  background:linear-gradient(160deg,#244d31,#0e2617);
  border:1px solid #4d765a;
  color:#eef8e9;
}
.fixture-meta strong{font-size:24px;color:var(--accent)}

/* Buttons: kit / pitch green */
.primary-btn,.offer-btn{
  border-radius:8px;
  background:linear-gradient(135deg,var(--accent),#64db45);
  color:#071109;
  text-transform:uppercase;
  letter-spacing:.055em;
  box-shadow:0 10px 24px rgba(183,245,42,.12);
}
.primary-btn:hover,.offer-btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.secondary-btn,.watch-btn,.filter-btn,.game-select,.search-box,.auth-input,.money-input,.individual-focus-select{
  border-radius:8px;background:#0a1b11;border-color:#2a4b35;
}
.secondary-btn:hover,.watch-btn:hover,.filter-btn:hover{border-color:#4d7659;background:#0d2417}
.filter-btn.active,.module-tab.active,.transfer-tab.active,.admin-tab.active,.inbox-filter.active{
  color:var(--accent)!important;background:rgba(183,245,42,.09)!important;border-color:rgba(183,245,42,.40)!important;
}

/* Tables: league sheet */
.squad-table th,.transfer-table th,.league-table th,.admin-table th,.hof-table th,.career-table th,.training-table th{
  background:#08160e;
  color:#8ca093;
  text-transform:uppercase;
  letter-spacing:.12em;
  border-bottom-color:#2d513a;
}
.squad-table td,.transfer-table td,.league-table td,.admin-table td,.hof-table td,.career-table td,.training-table td{
  border-bottom-color:#1e3928;
}
.squad-table tbody tr:hover,.transfer-table tbody tr:hover,.league-table tbody tr:hover{background:rgba(183,245,42,.035)}
.league-table tr.highlight{background:rgba(183,245,42,.075)}
.position-badge{background:#0b2416;border:1px solid #315941;color:var(--accent)}
.form-dot{border-radius:4px;background:#10251a}

/* Player ratings and chips */
.player-avatar,.market-avatar,.activity-icon,.bench-num,.pick-av,.notification-symbol{
  background:linear-gradient(145deg,#183922,#0c2014)!important;
  border:1px solid #31583f;
}
.ovr,.market-ovr{
  background:rgba(183,245,42,.08);
  border-color:rgba(183,245,42,.42);
  color:var(--accent);
}
.pos{background:#0d2417;border-color:#31563e}
.tag,.status-badge,.injury-pill,.readiness-pill{border-radius:5px}
.attr-bar,.fitness-bar,.profile-bar,.recovery-bar,.bar,.match-progress{background:#173522}
.attr-bar i,.fitness-bar i,.profile-bar i,.recovery-bar i,.bar i,.match-progress i{
  background:linear-gradient(90deg,#62db4b,var(--accent));
}

/* Tactics / pitch: make it look like an actual floodlit pitch */
.pitch-card{background:#08160e}
.pitch-shell{
  border-radius:10px;
  border:2px solid rgba(255,255,255,.22);
  background:
    repeating-linear-gradient(90deg,#176234 0,#176234 12.5%,#145b30 12.5%,#145b30 25%);
  box-shadow:inset 0 0 70px rgba(0,0,0,.25),0 18px 40px rgba(0,0,0,.24);
}
.pitch-player button{
  background:linear-gradient(145deg,#1c2f22,#08170f);
  border-color:#e5f0e8;
  box-shadow:0 6px 14px rgba(0,0,0,.35);
}
.pitch-player.selected button{border-color:var(--accent);box-shadow:0 0 0 4px rgba(183,245,42,.14),0 8px 18px rgba(0,0,0,.38)}
.pitch-player .ovr-dot{background:var(--accent);color:#06100a;border-color:#07150d}
.pitch-player .ppos{background:#07150d;border-color:#41684d}

/* Match centre = TV scoreboard */
.scoreboard{
  border-radius:10px;border-color:#355f44;
  background:
    linear-gradient(180deg,rgba(183,245,42,.04),transparent 42%),
    #07150d;
}
.score-centre strong{font-size:44px;color:#fff;text-shadow:0 0 18px rgba(183,245,42,.08)}
.score-centre span{text-transform:uppercase;letter-spacing:.14em;color:var(--accent)}
.match-stat{background:#091a10;border-color:#284b35}
.match-stat span{text-transform:uppercase;letter-spacing:.1em}
.event-icon{background:#10291a;border:1px solid #315940}

/* Transfers = scouting board */
.market-card,.auction-card,.offer-player,.offer-preview,.transfer-stat{
  border-radius:10px;background:#091a10;border-color:#284a34;
}
.market-card:hover{border-color:rgba(183,245,42,.40);transform:translateY(-1px)}
.market-ovr{border-radius:7px}

/* Training = training ground */
.training-mode,.impact-card,.readiness-card,.facility-card,.finance-card,.club-info-card,.award-card,.podium-card,.admin-control{
  border-radius:10px;background:#091a10;border-color:#284a34;
}
.training-mode.active{background:rgba(183,245,42,.08);border-color:rgba(183,245,42,.45)}

/* Auth / club creation */
.auth-root{
  background:
    linear-gradient(rgba(4,15,8,.84),rgba(4,15,8,.94)),
    repeating-linear-gradient(90deg,#154e2b 0 80px,#124625 80px 160px);
}
.auth-shell{border-radius:16px;border-color:#2f573e;background:#07150d}
.auth-hero{
  background:
    radial-gradient(circle at 50% 10%,rgba(183,245,42,.14),transparent 24rem),
    repeating-linear-gradient(90deg,#0d351d 0 72px,#0b2d19 72px 144px);
}
.auth-hero .brand-mark{clip-path:polygon(50% 0,92% 16%,86% 72%,50% 100%,14% 72%,8% 16%)}
.auth-panel{background:#08160e}
.club-preview{border-radius:10px;background:#091b11;border-color:#2b5038}
.club-preview-logo{clip-path:polygon(50% 0,92% 16%,86% 72%,50% 100%,14% 72%,8% 16%);border-radius:0}

/* League / Hall of Fame */
.podium-card:first-child{border-color:rgba(183,245,42,.45);background:linear-gradient(145deg,rgba(183,245,42,.08),#091a10)}
.trophy-card{background:#091a10;border-color:#2b5038}
.trophy-card b{color:var(--accent)}

/* Mobile */
@media(max-width:760px){
  .topbar::after{display:none}
  .sidebar{background:#07170e}
  .card{border-radius:12px}
  .fixture-card{padding-top:25px}
}
</style>

  async function ensureTacticsInitialized() {
    if (Object.keys(state.lineup).length) return;

  function compatibleScore(slot, player) {
    const p = player.pos;
    const s = slot;
    if (s === p) return 100;
    const map = {
      RWB:["RB","RW"], LWB:["LB","LW"], RM:["RW","RB","CM"], LM:["LW","LB","CM"],
      DM:["CM","CB"], CM:["DM","AM"], AM:["CM","RW","LW"], ST:["LW","RW"],
      RW:["AM","ST"], LW:["AM","ST"], RB:["CB"], LB:["CB"], CB:["DM"]
    };
    if ((map[s] || []).includes(p)) return 80;
    if (player.secondary && player.secondary !== "-" && player.secondary.split("/").includes(s)) return 90;
    return 35;
  }

  function assignDefaultLineup(players, formation) {
    const slots = formations[formation];
    const available = [...players];
    const lineup = {};
    slots.forEach((slot, idx) => {
      const role = slot[0];
      available.sort((a,b) => {
        const scoreA = compatibleScore(role,a) * 10 + a.ovr;
        const scoreB = compatibleScore(role,b) * 10 + b.ovr;
        return scoreB - scoreA;
      });
      const chosen = available.shift();
      if (chosen) lineup[idx] = chosen.id;
    });
    state.lineup = lineup;
    const used = new Set(Object.values(lineup));
    state.bench = players.filter(p => !used.has(p.id)).slice(0,9).map(p => p.id);
  }

      .sort((a,b) => {
        const sa = compatibleScore(role,a) * 10 + a.ovr + a.fitness/10;
        const sb = compatibleScore(role,b) * 10 + b.ovr + b.fitness/10;
        return sb-sa;
      })
      .slice(0,12);

    const current = playerById[currentId];

    return `
      <h3>Replace ${role}</h3>
      <div class="selection-info">
        Current: <strong>${current ? current.name : "Empty"}</strong>.
        Recommended players are sorted by position fit, OVR and fitness.

          <button type="button" class="pick-row" data-pick-player="${p.id}" data-pick-slot="${slotIndex}">
            <div class="pick-av">${initials(p.name)}</div>
            <div>

              <span>${p.pos}${p.secondary && p.secondary!=="-" ? " / "+p.secondary : ""} · ${roleCompatibleText(role,p)} · Fitness ${p.fitness}%</span>

            <div class="pick-ovr">${p.ovr}</div>

  function trainingModeMeta(type) {
    const map = {
      Recovery: {dxp:2, fitness:10, fatigue:"Very Low", risk:"Very Low"},
      Light: {dxp:5, fitness:-2, fatigue:"Low", risk:"Low"},
      Normal: {dxp:8, fitness:-4, fatigue:"Moderate", risk:"Low"},
      Intensive: {dxp:12, fitness:-9, fatigue:"High", risk:"High"},
      Attacking: {dxp:8, fitness:-5, fatigue:"Moderate", risk:"Moderate"},
      Defensive: {dxp:8, fitness:-5, fatigue:"Moderate", risk:"Moderate"},
      Technical: {dxp:7, fitness:-3, fatigue:"Low", risk:"Low"},
      Fitness: {dxp:7, fitness:-6, fatigue:"Moderate", risk:"Moderate"}
    };
    return map[type] || map.Normal;
  }

  function playerReadiness(player) {
    if (player.status && player.status.toLowerCase().includes("injur")) {
      return {label:"Risk", cls:"risk"};
    }
    if (player.fitness >= 85) return {label:"Ready", cls:"ready"};
    if (player.fitness >= 65) return {label:"Manage", cls:"manage"};
    return {label:"Risk", cls:"risk"};
  }

  function recommendedIndividualFocus(player) {
    if (player.pos === "ST") return "Finishing";
    if (["RW","LW","AM"].includes(player.pos)) return "Dribbling";
    if (["CM","DM"].includes(player.pos)) return "Passing";
    if (["RB","LB"].includes(player.pos)) return "Crossing";
    if (player.pos === "CB") return "Tackling";
    if (player.pos === "GK") return "Reflexes";
    return "Balanced";
  }

  async function renderTraining() {
    setHeader("Training", "PLAYER DEVELOPMENT");

    const [players, trainingState, history, fixture] = await Promise.all([
      GameService.getSquad(),
      GameService.getTrainingState(),
      GameService.getTrainingHistory(),
      GameService.getNextFixture()
    ]);

    if (!state.training.type) state.training.type = trainingState.todayType;
    if (!state.training.teamFocus) state.training.teamFocus = trainingState.teamFocus;

    const mode = trainingModeMeta(state.training.type);
    const avgFitness = Math.round(players.reduce((sum,p)=>sum+p.fitness,0)/players.length);
    const readyCount = players.filter(p=>p.fitness>=85).length;
    const manageCount = players.filter(p=>p.fitness>=65 && p.fitness<85).length;
    const riskCount = players.filter(p=>p.fitness<65).length;

    const projectedFitness = Math.max(0,Math.min(100,avgFitness + mode.fitness));
    const recoveryEffect = state.training.type === "Recovery" ? 82 :
      state.training.type === "Light" ? 62 :
      state.training.type === "Normal" ? 48 :
      state.training.type === "Intensive" ? 24 : 44;

    const devEffect = Math.min(95, 35 + mode.dxp * 4);
    const fatigueEffect = Math.min(95, Math.abs(mode.fitness) * 6 + (state.training.type === "Intensive" ? 30 : 10));

    const trainingModes = [

  function recoveryRow(label,value) {
    return `
      <div class="recovery-row">
        <span>${label}</span>
        <div class="recovery-bar"><i style="width:${Math.max(0,Math.min(100,value))}%"></i></div>
        <strong>${Math.round(value)}</strong>
      </div>
    `;

  function transferPositionGroup(pos) {
    if (pos === "GK") return "GK";
    if (["RB","CB","LB","RWB","LWB"].includes(pos)) return "DEF";
    if (["DM","CM","AM","RM","LM"].includes(pos)) return "MID";
    return "ATT";
  }

  function statusClass(status) {
    const s = String(status || "").toLowerCase();
    if (s === "pending") return "pending";
    if (s === "accepted") return "accepted";
    if (s === "outbid") return "outbid";
    if (s === "rejected") return "rejected";
    return "";
  }

  async function renderTransfers() {
    setHeader("Transfers", "MARKET & CONTRACTS");
    const [market, club, squad] = await Promise.all([
      GameService.getTransferMarket(),
      GameService.getClub(),
      GameService.getSquad()
    ]);

    const squadSize = market.squadSize || squad.length;
    const availableSlots = Math.max(0, market.squadMax - squadSize);
    const wageRoom = Math.max(0, club.wageLimit - club.wageUsed);

    const tabs = [
      ["list","Transfer List"],
      ["free","Free Agents"],
      ["bids","My Bids"],
      ["received","Offers Received"]
    ];

    root.innerHTML = `
      <div class="transfer-shell">
        <div class="transfer-summary">
          <div class="transfer-stat">
            <span>Transfer Budget</span>
            <strong>${money(club.transferBudget)}</strong>
          </div>
          <div class="transfer-stat">
            <span>Wage Room</span>
            <strong>${wage(wageRoom)}</strong>
          </div>
          <div class="transfer-stat">
            <span>Squad</span>
            <strong>${squadSize}/${market.squadMax}</strong>
          </div>
          <div class="transfer-stat">
            <span>Window</span>
            <strong style="font-size:14px">${market.windowOpen ? "OPEN" : "CLOSED"}</strong>
            <div class="kpi-sub">${market.windowLabel} · ${market.closesIn}</div>
          </div>
        </div>

        <div class="transfer-tabs" id="transferTabs">
          ${tabs.map(([key,label]) => `
            <button type="button" class="transfer-tab ${state.transfers.tab===key?"active":""}" data-transfer-tab="${key}">${label}</button>
          `).join("")}
        </div>

        <div id="transferContent"></div>
      </div>
    `;

    const content = document.getElementById("transferContent");

    if (state.transfers.tab === "list") {
      renderTransferList(content, market, club, squadSize, availableSlots, wageRoom);
    } else if (state.transfers.tab === "free") {
      renderFreeAgents(content, market, club, availableSlots, wageRoom);
    } else if (state.transfers.tab === "bids") {
      renderMyBids(content, market);
    } else {
      renderOffersReceived(content, market, squadSize);
    }

    root.querySelectorAll("[data-transfer-tab]").forEach(btn => {
      btn.addEventListener("click", () => {
        state.transfers.tab = btn.dataset.transferTab;
        state.transfers.selectedPlayer = null;
        renderTransfers();
      });
    });
  }

  function renderTransferList(container, market, club, squadSize, availableSlots, wageRoom) {
    const positions = [["ALL","All"],["GK","GK"],["DEF","DEF"],["MID","MID"],["ATT","ATT"]];
    const q = state.transfers.search.trim().toLowerCase();

    const filtered = market.transferList.filter(p => {
      const matchesPos = state.transfers.position === "ALL" || transferPositionGroup(p.pos) === state.transfers.position;
      const matchesSearch = !q || p.name.toLowerCase().includes(q) || p.club.toLowerCase().includes(q) || p.pos.toLowerCase().includes(q);
      const a=state.transferAdvanced;
      return matchesPos && matchesSearch && p.ovr>=a.minOvr && (a.tier==="ALL"||p.tier===a.tier) && p.age<=a.maxAge && p.price<=a.maxPrice;
    });

    container.innerHTML = `
      <article class="card section-card">
        <div class="transfer-toolbar">
          <div class="transfer-filter-group" id="transferPosFilters">
            ${positions.map(([value,label]) => `
              <button type="button" class="filter-btn ${state.transfers.position===value?"active":""}" data-market-pos="${value}">${label}</button>
            `).join("")}
          </div>
          <input id="transferSearch" class="search-box" type="search" placeholder="Search player or club..." value="${escapeHtml(state.transfers.search)}" />
        </div>

        <div class="advanced-filters">
          <select class="game-select" id="filterOvr"><option value="0">Any OVR</option><option value="75">75+</option><option value="80">80+</option><option value="85">85+</option></select>
          <select class="game-select" id="filterTier"><option value="ALL">Any Tier</option><option>S</option><option>A</option><option>B</option><option>C</option><option>D</option></select>
          <select class="game-select" id="filterAge"><option value="99">Any Age</option><option value="23">≤23</option><option value="27">≤27</option><option value="30">≤30</option></select>
          <select class="game-select" id="filterPrice"><option value="999999999">Any Price</option><option value="10000000">≤£10M</option><option value="20000000">≤£20M</option><option value="40000000">≤£40M</option></select>
          <button class="secondary-btn" id="clearAdvancedFilters" type="button">Clear Filters</button>
        </div>
        <div style="height:14px"></div>

        <div class="transfer-grid">
          ${filtered.map(p => `
            <article class="market-card">
              <div class="market-head">
                <div class="market-avatar">${initials(p.name)}</div>
                <div>
                  <strong>${p.name}</strong>
                  <span>${p.club} · ${p.pos}${p.secondary && p.secondary!=="-" ? " / "+p.secondary : ""}</span>
                </div>
                <div class="market-ovr">${p.ovr}</div>
              </div>
              <div class="market-meta">
                <div><span>Price</span><strong>${money(p.price)}</strong></div>
                <div><span>Wage</span><strong>${wage(p.wage)}</strong></div>
                <div><span>Age</span><strong>${p.age}</strong></div>
                <div><span>Tier</span><strong>${p.tier}</strong></div>
                <div><span>Potential</span><strong>${p.potential}</strong></div>
                <div><span>Fitness</span><strong>${p.fitness}%</strong></div>
              </div>
              <div class="cooldown-tag">New purchase: resale locked for minimum 2 matchdays.</div>
              <div class="market-actions">
                <button class="watch-btn" type="button" data-market-watch="${p.id}">Watch</button>
                <button class="offer-btn" type="button" data-market-offer="${p.id}">Make Offer</button>
              </div>
            </article>
          `).join("") || `<div class="placeholder"><div><strong>No players found</strong><p>Try another search or position filter.</p></div></div>`}
        </div>
      </article>

      ${state.transfers.selectedPlayer ? buildOfferPanel(
        market.transferList.find(p=>p.id===state.transfers.selectedPlayer),
        club, squadSize, availableSlots, wageRoom
      ) : ""}
    `;

    container.querySelectorAll("[data-market-pos]").forEach(btn => {
      btn.addEventListener("click", () => {
        state.transfers.position = btn.dataset.marketPos;
        renderTransfers();
      });
    });

    const filterOvr=document.getElementById("filterOvr"), filterTier=document.getElementById("filterTier"), filterAge=document.getElementById("filterAge"), filterPrice=document.getElementById("filterPrice");
    if(filterOvr){filterOvr.value=String(state.transferAdvanced.minOvr);filterOvr.addEventListener("change",()=>{state.transferAdvanced.minOvr=Number(filterOvr.value);renderTransfers();});}
    if(filterTier){filterTier.value=state.transferAdvanced.tier;filterTier.addEventListener("change",()=>{state.transferAdvanced.tier=filterTier.value;renderTransfers();});}
    if(filterAge){filterAge.value=String(state.transferAdvanced.maxAge);filterAge.addEventListener("change",()=>{state.transferAdvanced.maxAge=Number(filterAge.value);renderTransfers();});}
    if(filterPrice){filterPrice.value=String(state.transferAdvanced.maxPrice);filterPrice.addEventListener("change",()=>{state.transferAdvanced.maxPrice=Number(filterPrice.value);renderTransfers();});}
    document.getElementById("clearAdvancedFilters")?.addEventListener("click",()=>{state.transferAdvanced={minOvr:0,tier:"ALL",maxAge:99,maxPrice:999999999};renderTransfers();});

    const search = document.getElementById("transferSearch");
    if (search) search.addEventListener("input", () => {
      state.transfers.search = search.value;
      renderTransfers();
    });

    container.querySelectorAll("[data-market-watch]").forEach(btn => {
      btn.addEventListener("click", () => showToast("Added to watchlist (mock)."));

    container.querySelectorAll("[data-market-offer]").forEach(btn => {

        const player = market.transferList.find(p=>p.id===btn.dataset.marketOffer);
        state.transfers.selectedPlayer = player.id;
        state.transfers.offerAmount = player.price;
        state.transfers.contractYears = 2;
        renderTransfers();
      });
    });

    wireOfferPanel(container, market, club, availableSlots, wageRoom);
  }

  function buildOfferPanel(player, club, squadSize, availableSlots, wageRoom) {
    if (!player) return "";
    const amount = state.transfers.offerAmount || player.price;
    const afterBudget = club.transferBudget - amount;
    const contractYears = state.transfers.contractYears || 2;
    const financeOk = amount <= club.transferBudget;
    const wageOk = player.wage <= wageRoom;
    const squadOk = availableSlots > 0;
    const allOk = financeOk && wageOk && squadOk;

    return `
      <div style="height:16px"></div>
      <div class="offer-panel">
        <article class="card offer-box">
          <div class="section-head">
            <div>
              <p class="eyebrow">DIRECT OFFER</p>
              <h2>${player.name}</h2>
              <p>${player.club} · Asking ${money(player.price)}</p>
            </div>
            <span class="badge">${player.pos} · OVR ${player.ovr}</span>
          </div>

          <div class="offer-player">
            <div class="market-avatar">${initials(player.name)}</div>
            <div>
              <strong>${player.name}</strong>
              <span>${player.pos} · Age ${player.age} · Tier ${player.tier}</span>
            </div>
            <strong>${money(player.price)}</strong>
          </div>

          <div style="height:14px"></div>

          <div class="offer-form">
            <div>
              <label for="offerAmount">Transfer Fee</label>
              <input id="offerAmount" class="money-input" type="number" min="0" step="500000" value="${amount}" />
            </div>
            <div>
              <label for="offerContract">Contract Length</label>
              <select id="offerContract" class="game-select" style="width:100%">
                ${[1,2,3].map(y=>`<option value="${y}" ${contractYears===y?"selected":""}>${y} season${y>1?"s":""}</option>`).join("")}
              </select>
            </div>
            <button class="primary-btn" id="submitOfferBtn" type="button" ${allOk ? "" : "disabled"}>Submit Offer</button>
          </div>
        </article>

        <article class="card offer-box">
          <div class="section-head">
            <div>
              <p class="eyebrow">DEAL CHECK</p>
              <h2>Financial Preview</h2>
            </div>
          </div>

          <div class="offer-preview">
            <div class="preview-row"><span>Transfer Budget</span><strong>${money(club.transferBudget)}</strong></div>
            <div class="preview-row"><span>Offer</span><strong>${money(amount)}</strong></div>
            <div class="preview-row"><span>Budget After Deal</span><strong class="${afterBudget>=0?"good":"danger"}">${money(Math.max(0,afterBudget))}</strong></div>
            <div class="preview-row"><span>Player Wage</span><strong>${wage(player.wage)}</strong></div>
            <div class="preview-row"><span>Wage Room</span><strong class="${wageOk?"good":"danger"}">${wage(wageRoom)}</strong></div>
            <div class="preview-row"><span>Squad Slots</span><strong class="${squadOk?"good":"danger"}">${availableSlots}</strong></div>
            <div class="preview-row"><span>Contract</span><strong>${contractYears} season${contractYears>1?"s":""}</strong></div>
          </div>

          <div style="height:12px"></div>
          ${allOk
            ? `<div class="finance-ok">Offer passes current mock checks: transfer budget, wage room and squad limit. Real settlement will be atomic server-side; accepted purchase receives a 2-matchday resale cooldown.</div>`
            : `<div class="finance-warning">${!financeOk?"Transfer budget insufficient. ":""}${!wageOk?"Wage room insufficient. ":""}${!squadOk?"Squad already at maximum size.":""}</div>`}
        </article>
      </div>
    `;
  }

  function wireOfferPanel(container, market, club, availableSlots, wageRoom) {
    const amountInput = document.getElementById("offerAmount");
    const contractSelect = document.getElementById("offerContract");
    const submit = document.getElementById("submitOfferBtn");

    if (amountInput) {
      amountInput.addEventListener("change", () => {
        state.transfers.offerAmount = Math.max(0, Number(amountInput.value || 0));
        renderTransfers();
      });
    }
    if (contractSelect) {
      contractSelect.addEventListener("change", () => {
        state.transfers.contractYears = Number(contractSelect.value);
        renderTransfers();
      });
    }
    if (submit) {
      submit.addEventListener("click", () => {
        const p = market.transferList.find(x=>x.id===state.transfers.selectedPlayer);
        showToast(`Offer ${money(state.transfers.offerAmount)} submitted for ${p.name} (mock).`);
        state.transfers.selectedPlayer = null;
        renderTransfers();
      });
    }
  }

  function matchEventIcon(type) {
    return {goal:"⚽",shot:"↗",save:"🧤",card:"■",sub:"⇄",info:"i"}[type] || "•";
  }

  function generateMockEvent(minute) {
    const homeAttack = 0.53;
    const isHome = Math.random() < homeAttack;
    const team = isHome ? "MS7 FC" : "Northstar United";
    const shotRoll = Math.random();

    if (shotRoll < 0.22) {
      const xg = +(0.04 + Math.random()*0.36).toFixed(2);
      if (isHome) {
        state.match.shotsHome++;
        state.match.xgHome = +(state.match.xgHome + xg).toFixed(2);
      } else {
        state.match.shotsAway++;
        state.match.xgAway = +(state.match.xgAway + xg).toFixed(2);
      }

      const onTarget = Math.random() < 0.48;
      if (onTarget) {
        if (isHome) state.match.sotHome++; else state.match.sotAway++;
        const goal = Math.random() < Math.min(.72, xg + .15);
        if (goal) {
          if (isHome) state.match.homeScore++; else state.match.awayScore++;
          return {minute,type:"goal",text:`GOAL — ${team} finish a ${xg.toFixed(2)} xG chance.`};
        }
        return {minute,type:"save",text:`Save! ${team} test the goalkeeper.`};
      }
      return {minute,type:"shot",text:`${team} attempt misses the target.`};
    }

    if (shotRoll < 0.28) {
      if(Math.random()<0.5){state.match.cardsHome++;state.match.foulsHome++;}else{state.match.cardsAway++;state.match.foulsAway++;}
      return {minute,type:"card",text:`Yellow card shown after a late challenge.`};
    }
    if (shotRoll < 0.31) return {minute,type:"sub",text:`Substitution made to refresh the team.`};
    if (shotRoll < 0.38) { if(isHome) state.match.cornersHome++; else state.match.cornersAway++; return {minute,type:"info",text:`${team} win a corner.`}; }
    if (shotRoll < 0.46) { if(isHome) state.match.foulsAway++; else state.match.foulsHome++; return {minute,type:"info",text:`Foul in midfield.`}; }
    return null;
  }

  async function renderInbox() {
    setHeader("Inbox", "NOTIFICATIONS");
    const notes = await GameService.getNotifications();
    const categories = ["All","Unread","Match","Transfer","Player","Finance","League"];
    const filtered = notes.filter(n => {
      if (state.inbox.filter === "All") return true;
      if (state.inbox.filter === "Unread") return !n.read;
      return n.category === state.inbox.filter;
    });

    root.innerHTML = `
      <div class="inbox-layout">
        <aside class="inbox-filters">
          ${categories.map(c=>`<button type="button" class="inbox-filter ${state.inbox.filter===c?"active":""}" data-inbox-filter="${c}">${c}</button>`).join("")}
          <button class="secondary-btn" id="markAllReadBtn" type="button">Mark all read</button>
        </aside>
        <article class="card section-card">
          <div class="section-head">
            <div><p class="eyebrow">MANAGER INBOX</p><h2>${state.inbox.filter}</h2><p>Match, transfer, player, finance and league updates.</p></div>
            <span class="badge">${filtered.length} items</span>
          </div>
          <div class="notification-list">
            ${filtered.length ? filtered.map(n=>`
              <div class="notification-card ${n.read?"":"unread"}">
                <div class="notification-symbol">${{Match:"▶",Transfer:"£",Player:"XI",Finance:"$",League:"LG"}[n.category]||"i"}</div>
                <div>
                  <strong>${n.title}</strong>
                  <p>${n.message}</p>
                  <div class="notification-actions">
                    ${!n.read?`<button class="auth-link" type="button" data-note-read="${n.id}">Mark read</button>`:""}
                  </div>
                </div>
                <time>${n.time}</time>
              </div>`).join("") : `<div class="placeholder"><div><strong>No notifications</strong><p>Nothing in this category.</p></div></div>`}
          </div>
        </article>
      </div>`;

    root.querySelectorAll("[data-inbox-filter]").forEach(btn=>{
      btn.addEventListener("click",()=>{state.inbox.filter=btn.dataset.inboxFilter;renderInbox();});
    });
    root.querySelectorAll("[data-note-read]").forEach(btn=>{
      btn.addEventListener("click",()=>{
        const note = window.MockDB.notifications.find(n=>n.id===btn.dataset.noteRead);
        if (note) note.read=true;
        refreshNotificationCounts(); renderInbox();
      });
    });
    document.getElementById("markAllReadBtn")?.addEventListener("click",()=>{
      window.MockDB.notifications.forEach(n=>n.read=true);
      refreshNotificationCounts(); renderInbox();
    });
  }

          ${fact("Reference Season", p.refSeason)}
          ${fact("Reference Club", p.refClub)}
          ${fact("Primary / Secondary", p.pos + " / " + (p.secondary||"-"))}
          ${fact("Injury", p.injury?.level||"None")}
          ${fact("Suspension", p.suspension?.active ? p.suspension.matches+" match" : "None")}
          ${fact("Retirement Risk", p.retirementRisk||"Low")}
          ${fact("Resale Cooldown", (p.resaleCooldown||0)+" matchday")}
        </div>
      </div>

      <div class="attributes"><h3>Positional OVR & Familiarity</h3><div class="player-facts">${(p.positionOvrs||[]).map(x=>fact(x.position,`${x.ovr} · ${x.familiarity}`)).join("")}</div></div>
      <div class="attributes"><h3>Season Statistics</h3><div class="player-facts">${fact("Appearances",p.stats?.appearances??0)}${fact("Starts",p.stats?.starts??0)}${fact("Minutes",p.stats?.minutes??0)}${fact("Goals",p.stats?.goals??0)}${fact("Assists",p.stats?.assists??0)}${fact("Avg Rating",p.stats?.avgRating??"-")}${fact("Clean Sheets",p.stats?.cleanSheets??0)}</div></div>
      <div class="attributes"><h3>Injury / Availability</h3><div class="player-facts">${fact("Level",p.injury?.level||"None")}${fact("Matches Affected",p.injury?.matchesAffected??0)}${fact("Playable",p.injury?.playable===false?"No":"Yes")}${fact("Expected Return Fitness",(p.injury?.returnFitness??p.fitness)+"%")}</div></div>
      <div class="attributes"><h3>Development Outlook</h3><div class="player-facts">${fact("Age Multiplier",p.age<=20?"1.35×":p.age<=22?"1.25×":p.age<=24?"1.15×":p.age<=26?"1.00×":p.age<=28?"0.85×":p.age<=30?"0.60×":p.age<=32?"0.35×":"0.15×")}${fact("Season Growth Band",p.age<=24?"Typically +1 to +3 OVR":p.age<=28?"Typically 0 to +1 OVR":"Stable / decline risk")}${fact("Potential",p.potential)}${fact("Retirement Risk",p.retirementRisk||"Low")}</div><div class="subtext">Potential remains a hidden soft ceiling; only the label is shown. Physical attributes decline earlier than technical/positioning attributes.</div></div>
      <div class="attributes"><h3>Contract Actions</h3><div class="contract-panel"><div class="contract-actions"><select id="renewContractYears" class="game-select">${[1,2,3].map(y=>`<option value="${y}">${y} season${y>1?'s':''}</option>`).join("")}</select><button class="secondary-btn" id="renewContractBtn">Renew Contract</button><button class="reject-btn" id="releasePlayerBtn">Release Player</button></div><div class="subtext">Contract max 3 seasons. Early release compensation: approximately 30–50% remaining wages.</div></div></div>
      <div class="attributes"><h3>Game Career History</h3><div class="table-wrap"><table class="career-table"><thead><tr><th>Season</th><th>Club</th><th>Apps</th><th>Goals</th><th>Assists</th><th>Rating</th></tr></thead><tbody>${(p.careerHistory||[]).map(h=>`<tr><td>${h.season}</td><td>${h.club}</td><td>${h.apps}</td><td>${h.goals}</td><td>${h.assists}</td><td>${h.rating}</td></tr>`).join("")}</tbody></table></div></div>

      <div class="attributes">
        <h3>Attributes</h3>
        <div class="attr-grid">
          ${Object.entries(p.attributes).map(([name,value]) => `
            <div class="attr">
              <span>${name}</span>
              <div class="attr-bar"><i style="width:${value}%"></i></div>
              <strong>${value}</strong>
            </div>
          `).join("")}
        </div>
      </div>
    `;

    document.getElementById("renewContractBtn")?.addEventListener("click",()=>{const y=Number(document.getElementById("renewContractYears").value);p.contract=y;showToast(`${p.name} renewed for ${y} season${y>1?'s':''} (mock).`);});
    document.getElementById("releasePlayerBtn")?.addEventListener("click",()=>showToast(`${p.name} release flow opened; compensation 30–50% remaining wages (mock).`));
    playerDialog.showModal();
  }

  function fact(label, value) {
    return `<div class="fact"><span>${label}</span><strong>${value}</strong></div>`;
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, ch => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    })[ch]);
  }

  async function render() {
    if (state.view === "draw") await renderDraw();
    else if (state.view === "squad") await renderSquad();
    else if (state.view === "tactics") await renderTactics();
    else if (state.view === "training") await renderTraining();
    else if (state.view === "transfers") await renderTransfers();
    else if (state.view === "league") await renderLeague();
    else if (state.view === "match") await renderMatch();
    else if (state.view === "club") await renderClub();
    else if (state.view === "season") await renderSeason();
    else if (state.view === "inbox") await renderInbox();
    else if (state.view === "admin") await renderAdmin();
    else await renderHome();
    refreshNotificationCounts();
  }

  if (false && "serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }

  const savedSession = localStorage.getItem("fmMiniSession");
  if (savedSession === "active") {
    state.session.loggedIn = true;
    authRoot.innerHTML = "";
    gameApp.classList.remove("is-hidden");
    syncActiveNav();
    render();
    refreshNotificationCounts();
  } else {
    showAuth();
  }
})();

</script>
</body>
</html>
