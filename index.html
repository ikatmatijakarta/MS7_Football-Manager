<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#06152e" />
  <meta name="description" content="MS7 Football Manager Mini Online — Preseason Access V1" />
  <meta name="application-name" content="FM Mini Online" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FM Mini Online" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="./icons/favicon-64.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
  <title>MS7 Football Manager Mini Online</title>
<style>
:root{
  --bg:#0b1020;
  --panel:#121a2c;
  --panel-2:#182238;
  --panel-3:#0f1728;
  --text:#f7f9fc;
  --muted:#94a3b8;
  --line:#273249;
  --accent:#5eead4;
  --accent-2:#67e8f9;
  --good:#4ade80;
  --warn:#fbbf24;
  --danger:#fb7185;
  --shadow:0 18px 45px rgba(0,0,0,.22);
  --radius:18px;
  --radius-sm:12px;
}

*{box-sizing:border-box}
html{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
body{margin:0;min-width:320px;background:
  radial-gradient(circle at 10% 0%,rgba(94,234,212,.08),transparent 24rem),
  radial-gradient(circle at 100% 25%,rgba(103,232,249,.06),transparent 28rem),
  var(--bg);
}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app-shell{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}
.sidebar{
  position:sticky;top:0;height:100vh;padding:24px 18px;border-right:1px solid var(--line);
  background:rgba(10,15,29,.92);backdrop-filter:blur(16px);display:flex;flex-direction:column;z-index:30
}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 24px}
.brand-mark{
  width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
  font-weight:900;color:#07111d;background:linear-gradient(135deg,var(--accent),var(--accent-2))
}
.brand strong{display:block;font-size:15px;letter-spacing:.01em}
.brand span{display:block;font-size:12px;color:var(--muted);margin-top:2px}

.nav{display:grid;gap:8px}
.nav-item{
  border:0;background:transparent;color:var(--muted);display:flex;align-items:center;gap:12px;
  min-height:46px;border-radius:12px;padding:0 12px;text-align:left
}
.nav-item:hover{background:rgba(255,255,255,.04);color:var(--text)}
.nav-item.active{background:rgba(94,234,212,.11);color:var(--accent)}
.nav-icon{
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  border:1px solid currentColor;font-size:12px;font-weight:800
}
.sidebar-footer{margin-top:auto;display:grid;gap:12px;padding:16px 8px 0}
.season-chip{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:16px;color:var(--muted)}
.season-chip strong{color:var(--text)}
.build-note{font-size:11px;color:#64748b}

.main{min-width:0}
.topbar{
  min-height:88px;display:flex;align-items:center;justify-content:space-between;gap:18px;
  padding:18px clamp(18px,3vw,40px);border-bottom:1px solid var(--line);
  background:rgba(11,16,32,.78);backdrop-filter:blur(14px);position:sticky;top:0;z-index:20
}
.topbar-left{display:flex;align-items:center;gap:14px}
.eyebrow{margin:0 0 5px;font-size:10px;letter-spacing:.18em;color:var(--accent);font-weight:800}
h1,h2,h3,p{margin-top:0}
h1{font-size:clamp(22px,3vw,30px);margin-bottom:0}
.topbar-actions{display:flex;align-items:center;gap:12px}
.match-countdown{display:grid;text-align:right;font-size:11px;color:var(--muted)}
.match-countdown strong{font-size:13px;color:var(--text);margin-top:2px}
.avatar-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font-weight:800}
.mobile-menu{display:none;width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text)}

.view-root{padding:clamp(18px,3vw,38px);max-width:1500px;margin:0 auto}
.grid{display:grid;gap:16px}
.kpi-grid{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}
.card{background:linear-gradient(180deg,rgba(24,34,56,.94),rgba(16,24,41,.94));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.kpi{padding:18px}
.kpi-label{color:var(--muted);font-size:12px;margin-bottom:8px}
.kpi-value{font-size:clamp(22px,3vw,30px);font-weight:900}
.kpi-sub{margin-top:8px;font-size:11px;color:var(--muted)}
.good{color:var(--good)}
.warn{color:var(--warn)}
.danger{color:var(--danger)}

.dashboard-grid{grid-template-columns:minmax(0,1.4fr) minmax(300px,.8fr)}
.stack{display:grid;gap:16px}
.section-card{padding:20px}
.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.section-head h2{font-size:17px;margin-bottom:3px}
.section-head p{font-size:12px;color:var(--muted);margin-bottom:0}
.badge{
  display:inline-flex;align-items:center;min-height:26px;padding:0 9px;border-radius:999px;
  border:1px solid var(--line);font-size:11px;color:var(--muted);white-space:nowrap
}
.badge.live{color:var(--accent);border-color:rgba(94,234,212,.35);background:rgba(94,234,212,.08)}

.fixture-card{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;
  padding:22px;border-radius:16px;background:var(--panel-3);border:1px solid var(--line)
}
.team{text-align:center}
.team-logo{
  width:58px;height:58px;margin:0 auto 10px;border-radius:18px;display:grid;place-items:center;
  background:linear-gradient(145deg,#25344f,#131d30);border:1px solid #34425d;font-weight:900
}
.team strong{display:block;font-size:14px}
.team span{font-size:11px;color:var(--muted)}
.fixture-meta{text-align:center;min-width:110px}
.fixture-meta strong{font-size:18px}
.fixture-meta span{display:block;font-size:11px;color:var(--muted);margin-top:5px}
.primary-btn{
  margin-top:16px;width:100%;min-height:44px;border:0;border-radius:12px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#06111d;font-weight:900
}
.secondary-btn{
  min-height:40px;padding:0 14px;border-radius:11px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--text);font-weight:700
}

.form-bars{display:grid;gap:12px}
.form-row{display:grid;grid-template-columns:90px 1fr 42px;gap:10px;align-items:center;font-size:12px}
.form-row span:first-child{color:var(--muted)}
.bar{height:8px;border-radius:999px;background:#222d43;overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.form-row strong{text-align:right}

.activity-list{display:grid;gap:10px}
.activity{
  display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--line)
}
.activity:last-child{border-bottom:0}
.activity-icon{width:32px;height:32px;border-radius:10px;background:#202c44;display:grid;place-items:center;font-size:12px}
.activity strong{font-size:12px;display:block}
.activity p{margin:3px 0 0;color:var(--muted);font-size:11px}
.activity time{font-size:10px;color:#64748b}

.quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.quick-card{padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--panel-3)}
.quick-card strong{font-size:14px}
.quick-card p{font-size:11px;color:var(--muted);margin:6px 0 0}

.squad-toolbar{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px
}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filter-btn{
  min-height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);color:var(--muted);font-size:12px
}
.filter-btn.active{border-color:rgba(94,234,212,.4);background:rgba(94,234,212,.09);color:var(--accent)}
.search-box{
  min-height:40px;min-width:min(280px,100%);border:1px solid var(--line);border-radius:11px;
  padding:0 13px;background:var(--panel);color:var(--text)
}
.search-box::placeholder{color:#64748b}

.table-card{overflow:hidden}
.table-wrap{overflow:auto}
.squad-table{width:100%;border-collapse:collapse;min-width:850px}
.squad-table th{
  text-align:left;padding:13px 15px;font-size:10px;letter-spacing:.08em;color:#718096;
  background:#0e1626;border-bottom:1px solid var(--line);position:sticky;top:0
}
.squad-table td{padding:13px 15px;border-bottom:1px solid var(--line);font-size:12px}
.squad-table tr:last-child td{border-bottom:0}
.squad-table tbody tr{transition:.18s}
.squad-table tbody tr:hover{background:rgba(255,255,255,.025)}
.player-cell{display:flex;align-items:center;gap:11px;min-width:210px}
.player-avatar{
  width:36px;height:36px;border-radius:12px;background:#24314b;display:grid;place-items:center;font-weight:900;font-size:11px
}
.player-name-btn{border:0;background:none;color:var(--text);padding:0;text-align:left;font-weight:800}
.player-name-btn:hover{color:var(--accent)}
.subtext{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.pos{
  display:inline-grid;place-items:center;min-width:34px;height:26px;border-radius:8px;
  background:#1e293b;border:1px solid #334155;font-weight:800;font-size:10px
}
.ovr{
  display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;
  background:rgba(94,234,212,.11);border:1px solid rgba(94,234,212,.35);color:var(--accent);font-weight:900
}
.fitness{display:flex;align-items:center;gap:8px}
.fitness-bar{width:70px;height:6px;border-radius:999px;background:#253047;overflow:hidden}
.fitness-bar i{display:block;height:100%;background:var(--good)}
.tag{display:inline-flex;align-items:center;min-height:25px;padding:0 8px;border-radius:999px;font-size:10px;border:1px solid var(--line);color:var(--muted)}
.tag.high{color:var(--good);border-color:rgba(74,222,128,.3);background:rgba(74,222,128,.07)}
.tag.med{color:var(--warn);border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.07)}

.player-dialog{
  width:min(720px,calc(100% - 28px));max-height:88vh;overflow:auto;padding:0;border:1px solid var(--line);
  border-radius:22px;background:#0f1728;color:var(--text);box-shadow:0 28px 80px rgba(0,0,0,.5)
}
.player-dialog::backdrop{background:rgba(3,8,18,.72);backdrop-filter:blur(4px)}
.dialog-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:22px;
  position:sticky;top:0;background:#0f1728;border-bottom:1px solid var(--line);z-index:2
}
.dialog-head h2{margin-bottom:0}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
.player-summary{padding:20px;display:grid;grid-template-columns:130px minmax(0,1fr);gap:18px}
.big-rating{
  border:1px solid rgba(94,234,212,.3);border-radius:20px;background:rgba(94,234,212,.07);
  min-height:130px;display:grid;place-items:center;text-align:center
}
.big-rating strong{font-size:44px;line-height:1;color:var(--accent)}
.big-rating span{font-size:11px;color:var(--muted)}
.player-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fact{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.fact span{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}
.fact strong{font-size:13px}
.attributes{padding:0 20px 22px}
.attributes h3{font-size:14px;margin-bottom:12px}
.attr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.attr{display:grid;grid-template-columns:110px 1fr 34px;align-items:center;gap:10px;font-size:11px}
.attr span:first-child{color:var(--muted)}
.attr-bar{height:7px;border-radius:999px;background:#243047;overflow:hidden}
.attr-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.attr strong{text-align:right}

.placeholder{
  min-height:300px;display:grid;place-items:center;text-align:center;padding:30px
}
.placeholder strong{display:block;font-size:20px;margin-bottom:7px}
.placeholder p{color:var(--muted);max-width:460px}

.toast{
  position:fixed;right:18px;bottom:18px;max-width:min(360px,calc(100% - 36px));padding:13px 16px;border-radius:12px;
  background:#172136;border:1px solid var(--line);box-shadow:var(--shadow);font-size:12px;
  opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s;z-index:100
}
.toast.show{opacity:1;transform:translateY(0)}

.mobile-backdrop{display:none}

@media(max-width:1050px){
  .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dashboard-grid{grid-template-columns:1fr}
}

@media(max-width:760px){
  .app-shell{grid-template-columns:1fr}
  .sidebar{
    position:fixed;left:0;top:0;width:250px;transform:translateX(-105%);transition:.22s;
    box-shadow:20px 0 60px rgba(0,0,0,.35)
  }
  .sidebar.open{transform:translateX(0)}
  .mobile-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25}
  .mobile-backdrop.show{display:block}
  .mobile-menu{display:grid;place-items:center}
  .topbar{padding:14px 16px;min-height:74px}
  .view-root{padding:16px}
  .match-countdown{display:none}
  .kpi-grid{grid-template-columns:1fr 1fr}
  .fixture-card{grid-template-columns:1fr auto 1fr;padding:16px;gap:8px}
  .team-logo{width:48px;height:48px}
  .quick-grid{grid-template-columns:1fr}
  .player-summary{grid-template-columns:1fr}
  .big-rating{min-height:100px}
}

@media(max-width:470px){
  .kpi-grid{grid-template-columns:1fr}
  .topbar h1{font-size:21px}
  .fixture-meta{min-width:80px}
  .player-facts{grid-template-columns:1fr 1fr}
  .attr-grid{grid-template-columns:1fr}
  .filters{display:grid;grid-template-columns:repeat(3,1fr);width:100%}
  .filter-btn{padding:0 8px}
  .search-box{width:100%;min-width:0}
}


/* ===========================
   TACTICS V1
   =========================== */

.tactics-layout{
  display:grid;
  grid-template-columns:minmax(520px,1.25fr) minmax(320px,.75fr);
  gap:18px;
  align-items:start;
}

.tactics-left,.tactics-right{display:grid;gap:16px}

.tactics-toolbar{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:16px 18px;
}

.select-group{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
}
.select-group label{
  font-size:11px;
  color:var(--muted);
  font-weight:700;
}
.game-select{
  min-height:40px;
  padding:0 12px;
  border-radius:11px;
  border:1px solid var(--line);
  background:#10192a;
  color:var(--text);
  font-weight:700;
  outline:none;
}
.game-select:focus{border-color:rgba(94,234,212,.55)}
.tactics-actions{display:flex;gap:8px;flex-wrap:wrap}

.pitch-card{padding:18px}
.pitch-shell{
  position:relative;
  width:100%;
  aspect-ratio:68 / 100;
  max-height:740px;
  margin:0 auto;
  border-radius:20px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.12);
  background:
    repeating-linear-gradient(
      90deg,
      rgba(255,255,255,.018) 0,
      rgba(255,255,255,.018) 12.5%,
      rgba(255,255,255,.035) 12.5%,
      rgba(255,255,255,.035) 25%
    ),
    linear-gradient(180deg,#123c32,#0b2f29);
}
.pitch-lines{position:absolute;inset:4%;pointer-events:none}
.pitch-lines::before{
  content:"";
  position:absolute;inset:0;
  border:2px solid rgba(255,255,255,.44);
  border-radius:2px;
}
.pitch-mid{
  position:absolute;left:4%;right:4%;top:50%;height:2px;
  background:rgba(255,255,255,.44);
}
.pitch-circle{
  position:absolute;left:50%;top:50%;
  width:19%;aspect-ratio:1;border:2px solid rgba(255,255,255,.44);
  border-radius:50%;transform:translate(-50%,-50%);
}
.pitch-circle::after{
  content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;
  background:rgba(255,255,255,.55);transform:translate(-50%,-50%);
}
.penalty-box{
  position:absolute;left:24%;width:52%;height:16%;
  border:2px solid rgba(255,255,255,.44)
}
.penalty-box.top{top:4%;border-top:0}
.penalty-box.bottom{bottom:4%;border-bottom:0}
.goal-box{
  position:absolute;left:38%;width:24%;height:7%;
  border:2px solid rgba(255,255,255,.44)
}
.goal-box.top{top:4%;border-top:0}
.goal-box.bottom{bottom:4%;border-bottom:0}
.goal-mouth{
  position:absolute;left:42%;width:16%;height:2%;
  border:2px solid rgba(255,255,255,.44)
}
.goal-mouth.top{top:2.2%}
.goal-mouth.bottom{bottom:2.2%}

.pitch-players{
  position:absolute;inset:0;
}
.pitch-player{
  position:absolute;
  width:82px;
  transform:translate(-50%,-50%);
  text-align:center;
  user-select:none;
}
.pitch-player button{
  width:54px;height:54px;border-radius:50%;
  border:2px solid rgba(255,255,255,.66);
  background:linear-gradient(145deg,#233650,#132033);
  color:var(--text);
  font-weight:900;
  box-shadow:0 8px 16px rgba(0,0,0,.28);
  transition:.16s;
}
.pitch-player button:hover{
  transform:translateY(-2px);
  border-color:var(--accent);
}
.pitch-player.selected button{
  border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(94,234,212,.12),0 10px 18px rgba(0,0,0,.32)
}
.pitch-player .pname{
  display:block;
  margin-top:5px;
  font-size:9px;
  font-weight:800;
  text-shadow:0 2px 4px rgba(0,0,0,.75);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.pitch-player .ppos{
  display:inline-block;
  margin-top:2px;
  padding:2px 6px;
  font-size:8px;
  border-radius:999px;
  background:rgba(7,17,28,.78);
  border:1px solid rgba(255,255,255,.14);
  color:#d8e2f0;
}
.pitch-player .ovr-dot{
  position:absolute;
  top:-4px;right:6px;
  min-width:22px;height:22px;
  padding:0 4px;
  display:grid;place-items:center;
  border-radius:999px;
  background:var(--accent);
  color:#051018;
  border:2px solid #0d1728;
  font-size:9px;
  font-weight:900;
}

.lineup-summary{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
  margin-top:14px;
}
.lineup-stat{
  padding:11px 12px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#0f1728;
}
.lineup-stat span{display:block;font-size:9px;color:var(--muted);margin-bottom:4px}
.lineup-stat strong{font-size:14px}

.bench-list{display:grid;gap:8px}
.bench-player{
  display:grid;
  grid-template-columns:36px minmax(0,1fr) auto;
  gap:10px;
  align-items:center;
  padding:10px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#0f1728;
}
.bench-player .bench-num{
  width:34px;height:34px;border-radius:10px;
  background:#213049;display:grid;place-items:center;
  font-size:10px;font-weight:900
}
.bench-player strong{font-size:11px;display:block}
.bench-player span{font-size:9px;color:var(--muted)}
.bench-player button{
  min-height:32px;
  padding:0 9px;
  border-radius:9px;
  border:1px solid var(--line);
  background:#172136;
  color:var(--text);
  font-size:10px;
  font-weight:800
}

.tactic-control-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.tactic-control{
  padding:12px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#0f1728;
}
.tactic-control label{
  display:block;
  color:var(--muted);
  font-size:9px;
  margin-bottom:7px;
  text-transform:uppercase;
  letter-spacing:.08em;
  font-weight:800;
}
.tactic-control select{width:100%}

.tactical-profile{
  display:grid;
  gap:9px;
}
.profile-line{
  display:grid;
  grid-template-columns:100px 1fr 36px;
  gap:8px;
  align-items:center;
  font-size:10px
}
.profile-line span:first-child{color:var(--muted)}
.profile-bar{height:7px;background:#253047;border-radius:999px;overflow:hidden}
.profile-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.profile-line strong{text-align:right}

.selection-panel{
  display:none;
  border:1px solid rgba(94,234,212,.25);
  border-radius:14px;
  background:rgba(94,234,212,.05);
  padding:12px;
}
.selection-panel.show{display:block}
.selection-panel h3{font-size:12px;margin-bottom:8px}
.selection-info{font-size:10px;color:var(--muted);margin-bottom:10px}

.player-picker{
  display:grid;gap:7px;max-height:260px;overflow:auto;padding-right:4px
}
.pick-row{
  display:grid;
  grid-template-columns:34px minmax(0,1fr) auto;
  gap:9px;align-items:center;
  width:100%;
  padding:8px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#121c2f;
  color:var(--text);
  text-align:left
}
.pick-row:hover{border-color:rgba(94,234,212,.45)}
.pick-row .pick-av{
  width:32px;height:32px;border-radius:9px;background:#22314b;
  display:grid;place-items:center;font-size:9px;font-weight:900
}
.pick-row strong{display:block;font-size:10px}
.pick-row span{font-size:9px;color:var(--muted)}
.pick-row .pick-ovr{
  width:30px;height:30px;border-radius:50%;
  border:1px solid rgba(94,234,212,.35);
  display:grid;place-items:center;color:var(--accent);font-size:10px;font-weight:900
}

.status-strip{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  margin-top:12px;padding-top:12px;border-top:1px solid var(--line)
}
.status-strip .tag{font-size:9px}

@media(max-width:1100px){
  .tactics-layout{grid-template-columns:1fr}
  .pitch-shell{max-width:650px}
}
@media(max-width:760px){
  .tactic-control-grid{grid-template-columns:1fr 1fr}
  .pitch-card{padding:12px}
  .pitch-player{width:62px}
  .pitch-player button{width:46px;height:46px;font-size:11px}
  .pitch-player .pname{font-size:8px}
  .pitch-player .ovr-dot{right:0}
}
@media(max-width:480px){
  .tactic-control-grid{grid-template-columns:1fr}
  .lineup-summary{grid-template-columns:1fr 1fr}
  .pitch-player{width:54px}
  .pitch-player button{width:42px;height:42px;font-size:10px}
  .pitch-player .pname{max-width:54px;margin-left:auto;margin-right:auto}
  .tactics-toolbar{padding:13px}
}


/* ===========================
   TRAINING V1
   =========================== */

.training-layout{
  display:grid;
  grid-template-columns:minmax(0,1.2fr) minmax(320px,.8fr);
  gap:18px;
  align-items:start;
}
.training-main,.training-side{display:grid;gap:16px}

.training-mode-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
}
.training-mode{
  min-height:112px;
  padding:14px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#0f1728;
  color:var(--text);
  text-align:left;
  transition:.16s;
}
.training-mode:hover{border-color:rgba(94,234,212,.35);transform:translateY(-1px)}
.training-mode.active{
  border-color:rgba(94,234,212,.55);
  background:rgba(94,234,212,.08);
  box-shadow:inset 0 0 0 1px rgba(94,234,212,.06);
}
.training-mode strong{display:block;font-size:13px;margin-bottom:6px}
.training-mode span{display:block;font-size:10px;color:var(--muted);line-height:1.45}
.training-mode .mode-value{margin-top:8px;color:var(--accent);font-weight:800}

.training-focus-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:9px;
}
.focus-btn{
  min-height:42px;
  border-radius:11px;
  border:1px solid var(--line);
  background:#111a2b;
  color:var(--muted);
  font-size:11px;
  font-weight:800;
}
.focus-btn.active{
  color:var(--accent);
  border-color:rgba(94,234,212,.45);
  background:rgba(94,234,212,.08);
}

.training-impact{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
}
.impact-card{
  padding:12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#0f1728;
}
.impact-card span{display:block;font-size:9px;color:var(--muted);margin-bottom:5px}
.impact-card strong{font-size:15px}
.impact-card small{display:block;margin-top:4px;font-size:9px;color:#64748b}

.readiness-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
}
.readiness-card{
  padding:12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#0f1728;
}
.readiness-card span{font-size:9px;color:var(--muted);display:block}
.readiness-card strong{display:block;font-size:20px;margin-top:4px}

.training-table{
  width:100%;
  border-collapse:collapse;
  min-width:800px;
}
.training-table th{
  text-align:left;
  padding:12px 14px;
  font-size:9px;
  color:#718096;
  letter-spacing:.08em;
  border-bottom:1px solid var(--line);
  background:#0e1626;
}
.training-table td{
  padding:11px 14px;
  border-bottom:1px solid var(--line);
  font-size:11px;
}
.training-table tr:last-child td{border-bottom:0}
.readiness-pill{
  display:inline-flex;
  min-height:24px;
  align-items:center;
  padding:0 8px;
  border-radius:999px;
  border:1px solid var(--line);
  font-size:9px;
  font-weight:800;
}
.readiness-pill.ready{color:var(--good);border-color:rgba(74,222,128,.3);background:rgba(74,222,128,.07)}
.readiness-pill.manage{color:var(--warn);border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.07)}
.readiness-pill.risk{color:var(--danger);border-color:rgba(251,113,133,.3);background:rgba(251,113,133,.07)}

.individual-focus-select{
  min-height:34px;
  border-radius:9px;
  border:1px solid var(--line);
  background:#111a2b;
  color:var(--text);
  padding:0 8px;
  font-size:10px;
}

.training-warning{
  padding:12px 13px;
  border:1px solid rgba(251,191,36,.25);
  border-radius:12px;
  background:rgba(251,191,36,.05);
  color:#d6b865;
  font-size:10px;
  line-height:1.5;
}

.training-safe{
  padding:12px 13px;
  border:1px solid rgba(74,222,128,.22);
  border-radius:12px;
  background:rgba(74,222,128,.05);
  color:#8fe0aa;
  font-size:10px;
  line-height:1.5;
}

.history-list{display:grid;gap:9px}
.history-row{
  display:grid;
  grid-template-columns:54px minmax(0,1fr) auto;
  gap:10px;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid var(--line);
}
.history-row:last-child{border-bottom:0}
.history-day{
  width:50px;height:34px;border-radius:10px;background:#1b2940;
  display:grid;place-items:center;font-size:9px;font-weight:900
}
.history-row strong{display:block;font-size:11px}
.history-row span{font-size:9px;color:var(--muted)}
.history-impact{text-align:right;font-size:9px}
.history-impact b{display:block;color:var(--accent)}

.recovery-bars{display:grid;gap:11px}
.recovery-row{
  display:grid;
  grid-template-columns:110px 1fr 42px;
  gap:8px;
  align-items:center;
  font-size:10px;
}
.recovery-row span:first-child{color:var(--muted)}
.recovery-bar{height:7px;border-radius:999px;background:#253047;overflow:hidden}
.recovery-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.recovery-row strong{text-align:right}

@media(max-width:1100px){
  .training-layout{grid-template-columns:1fr}
}
@media(max-width:760px){
  .training-mode-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .training-focus-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .training-impact{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:470px){
  .training-mode-grid{grid-template-columns:1fr}
  .training-focus-grid{grid-template-columns:1fr 1fr}
  .readiness-grid{grid-template-columns:1fr}
}


/* ===========================
   TRANSFERS V1
   =========================== */

.transfer-shell{display:grid;gap:16px}
.transfer-summary{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
}
.transfer-stat{
  padding:14px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#0f1728;
}
.transfer-stat span{display:block;font-size:9px;color:var(--muted);margin-bottom:6px}
.transfer-stat strong{font-size:18px}
.transfer-tabs{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  padding:8px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#0f1728;
}
.transfer-tab{
  min-height:38px;
  padding:0 13px;
  border-radius:10px;
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:11px;
  font-weight:800;
}
.transfer-tab.active{background:rgba(94,234,212,.1);color:var(--accent)}
.transfer-toolbar{
  display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;
}
.transfer-filter-group{display:flex;flex-wrap:wrap;gap:8px}
.transfer-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
}
.market-card{
  padding:15px;
  border:1px solid var(--line);
  border-radius:15px;
  background:#0f1728;
  display:grid;
  gap:12px;
}
.market-card:hover{border-color:rgba(94,234,212,.28)}
.market-head{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center}
.market-avatar{
  width:42px;height:42px;border-radius:12px;background:#22314b;display:grid;place-items:center;font-size:10px;font-weight:900
}
.market-head strong{display:block;font-size:12px}
.market-head span{display:block;font-size:9px;color:var(--muted);margin-top:2px}
.market-ovr{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  border:1px solid rgba(94,234,212,.35);color:var(--accent);font-weight:900;font-size:12px
}
.market-meta{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:7px;
}
.market-meta div{
  padding:8px;border-radius:10px;background:#121c2f;border:1px solid var(--line)
}
.market-meta span{display:block;font-size:8px;color:var(--muted);margin-bottom:3px}
.market-meta strong{font-size:10px}
.market-actions{display:flex;gap:8px}
.market-actions button{flex:1}
.offer-btn{
  min-height:38px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#06111d;font-weight:900;font-size:10px
}
.watch-btn{
  min-height:38px;border:1px solid var(--line);border-radius:10px;background:#172136;color:var(--text);font-size:10px;font-weight:800
}

.transfer-table{width:100%;border-collapse:collapse;min-width:820px}
.transfer-table th{
  text-align:left;padding:12px 14px;font-size:9px;color:#718096;letter-spacing:.08em;
  border-bottom:1px solid var(--line);background:#0e1626
}
.transfer-table td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:11px}
.transfer-table tr:last-child td{border-bottom:0}

.status-badge{
  display:inline-flex;min-height:24px;align-items:center;padding:0 8px;border-radius:999px;
  border:1px solid var(--line);font-size:9px;font-weight:800
}
.status-badge.pending{color:var(--warn);border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.07)}
.status-badge.accepted{color:var(--good);border-color:rgba(74,222,128,.3);background:rgba(74,222,128,.07)}
.status-badge.rejected,.status-badge.outbid{color:var(--danger);border-color:rgba(251,113,133,.3);background:rgba(251,113,133,.07)}

.offer-panel{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.45fr);gap:16px;
}
.offer-box{padding:18px}
.offer-player{
  display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:12px;align-items:center;
  padding:12px;border:1px solid var(--line);border-radius:13px;background:#0f1728
}
.offer-player .market-avatar{width:50px;height:50px}
.offer-form{display:grid;gap:12px}
.offer-form label{font-size:9px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.money-input{
  width:100%;min-height:42px;border-radius:11px;border:1px solid var(--line);background:#111a2b;color:var(--text);padding:0 12px
}
.offer-preview{
  display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#0f1728
}
.preview-row{display:flex;justify-content:space-between;gap:12px;font-size:10px}
.preview-row span{color:var(--muted)}
.preview-row strong{font-size:10px}
.finance-warning{
  padding:11px 12px;border-radius:11px;border:1px solid rgba(251,113,133,.25);
  background:rgba(251,113,133,.05);color:#f6a1af;font-size:10px;line-height:1.45
}
.finance-ok{
  padding:11px 12px;border-radius:11px;border:1px solid rgba(74,222,128,.22);
  background:rgba(74,222,128,.05);color:#94e3ad;font-size:10px;line-height:1.45
}

.auction-card{
  padding:15px;border:1px solid var(--line);border-radius:15px;background:#0f1728;display:grid;gap:11px
}
.auction-countdown{font-size:10px;color:var(--warn);font-weight:800}
.bid-row{display:flex;justify-content:space-between;align-items:end;gap:10px}
.bid-row .market-actions{min-width:140px}

.offer-response-actions{display:flex;gap:7px;flex-wrap:wrap}
.accept-btn,.reject-btn,.counter-btn{
  min-height:34px;padding:0 10px;border-radius:9px;font-size:9px;font-weight:900
}
.accept-btn{border:1px solid rgba(74,222,128,.3);background:rgba(74,222,128,.08);color:var(--good)}
.reject-btn{border:1px solid rgba(251,113,133,.3);background:rgba(251,113,133,.08);color:var(--danger)}
.counter-btn{border:1px solid var(--line);background:#172136;color:var(--text)}

@media(max-width:1100px){
  .transfer-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .offer-panel{grid-template-columns:1fr}
}
@media(max-width:760px){
  .transfer-summary{grid-template-columns:repeat(2,minmax(0,1fr))}
  .transfer-grid{grid-template-columns:1fr}
}
@media(max-width:470px){
  .transfer-summary{grid-template-columns:1fr}
  .market-meta{grid-template-columns:1fr 1fr}
  .transfer-tabs{display:grid;grid-template-columns:1fr 1fr}
}


/* ===========================
   LEAGUE / MATCH / CLUB
   =========================== */

.module-tabs{
  display:flex;flex-wrap:wrap;gap:8px;padding:8px;border:1px solid var(--line);
  border-radius:14px;background:#0f1728;margin-bottom:16px
}
.module-tab{
  min-height:38px;padding:0 13px;border:0;border-radius:10px;background:transparent;
  color:var(--muted);font-size:11px;font-weight:800
}
.module-tab.active{background:rgba(94,234,212,.1);color:var(--accent)}

.league-table{width:100%;border-collapse:collapse;min-width:860px}
.league-table th{
  text-align:center;padding:12px 10px;font-size:9px;color:#718096;letter-spacing:.06em;
  background:#0e1626;border-bottom:1px solid var(--line)
}
.league-table th:nth-child(2){text-align:left}
.league-table td{
  padding:12px 10px;border-bottom:1px solid var(--line);font-size:11px;text-align:center
}
.league-table td:nth-child(2){text-align:left;font-weight:800}
.league-table tr.highlight{background:rgba(94,234,212,.05)}
.position-badge{
  width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
  background:#1b2940;margin:0 auto;font-size:10px;font-weight:900
}
.form-dots{display:flex;gap:4px;justify-content:center}
.form-dot{
  width:20px;height:20px;border-radius:6px;display:grid;place-items:center;
  font-size:8px;font-weight:900;background:#1b2940;color:var(--muted)
}
.form-dot.w{color:var(--good)}
.form-dot.d{color:var(--warn)}
.form-dot.l{color:var(--danger)}

.fixture-list{display:grid;gap:9px}
.fixture-row{
  display:grid;grid-template-columns:70px minmax(0,1fr) 70px minmax(0,1fr) 90px;
  gap:10px;align-items:center;padding:11px 12px;border:1px solid var(--line);
  border-radius:12px;background:#0f1728
}
.fixture-row strong{font-size:11px}
.fixture-row span{font-size:9px;color:var(--muted)}
.fixture-score{text-align:center;font-weight:900}
.fixture-status{text-align:right}

.stats-podium{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px
}
.podium-card{
  padding:16px;border:1px solid var(--line);border-radius:14px;background:#0f1728
}
.podium-card span{display:block;font-size:9px;color:var(--muted)}
.podium-card strong{display:block;font-size:14px;margin-top:4px}
.podium-card b{display:block;font-size:24px;margin-top:8px;color:var(--accent)}

.match-layout{
  display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,.75fr);gap:18px;align-items:start
}
.scoreboard{
  padding:20px;border:1px solid var(--line);border-radius:18px;background:#0f1728
}
.score-main{
  display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;text-align:center
}
.score-team .team-logo{margin-bottom:8px}
.score-team strong{display:block;font-size:14px}
.score-centre strong{font-size:38px;letter-spacing:.04em}
.score-centre span{display:block;font-size:10px;color:var(--muted);margin-top:4px}
.match-progress{
  margin-top:16px;height:7px;border-radius:999px;background:#253047;overflow:hidden
}
.match-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.match-controls{display:flex;gap:8px;margin-top:14px}
.match-controls button{flex:1}

.match-stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.match-stat{
  padding:11px;border:1px solid var(--line);border-radius:12px;background:#0f1728
}
.match-stat span{display:block;font-size:9px;color:var(--muted)}
.match-stat strong{font-size:15px;margin-top:4px;display:block}

.event-timeline{display:grid;gap:7px;max-height:460px;overflow:auto;padding-right:4px}
.event-row{
  display:grid;grid-template-columns:42px 30px minmax(0,1fr);gap:8px;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--line)
}
.event-row:last-child{border-bottom:0}
.event-minute{font-size:10px;color:var(--muted);text-align:right}
.event-icon{
  width:28px;height:28px;border-radius:9px;background:#1d2a41;display:grid;place-items:center;font-size:10px
}
.event-row strong{font-size:10px}

.club-layout{
  display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:18px;align-items:start
}
.finance-grid{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px
}
.finance-card{
  padding:13px;border:1px solid var(--line);border-radius:13px;background:#0f1728
}
.finance-card span{display:block;font-size:9px;color:var(--muted);margin-bottom:5px}
.finance-card strong{font-size:16px}
.ledger-list{display:grid;gap:8px}
.ledger-row{
  display:grid;grid-template-columns:72px 110px minmax(0,1fr) auto;gap:10px;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--line);font-size:10px
}
.ledger-row:last-child{border-bottom:0}
.ledger-row span{color:var(--muted)}
.ledger-amount.positive{color:var(--good)}
.ledger-amount.negative{color:var(--danger)}

.facility-grid{display:grid;gap:10px}
.facility-card{
  padding:15px;border:1px solid var(--line);border-radius:14px;background:#0f1728
}
.facility-head{display:flex;justify-content:space-between;gap:12px;align-items:start}

<script>
window.MS7_CONFIG = Object.freeze({
  url: "https://ibmshyuttubdzlnplugx.supabase.co",
  publishableKey: "sb_publishable_e2POOpOYq8_keYYXkD8M0Q_mTtoJf3d",
  worldSlug: "ms7-private-world",
  environment: "PRODUCTION_FINAL"
});

window.MS7Service = (() => {
  const cfg = window.MS7_CONFIG;
  if (!window.supabase?.createClient) throw new Error("SUPABASE_JS_NOT_LOADED");

  const client = window.supabase.createClient(cfg.url, cfg.publishableKey, {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  });

  const must = (result, label) => {
    if (result?.error) {
      const e = new Error(result.error.message || label || "Supabase error");
      e.code = result.error.code;
      e.details = result.error.details;
      e.hint = result.error.hint;
      throw e;
    }
    return result?.data;
  };

  async function getSession() {
    const { data, error } = await client.auth.getSession();
    if (error) throw error;
    return data.session;
  }

  const MS7_EMAIL_DOMAIN = "ms7.com";

  function normalizeMs7Username(value) {
    let raw = String(value || "").trim().toLowerCase();
    if (raw.endsWith(`@${MS7_EMAIL_DOMAIN}`)) raw = raw.slice(0, -(MS7_EMAIL_DOMAIN.length + 1));
    if (raw.includes("@")) throw new Error(`Gunakan username MS7 saja atau akun @${MS7_EMAIL_DOMAIN}.`);
    if (!/^[a-z0-9][a-z0-9._-]{1,31}$/.test(raw)) {
      throw new Error("Username harus 2–32 karakter dan hanya boleh huruf kecil, angka, titik, underscore, atau tanda minus.");
    }
    return raw;
  }

  function toMs7Email(value) {
    return `${normalizeMs7Username(value)}@${MS7_EMAIL_DOMAIN}`;
  }

  async function signUp({ password, username, displayName }) {
    const cleanUsername = normalizeMs7Username(username);
    const cleanEmail = toMs7Email(cleanUsername);
    const cleanName = String(displayName || "").trim();
    if (!password || !cleanName) throw new Error("Lengkapi semua field registrasi.");
    const { data, error } = await client.auth.signUp({
      email: cleanEmail,
      password,
      options: { data: { username: cleanUsername, display_name: cleanName, ms7_email: cleanEmail } }
    });
    if (error) throw error;
    return data;
  }

  async function signIn({ username, password }) {
    const { data, error } = await client.auth.signInWithPassword({
      email: toMs7Email(username), password
    });
    if (error) throw error;
    return data;
  }

  async function signOut() {
    const { error } = await client.auth.signOut();
    if (error) throw error;
  }

  async function getProfile(userId) {
    const session = await getSession();
    const id = userId || session?.user?.id;
    if (!id) return null;
    const res = await client.from("profiles").select("id,username,display_name,role,is_owner,approval_status,approved_at,created_at,updated_at").eq("id", id).maybeSingle();
    return must(res, "PROFILE_READ_FAILED");
  }

  async function getWorld() {
    const res = await client.from("game_worlds")
      .select("id,slug,name,status,max_managers,founding_target,registration_open,transfer_window_open,scheduler_enabled,founding_draw_status,current_season_number,timezone")
      .eq("slug", cfg.worldSlug).maybeSingle();
    return must(res, "WORLD_READ_FAILED");
  }

  async function getMyClub(userId) {
    const session = await getSession();
    const id = userId || session?.user?.id;
    if (!id) return null;
    const res = await client.from("clubs")
      .select("id,world_id,manager_id,name,short_name,logo_url,stadium_name,reputation,active,created_at")
      .eq("manager_id", id).eq("active", true).maybeSingle();
    return must(res, "CLUB_READ_FAILED");
  }

  async function listClubs() {
    const res = await client.from("clubs")
      .select("id,world_id,manager_id,name,short_name,logo_url,stadium_name,reputation,active,created_at")
      .eq("active", true).order("created_at", { ascending: true });
    return must(res, "CLUB_LIST_FAILED") || [];
  }

  async function createClub({ name, shortName, stadiumName, logoUrl = null }) {
    const res = await client.rpc("create_club", {
      p_name: String(name || "").trim(),
      p_short_name: String(shortName || "").trim().toUpperCase(),
      p_stadium_name: String(stadiumName || "").trim(),
      p_logo_url: logoUrl || null
    });
    return must(res, "CREATE_CLUB_FAILED");
  }

  async function adminPendingAccounts() {
    const res = await client.rpc("admin_pending_accounts", { p_limit: 50 });
    return must(res, "ADMIN_PENDING_FAILED") || [];
  }

  async function adminDecideManager(userId, decision, reason) {
    const res = await client.rpc("admin_decide_manager", {
      p_user_id: userId,
      p_decision: decision,
      p_reason: reason || `Production Bridge V1: ${decision}`
    });
    return must(res, "ADMIN_DECISION_FAILED");
  }

  async function safeCount(table, column = "*", configure = null) {
    try {
      let q = client.from(table).select(column, { count: "exact", head: true });
      if (typeof configure === "function") q = configure(q);
      const res = await q;
      if (res.error) {
        console.warn(`Count ${table} gagal`, res.error);
        return null;
      }
      return Number(res.count ?? 0);
    } catch (err) {
      console.warn(`Count ${table} gagal`, err);
      return null;
    }
  }

  async function adminOverview() {
    const [pending, clubs, profilesRes, activePlayers, playerStateRows, ownedPlayers, freeAgents] = await Promise.all([
      adminPendingAccounts(),
      listClubs(),
      client.from("profiles")
        .select("id,username,display_name,role,is_owner,approval_status,created_at,updated_at")
        .order("created_at", { ascending: true }),
      safeCount("players", "id", q => q.eq("active", true)),
      safeCount("player_state", "player_id"),
      safeCount("player_state", "player_id", q => q.eq("ownership_status", "owned")),
      safeCount("player_state", "player_id", q => q.eq("ownership_status", "free_agent"))
    ]);

    const profiles = must(profilesRes, "ADMIN_PROFILES_FAILED") || [];
    const profileById = new Map(profiles.map(x => [x.id, x]));
    const enrichedClubs = clubs.map(c => {
      const manager = profileById.get(c.manager_id) || null;
      return {
        ...c,
        manager_username: manager?.username || null,
        manager_name: manager?.display_name || manager?.username || "Manager",
        manager_status: manager?.approval_status || "unknown"
      };
    });

    const approvedManagers = profiles.filter(x =>
      x.role === "manager" && x.approval_status === "approved"
    ).length;

    const approvedActiveClubs = enrichedClubs.filter(c =>
      c.manager_status === "approved"
    ).length;

    return {
      pending,
      clubs: enrichedClubs,
      profiles,
      counts: {
        profiles: profiles.length,
        approvedManagers,
        approvedActiveClubs,
        activePlayers,
        playerStateRows,
        ownedPlayers,
        freeAgents
      }
    };
  }

  async function runStarterDraw() {
    const res = await client.rpc("run_starter_draw", { p_reason: "Production Final · Founding Draw V1.4" });
    return must(res, "FOUNDING_DRAW_FAILED");
  }

  async function getMySquadSummary(clubId) {
    if (!clubId) return { count: 0, players: [] };
    const stateRes = await client.from("player_state")
      .select("player_id,current_age,current_ovr,current_tier,fitness,form")
      .eq("current_club_id", clubId).eq("ownership_status", "owned")
      .order("current_ovr", { ascending: false });
    const states = must(stateRes, "SQUAD_STATE_FAILED") || [];
    if (!states.length) return { count: 0, players: [] };
    const ids = states.map(x => x.player_id);
    const playerRes = await client.from("players").select("id,name,primary_position,secondary_positions,reference_season,reference_club,potential_label").in("id", ids);
    const players = must(playerRes, "SQUAD_PLAYERS_FAILED") || [];
    const byId = new Map(players.map(p => [p.id, p]));
    return {
      count: states.length,
      players: states.map(s => ({ ...s, ...(byId.get(s.player_id) || {}) }))
    };
  }

  async function bootstrap() {
    const session = await getSession();
    if (!session?.user) return { screen: "login", session: null, user: null, profile: null };

    const profile = await getProfile(session.user.id);
    if (!profile) return { screen: "error", message: "Profile belum terbentuk untuk Auth user ini." };

    if (profile.approval_status !== "approved") {
      return { screen: "pending", session, user: session.user, profile };
    }

    const world = await getWorld();

    if (profile.role === "admin") {
      const overview = await adminOverview();
      return {
        screen: "adminLobby",
        session,
        user: session.user,
        profile,
        world,
        pending: overview.pending,
        clubs: overview.clubs,
        adminOverview: overview
      };
    }

    const club = await getMyClub(session.user.id);
    if (!club) return { screen: "createClub", session, user: session.user, profile, world, club: null };

    if (world?.founding_draw_status !== "COMPLETED") {
      const clubs = await listClubs();
      return { screen: "waitingDraw", session, user: session.user, profile, world, club, clubs };
    }

    const squad = await getMySquadSummary(club.id);
    return { screen: "gameReady", session, user: session.user, profile, world, club, squad };
  }

  return {
    client, getSession, signUp, signIn, signOut, getProfile, getWorld, getMyClub,
    listClubs, createClub, adminPendingAccounts, adminDecideManager, adminOverview, runStarterDraw,
    getMySquadSummary, bootstrap
  };
})();
</script>


<script>
/* =============================================================
   PRODUCTION FINAL — REAL GAMEPLAY
   Supabase is the source of truth. No secret/service-role key is used in the frontend.
   ============================================================= */
window.RealGameService = (() => {
  const client = window.MS7Service.client;
  const cache = { ctx:null, ctxAt:0, squad:null, squadAt:0 };
  const TTL = 2500;

  function must(result, label='SUPABASE_ERROR') {
    if (result?.error) {
      const e = result.error;
      const msg = [e.message, e.details, e.hint, e.code].filter(Boolean).join(' | ');
      throw new Error(`${label}: ${msg || 'Unknown Supabase error'}`);
    }
    return result?.data;
  }
  const cap = s => String(s ?? '').trim();
  const num = (v, d=0) => Number.isFinite(Number(v)) ? Number(v) : d;
  const title = s => cap(s).toLowerCase().replace(/\b\w/g, m=>m.toUpperCase());
  const pressToServer = v => v === 'High Press' ? 'High' : v === 'Very High Press' ? 'Very High' : v;
  const pressToUi = v => v === 'High' ? 'High Press' : v === 'Very High' ? 'Very High Press' : v;
  const focusToServer = v => {
    if (!v || v === 'Balanced') return null;
    const map = {'Work Rate':'work_rate','One-on-One':'one_on_one'};
    return map[v] || String(v).toLowerCase().replaceAll(' ','_').replaceAll('-','_');
  };
  const prettyCategory = c => ({MATCH:'Match',TRANSFER:'Transfer',PLAYER:'Player',FINANCE:'Finance',LEAGUE:'League'}[c] || title(c));
  const fmtWib = ts => {
    if (!ts) return 'TBD';
    try { return new Intl.DateTimeFormat('id-ID',{timeZone:'Asia/Jakarta',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(ts))+' WIB'; }
    catch { return cap(ts); }
  };
  const fmtDate = ts => {
    if (!ts) return 'TBD';
    try { return new Intl.DateTimeFormat('id-ID',{timeZone:'Asia/Jakarta',day:'2-digit',month:'short'}).format(new Date(ts)); }
    catch { return cap(ts); }
  };
  const relative = ts => {
    if (!ts) return '';
    const diff = Date.now()-new Date(ts).getTime();
    if (!Number.isFinite(diff)) return '';
    const m=Math.max(0,Math.floor(diff/60000));
    if (m<1) return 'Now'; if (m<60) return `${m}m`; const h=Math.floor(m/60); if(h<24)return `${h}h`; return `${Math.floor(h/24)}d`;
  };
  function invalidate() { cache.ctx=null; cache.squad=null; cache.ctxAt=cache.squadAt=0; }

  async function context(force=false) {
    if (!force && cache.ctx && Date.now()-cache.ctxAt<TTL) return cache.ctx;
    const session = await MS7Service.getSession();
    if (!session?.user) throw new Error('AUTH_REQUIRED');
    const [profile, world] = await Promise.all([
      MS7Service.getProfile(session.user.id), MS7Service.getWorld()
    ]);
    if (!profile || profile.approval_status !== 'approved') throw new Error('ACCOUNT_NOT_APPROVED');
    const club = await MS7Service.getMyClub(session.user.id);
    if (!club) throw new Error('CLUB_NOT_FOUND_FOR_MANAGER');
    const season = must(await client.from('seasons').select('*').eq('world_id',world.id).eq('season_number',world.current_season_number).maybeSingle(),'SEASON');
    if (!season) throw new Error('CURRENT_SEASON_NOT_FOUND');
    cache.ctx = {session,profile,world,club,season}; cache.ctxAt=Date.now();
    return cache.ctx;
  }

  async function clubMap(worldId) {
    const rows = must(await client.from('clubs').select('id,name,short_name,logo_url,stadium_name,manager_id,reputation,active').eq('world_id',worldId).eq('active',true),'CLUBS') || [];
    return new Map(rows.map(x=>[x.id,x]));
  }

  async function getManager() {
    const {profile} = await context();
    const n = profile.display_name || profile.username || 'Manager';
    return {id:profile.id,name:n,short:n.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase(),status:profile.approval_status,role:profile.role};
  }
  async function getSeason(){ const {season}=await context(); return {number:season.season_number,phase:season.phase,matchday:season.matchday,id:season.id}; }

  async function getSquad(force=false) {
    const {club,season} = await context();
    if (!force && cache.squad && Date.now()-cache.squadAt<TTL) return JSON.parse(JSON.stringify(cache.squad));
    const states = must(await client.from('player_state').select('*').eq('current_club_id',club.id).eq('ownership_status','owned').order('current_ovr',{ascending:false}),'SQUAD_STATE') || [];
    if (!states.length) return [];
    const ids=states.map(x=>x.player_id);
    const [playersR, contractsR, attrsR, posR, injuriesR, suspR, statsR, transR] = await Promise.all([
      client.from('players').select('*').in('id',ids),
      client.from('contracts').select('*').in('player_id',ids).eq('club_id',club.id).eq('status','active'),
      client.from('player_current_attributes').select('*').in('player_id',ids),
      client.from('player_position_ratings').select('*').in('player_id',ids),
      client.from('player_injuries').select('*').in('player_id',ids).eq('status','active'),
      client.from('player_suspensions').select('*').in('player_id',ids).eq('season_id',season.id).eq('status','active'),
      client.from('player_season_stats').select('*').in('player_id',ids).eq('season_id',season.id),
      client.from('player_transfer_state').select('*').in('player_id',ids)
    ]);
    const players=must(playersR,'PLAYERS')||[], contracts=must(contractsR,'CONTRACTS')||[], attrs=must(attrsR,'ATTRS')||[], pos=must(posR,'POS_RATINGS')||[], injuries=must(injuriesR,'INJURIES')||[], susp=must(suspR,'SUSPENSIONS')||[], stats=must(statsR,'STATS')||[], trs=must(transR,'TRANSFER_STATE')||[];
    const by=(arr,key='player_id')=>new Map(arr.map(x=>[x[key],x]));
    const pBy=by(players,'id'), cBy=by(contracts), aBy=by(attrs), iBy=by(injuries), sBy=by(susp), stBy=by(stats), trBy=by(trs);
    const posBy=new Map(); for(const x of pos){if(!posBy.has(x.player_id))posBy.set(x.player_id,[]);posBy.get(x.player_id).push(x)}
    const attrsNames={pace:'Pace',acceleration:'Acceleration',finishing:'Finishing',passing:'Passing',dribbling:'Dribbling',crossing:'Crossing',tackling:'Tackling',positioning:'Positioning',strength:'Strength',aerial:'Aerial',stamina:'Stamina',work_rate:'Work Rate',reflexes:'Reflexes',handling:'Handling',one_on_one:'One-on-One',distribution:'Distribution'};
    const out=states.map(s=>{
      const p=pBy.get(s.player_id)||{}, c=cBy.get(s.player_id)||{}, a=aBy.get(s.player_id)||{}, inj=iBy.get(s.player_id), su=sBy.get(s.player_id), st=stBy.get(s.player_id)||{}, tr=trBy.get(s.player_id)||{};
      const attributes={}; for(const [k,label] of Object.entries(attrsNames)){ if(a[k]!=null) attributes[label]=a[k]; }
      let positionOvrs=(posBy.get(s.player_id)||[]).map(r=>({position:r.position,ovr:r.position===p.primary_position?s.current_ovr:r.ovr,familiarity:r.familiarity}));
      if(!positionOvrs.length) positionOvrs=[{position:p.primary_position,ovr:s.current_ovr,familiarity:'Natural'}];
      const injury = inj ? {level:inj.severity,matchesAffected:inj.recovery_days,playable:!['Heavy','Very Heavy'].includes(inj.severity),returnFitness:s.fitness} : {level:'None',matchesAffected:0,playable:true,returnFitness:s.fitness};
      const suspension = su ? {active:true,matches:su.matches_remaining} : {active:false,matches:0};
      const status = suspension.active ? `Suspended (${suspension.matches})` : injury.level!=='None' ? `Injured · ${injury.level}` : 'Available';
      const refAge=p.reference_age ?? s.current_age;
      const careerStage=refAge<=23?'Developing':refAge<=29?'Peak Age':'Veteran';
      const sec=cap(p.secondary_positions)||'-';
      return {
        id:s.player_id,name:p.name||s.player_id,pos:p.primary_position||'?',secondary:sec,ovr:s.current_ovr,age:s.current_age,fitness:Math.round(num(s.fitness,100)),form:Math.round(num(s.form,50)),potential:p.potential_label||'Moderate',tier:s.current_tier,contract:c.seasons_remaining??0,wage:c.weekly_wage??0,status,
        refSeason:p.reference_season||'-',refClub:p.reference_club||'-',refAge,careerStage,attributes,injury,suspension,retirementRisk:s.retirement_risk||'Low',resaleCooldown:Math.max(0,num(s.resale_eligible_matchday)-num(season.matchday)),positionOvrs,
        stats:{appearances:st.appearances||0,starts:st.starts||0,minutes:st.minutes||0,goals:st.goals||0,assists:st.assists||0,cleanSheets:st.clean_sheets||0,avgRating:st.average_rating==null?'-':Number(st.average_rating).toFixed(2)},
        careerHistory:[{season:`Season ${season.season_number}`,club:club.name,apps:st.appearances||0,goals:st.goals||0,assists:st.assists||0,rating:st.average_rating==null?'-':Number(st.average_rating).toFixed(2)}],
        transferState:tr, renewal:{seasons:c.renewal_seasons??null,wage:c.renewal_weekly_wage??null}
      };
    });

  async function productionLogout() {
    try { await MS7Service.signOut(); } catch (err) { console.error(err); }
    state.production.bootstrap = null;
    state.session.screen = "login";
    state.session.loggedIn = false;
    configurePreseasonNavigation(false);
    window.GameService = window.RealGameService;
    mobileBottomNav?.classList.add("is-hidden");
    await showAuth();
  }

  async function resolveProductionState() {
    state.production.loading = true;
    state.production.error = null;
    state.session.screen = "loading";
    authRoot.innerHTML = authTemplate("loading");
    gameApp.classList.add("is-hidden");
    try {
      const b = await MS7Service.bootstrap();
      state.production.bootstrap = b;
      state.session.screen = b.screen || "login";
      state.session.pending = b.profile?.approval_status === "pending";
      state.session.approved = b.profile?.approval_status === "approved";
      state.session.clubCreated = !!b.club;
      state.session.loggedIn = !!b.session;
      return b;
    } catch (err) {
      console.error("Supabase bootstrap error", err);
      state.production.error = err.message || String(err);
      state.session.screen = "error";
      return null;
    } finally {
      state.production.loading = false;
    }
  }

  async function enterPreseasonLobby() {
    const b = state.production.bootstrap || {};
    if (!b.session || !b.profile || !b.club) {
      showToast("Preseason Lobby belum tersedia untuk akun ini.");
      return;
    }

    window.GameService = window.RealGameService;
    configurePreseasonNavigation(true);

    state.session.loggedIn = true;
    state.session.approved = true;
    state.session.clubCreated = true;

    authRoot.innerHTML = "";
    gameApp.classList.remove("is-hidden");
    mobileBottomNav?.classList.remove("is-hidden");

    const hiddenAdminNav = nav.querySelector('[data-view="admin"]');
    if (hiddenAdminNav) hiddenAdminNav.classList.add("is-hidden");

    state.view = "home";
    syncActiveNav();
    await render();
    await refreshNotificationCounts();
    showToast("Preseason Lobby aktif · gameplay kompetitif masih terkunci.");
  }

  async function refreshPreseasonStatus() {
    try {
      const b = await MS7Service.bootstrap();
      state.production.bootstrap = b;

      if (b.screen === "gameReady") {
        configurePreseasonNavigation(false);
        showToast("Founding Draw selesai · gameplay dibuka.");
        await enterRealGameplay();
        return;
      }

      if (b.screen !== "waitingDraw") {
        configurePreseasonNavigation(false);
        state.session.screen = b.screen || "login";
        await showAuth(false);
        return;
      }

      showToast(`World status diperbarui · ${(b.clubs || []).length}/${b.world?.founding_target || 12} clubs.`);
      await render();
      await refreshNotificationCounts();
    } catch (err) {
      console.error("Preseason refresh failed", err);
      showToast(`Refresh gagal: ${err.message}`);
    }
  }

  async function enterRealGameplay() {
    try {
      configurePreseasonNavigation(false);
      window.GameService = window.RealGameService;
      await window.RealGameService.hydrateUIState(state);
      state.session.loggedIn = true;
      state.session.approved = true;
      state.session.clubCreated = true;
      authRoot.innerHTML = "";
      gameApp.classList.remove("is-hidden");
      mobileBottomNav?.classList.remove("is-hidden");

      if (hiddenAdminNav) hiddenAdminNav.classList.add('is-hidden');
      state.view = "home";

      await render();
      await refreshNotificationCounts();
    } catch (err) {
      console.error('Real gameplay entry failed',err);
      showToast(`Gameplay gagal: ${err.message}`);
    }
  }


  function wireAuth(mode) {
    document.getElementById("installFromLoginBtn")?.addEventListener("click", triggerInstall);
    if (mode === "login") {
      document.getElementById("loginForm")?.addEventListener("submit", async e => {
        e.preventDefault();
        const btn = e.submitter; if (btn) btn.disabled = true;
        try {
          await MS7Service.signIn({ username: document.getElementById("loginUsername").value, password: document.getElementById("loginPassword").value });
          const session = await MS7Service.getSession();
          const profile = session?.user ? await MS7Service.getProfile(session.user.id) : null;
          if (state.session.authRole === "admin" && profile?.role !== "admin") {
            await MS7Service.signOut();
            throw new Error("Akun ini bukan Owner/Admin.");
          }
          if (profile?.role === "admin") state.session.authRole = "admin";
          await showAuth(true);
        } catch (err) { showToast(`Login gagal: ${err.message}`); if (btn) btn.disabled = false; }
      });
      document.querySelectorAll("[data-auth-role]").forEach(btn => btn.addEventListener("click", () => { state.session.authRole = btn.dataset.authRole; showAuth(false); }));
      document.getElementById("goRegisterBtn")?.addEventListener("click", () => { state.session.authRole = "manager"; state.session.screen = "register"; showAuth(false); });
    } else if (mode === "register") {
      const regUsernameInput = document.getElementById("regUsername");
      const regMs7Preview = document.getElementById("regMs7Preview");
      const updateMs7Preview = () => {
        if (!regMs7Preview) return;
        const raw = String(regUsernameInput?.value || "username").trim().toLowerCase().replace(/@ms7\.com$/i, "") || "username";
        regMs7Preview.textContent = raw;
      };
      regUsernameInput?.addEventListener("input", updateMs7Preview);
      updateMs7Preview();
      document.getElementById("registerForm")?.addEventListener("submit", async e => {
        e.preventDefault();
        const btn = e.submitter; if (btn) btn.disabled = true;
        try {
          const data = await MS7Service.signUp({
            displayName: document.getElementById("regName").value,
            username: document.getElementById("regUsername").value,
            password: document.getElementById("regPassword").value
          });
          if (!data.session) {
            state.session.screen = "emailConfirmation";
            showAuth(false);
          } else {
            await showAuth(true);
          }
        } catch (err) { showToast(`Registrasi gagal: ${err.message}`); if (btn) btn.disabled = false; }
      });
      document.getElementById("goLoginBtn")?.addEventListener("click", () => { state.session.authRole = "manager"; state.session.screen = "login"; showAuth(false); });
    } else if (mode === "emailConfirmation") {
      document.getElementById("emailGoLoginBtn")?.addEventListener("click", () => { state.session.screen = "login"; showAuth(false); });
    } else if (mode === "pending") {
      document.getElementById("refreshApprovalBtn")?.addEventListener("click", () => showAuth(true));
      document.getElementById("pendingLogoutBtn")?.addEventListener("click", productionLogout);
    } else if (mode === "createClub") {
      const name = document.getElementById("clubNameInput");
      const short = document.getElementById("clubShortInput");
      const stadium = document.getElementById("stadiumInput");
      const sync = () => {
        const shortName = (short.value || "FC").toUpperCase();
        document.getElementById("clubPreviewName").textContent = name.value || "Your Club";
        document.getElementById("clubPreviewLogo").innerHTML = `<img src="${htmlSafe(makeClubLogoDataUrl(shortName,state.clubLogoTheme))}" alt="Club logo preview">`;
        document.getElementById("clubPreviewStadium").textContent = stadium.value || "Home Stadium";

        catch (err) { showToast(`Reject gagal: ${err.message}`); }

      document.getElementById("runFoundingDrawBtn")?.addEventListener("click", async () => {
        const b = state.production.bootstrap || {};
        const world = b.world || {};
        const counts = b.adminOverview?.counts || {};
        const target = Number(world.founding_target || 12);
        const approvedClubCount = Number(counts.approvedActiveClubs ?? (b.clubs || []).length);

  async function ensureTacticsInitialized() {

  function compatibleScore(slot, player) {
    const p = player.pos;
    const s = slot;
    if (s === p) return 100;
    const map = {
      RWB:["RB","RW"], LWB:["LB","LW"], RM:["RW","RB","CM"], LM:["LW","LB","CM"],
      DM:["CM","CB"], CM:["DM","AM"], AM:["CM","RW","LW"], ST:["LW","RW"],
      RW:["AM","ST"], LW:["AM","ST"], RB:["CB"], LB:["CB"], CB:["DM"]
    };
    if ((map[s] || []).includes(p)) return 80;
    if (player.secondary && player.secondary !== "-" && player.secondary.split("/").includes(s)) return 90;
    return 35;
  }

  function assignDefaultLineup(players, formation) {
    const slots = formations[formation];
    const available = [...players];
    const lineup = {};
    slots.forEach((slot, idx) => {
      const role = slot[0];
      available.sort((a,b) => {
        const scoreA = compatibleScore(role,a) * 10 + a.ovr;
        const scoreB = compatibleScore(role,b) * 10 + b.ovr;
        return scoreB - scoreA;
      });
      const chosen = available.shift();
      if (chosen) lineup[idx] = chosen.id;
    });
    state.lineup = lineup;
    const used = new Set(Object.values(lineup));
    state.bench = players.filter(p => !used.has(p.id)).slice(0,9).map(p => p.id);
  }

    const b = state.production.bootstrap || {};

    const target = Number(world.founding_target || 12);
    const current = clubs.length;
    const pct = Math.max(0, Math.min(100, Math.round((current / Math.max(1,target)) * 100)));
    return { b, world, club, profile, clubs, target, current, pct };
  }

        const newPlayerId = btn.dataset.pickPlayer;
        const slotIndex = Number(btn.dataset.pickSlot);
        const oldPlayerId = state.lineup[slotIndex];

        const otherSlot = Object.entries(state.lineup).find(([idx,pid]) => pid === newPlayerId && Number(idx) !== slotIndex);

        if (otherSlot) {
          state.lineup[Number(otherSlot[0])] = oldPlayerId;
        } else {
          const benchIndex = state.bench.indexOf(newPlayerId);
          if (benchIndex >= 0) {
            state.bench[benchIndex] = oldPlayerId;
          }
        }

        state.lineup[slotIndex] = newPlayerId;
        state.bench = state.bench.filter(id => !Object.values(state.lineup).includes(id)).slice(0,9);
        if (oldPlayerId && !Object.values(state.lineup).includes(oldPlayerId) && !state.bench.includes(oldPlayerId)) {
          state.bench.unshift(oldPlayerId);
          state.bench = state.bench.slice(0,9);
        }

        state.selectedSlot = null;
        showToast("Lineup updated.");
        renderTactics();
      });
    });

  function buildPlayerPicker(slotIndex,formation,players,playerById) {
    const role = formation[slotIndex][0];
    const currentId = state.lineup[slotIndex];

    const candidates = [...players]
      .filter(p => p.id !== currentId)
      .sort((a,b) => {
        const sa = compatibleScore(role,a) * 10 + a.ovr + a.fitness/10;
        const sb = compatibleScore(role,b) * 10 + b.ovr + b.fitness/10;
        return sb-sa;
      })
      .slice(0,12);

    const current = playerById[currentId];

    return `
      <h3>Replace ${role}</h3>
      <div class="selection-info">
        Current: <strong>${current ? current.name : "Empty"}</strong>.
        Recommended players are sorted by position fit, OVR and fitness.
      </div>
      <div class="player-picker">
        ${candidates.map(p => `
          <button type="button" class="pick-row" data-pick-player="${p.id}" data-pick-slot="${slotIndex}">
            <div class="pick-av">${initials(p.name)}</div>
            <div>
              <strong>${p.name}</strong>
              <span>${p.pos}${p.secondary && p.secondary!=="-" ? " / "+p.secondary : ""} · ${roleCompatibleText(role,p)} · Fitness ${p.fitness}%</span>
            </div>
            <div class="pick-ovr">${p.ovr}</div>
          </button>
        `).join("")}
      </div>
    `;
  }

  function trainingModeMeta(type) {
    const map = {
      Recovery: {dxp:2, fitness:10, fatigue:"Very Low", risk:"Very Low"},
      Light: {dxp:5, fitness:-2, fatigue:"Low", risk:"Low"},
      Normal: {dxp:8, fitness:-4, fatigue:"Moderate", risk:"Low"},
      Intensive: {dxp:12, fitness:-9, fatigue:"High", risk:"High"},
      Attacking: {dxp:8, fitness:-5, fatigue:"Moderate", risk:"Moderate"},
      Defensive: {dxp:8, fitness:-5, fatigue:"Moderate", risk:"Moderate"},
      Technical: {dxp:7, fitness:-3, fatigue:"Low", risk:"Low"},
      Fitness: {dxp:7, fitness:-6, fatigue:"Moderate", risk:"Moderate"}
    };
    return map[type] || map.Normal;
  }

  function playerReadiness(player) {
    if (player.status && player.status.toLowerCase().includes("injur")) {
      return {label:"Risk", cls:"risk"};
    }
    if (player.fitness >= 85) return {label:"Ready", cls:"ready"};
    if (player.fitness >= 65) return {label:"Manage", cls:"manage"};
    return {label:"Risk", cls:"risk"};
  }

  function recommendedIndividualFocus(player) {
    if (player.pos === "ST") return "Finishing";
    if (["RW","LW","AM"].includes(player.pos)) return "Dribbling";
    if (["CM","DM"].includes(player.pos)) return "Passing";
    if (["RB","LB"].includes(player.pos)) return "Crossing";
    if (player.pos === "CB") return "Tackling";
    if (player.pos === "GK") return "Reflexes";
    return "Balanced";
  }

  async function renderTraining() {
    setHeader("Training", "PLAYER DEVELOPMENT");

    const [players, trainingState, history, fixture] = await Promise.all([
      GameService.getSquad(),
      GameService.getTrainingState(),
      GameService.getTrainingHistory(),
      GameService.getNextFixture()
    ]);

    if (!state.training.type) state.training.type = trainingState.todayType;
    if (!state.training.teamFocus) state.training.teamFocus = trainingState.teamFocus;

    const mode = trainingModeMeta(state.training.type);
    const avgFitness = Math.round(players.reduce((sum,p)=>sum+p.fitness,0)/players.length);
    const readyCount = players.filter(p=>p.fitness>=85).length;
    const manageCount = players.filter(p=>p.fitness>=65 && p.fitness<85).length;
    const riskCount = players.filter(p=>p.fitness<65).length;

    const projectedFitness = Math.max(0,Math.min(100,avgFitness + mode.fitness));
    const recoveryEffect = state.training.type === "Recovery" ? 82 :
      state.training.type === "Light" ? 62 :
      state.training.type === "Normal" ? 48 :
      state.training.type === "Intensive" ? 24 : 44;

    const devEffect = Math.min(95, 35 + mode.dxp * 4);
    const fatigueEffect = Math.min(95, Math.abs(mode.fitness) * 6 + (state.training.type === "Intensive" ? 30 : 10));

    const trainingModes = [
      ["Recovery","Restore fitness, minimal development."],
      ["Light","Small DXP with low fatigue."],
      ["Normal","Balanced daily development."],
      ["Intensive","Maximum DXP, high fatigue."],
      ["Attacking","Focus attacking development."],
      ["Defensive","Focus defensive development."],
      ["Technical","Passing and ball skill focus."],
      ["Fitness","Stamina and physical focus."]
    ];

    const teamFocuses = ["Balanced","Attacking","Defensive","Technical","Fitness","Recovery"];

  function recoveryRow(label,value) {
    return `
