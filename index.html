  function transferPositionGroup(pos) {
    if (pos === "GK") return "GK";
    if (["RB","CB","LB","RWB","LWB"].includes(pos)) return "DEF";
    if (["DM","CM","AM","RM","LM"].includes(pos)) return "MID";
    return "ATT";
  }

  function statusClass(status) {
    const s = String(status || "").toLowerCase();
    if (s === "pending") return "pending";
    if (s === "accepted") return "accepted";
    if (s === "outbid") return "outbid";
    if (s === "rejected") return "rejected";
    return "";
  }

  async function renderTransfers() {
    setHeader("Transfers", "MARKET & CONTRACTS");
    const [market, club, squad] = await Promise.all([
      GameService.getTransferMarket(),
      GameService.getClub(),
      GameService.getSquad()
    ]);

    const squadSize = market.squadSize || squad.length;
    const availableSlots = Math.max(0, market.squadMax - squadSize);
    const wageRoom = Math.max(0, club.wageLimit - club.wageUsed);

    const tabs = [
      ["list","Transfer List"],
      ["free","Free Agents"],
      ["bids","My Bids"],
      ["received","Offers Received"]
    ];

    root.innerHTML = `
      <div class="transfer-shell">
        <div class="transfer-summary">
          <div class="transfer-stat">
            <span>Transfer Budget</span>
            <strong>${money(club.transferBudget)}</strong>
          </div>
          <div class="transfer-stat">
            <span>Wage Room</span>
            <strong>${wage(wageRoom)}</strong>
          </div>
          <div class="transfer-stat">
            <span>Squad</span>
            <strong>${squadSize}/${market.squadMax}</strong>
          </div>
          <div class="transfer-stat">
            <span>Window</span>
            <strong style="font-size:14px">${market.windowOpen ? "OPEN" : "CLOSED"}</strong>
            <div class="kpi-sub">${market.windowLabel} · ${market.closesIn}</div>
          </div>
        </div>

        <div class="transfer-tabs" id="transferTabs">
          ${tabs.map(([key,label]) => `
            <button type="button" class="transfer-tab ${state.transfers.tab===key?"active":""}" data-transfer-tab="${key}">${label}</button>
          `).join("")}
        </div>

        <div id="transferContent"></div>
      </div>
    `;

    const content = document.getElementById("transferContent");

    if (state.transfers.tab === "list") {
      renderTransferList(content, market, club, squadSize, availableSlots, wageRoom);
    } else if (state.transfers.tab === "free") {
      renderFreeAgents(content, market, club, availableSlots, wageRoom);
    } else if (state.transfers.tab === "bids") {
      renderMyBids(content, market);
    } else {
      renderOffersReceived(content, market, squadSize);
    }

    root.querySelectorAll("[data-transfer-tab]").forEach(btn => {
      btn.addEventListener("click", () => {
        state.transfers.tab = btn.dataset.transferTab;
        state.transfers.selectedPlayer = null;
        renderTransfers();
      });
    });
  }

  function renderTransferList(container, market, club, squadSize, availableSlots, wageRoom) {
    const positions = [["ALL","All"],["GK","GK"],["DEF","DEF"],["MID","MID"],["ATT","ATT"]];
    const q = state.transfers.search.trim().toLowerCase();

    const filtered = market.transferList.filter(p => {
      const matchesPos = state.transfers.position === "ALL" || transferPositionGroup(p.pos) === state.transfers.position;
      const matchesSearch = !q || p.name.toLowerCase().includes(q) || p.club.toLowerCase().includes(q) || p.pos.toLowerCase().includes(q);
      const a=state.transferAdvanced;
      return matchesPos && matchesSearch && p.ovr>=a.minOvr && (a.tier==="ALL"||p.tier===a.tier) && p.age<=a.maxAge && p.price<=a.maxPrice;
    });

    container.innerHTML = `
      <article class="card section-card">
        <div class="transfer-toolbar">
          <div class="transfer-filter-group" id="transferPosFilters">
            ${positions.map(([value,label]) => `
              <button type="button" class="filter-btn ${state.transfers.position===value?"active":""}" data-market-pos="${value}">${label}</button>
            `).join("")}
          </div>
          <input id="transferSearch" class="search-box" type="search" placeholder="Search player or club..." value="${escapeHtml(state.transfers.search)}" />
        </div>

        <div class="advanced-filters">
          <select class="game-select" id="filterOvr"><option value="0">Any OVR</option><option value="75">75+</option><option value="80">80+</option><option value="85">85+</option></select>
          <select class="game-select" id="filterTier"><option value="ALL">Any Tier</option><option>S</option><option>A</option><option>B</option><option>C</option><option>D</option></select>
          <select class="game-select" id="filterAge"><option value="99">Any Age</option><option value="23">≤23</option><option value="27">≤27</option><option value="30">≤30</option></select>
          <select class="game-select" id="filterPrice"><option value="999999999">Any Price</option><option value="10000000">≤£10M</option><option value="20000000">≤£20M</option><option value="40000000">≤£40M</option></select>
          <button class="secondary-btn" id="clearAdvancedFilters" type="button">Clear Filters</button>
        </div>
        <div style="height:14px"></div>

        <div class="transfer-grid">
          ${filtered.map(p => `
            <article class="market-card">
              <div class="market-head">
                <div class="market-avatar">${initials(p.name)}</div>
                <div>
                  <strong>${p.name}</strong>
                  <span>${p.club} · ${p.pos}${p.secondary && p.secondary!=="-" ? " / "+p.secondary : ""}</span>
                </div>
                <div class="market-ovr">${p.ovr}</div>
              </div>
              <div class="market-meta">
                <div><span>Price</span><strong>${money(p.price)}</strong></div>
                <div><span>Wage</span><strong>${wage(p.wage)}</strong></div>
                <div><span>Age</span><strong>${p.age}</strong></div>
                <div><span>Tier</span><strong>${p.tier}</strong></div>
                <div><span>Potential</span><strong>${p.potential}</strong></div>
                <div><span>Fitness</span><strong>${p.fitness}%</strong></div>
              </div>
              <div class="cooldown-tag">New purchase: resale locked for minimum 2 matchdays.</div>
              <div class="market-actions">
                <button class="watch-btn" type="button" data-market-watch="${p.id}">Watch</button>
                <button class="offer-btn" type="button" data-market-offer="${p.id}">Make Offer</button>
              </div>
            </article>
          `).join("") || `<div class="placeholder"><div><strong>No players found</strong><p>Try another search or position filter.</p></div></div>`}
        </div>
      </article>

      ${state.transfers.selectedPlayer ? buildOfferPanel(
        market.transferList.find(p=>p.id===state.transfers.selectedPlayer),
        club, squadSize, availableSlots, wageRoom
      ) : ""}
    `;

    container.querySelectorAll("[data-market-pos]").forEach(btn => {
      btn.addEventListener("click", () => {
        state.transfers.position = btn.dataset.marketPos;
        renderTransfers();
      });
    });

    const filterOvr=document.getElementById("filterOvr"), filterTier=document.getElementById("filterTier"), filterAge=document.getElementById("filterAge"), filterPrice=document.getElementById("filterPrice");
    if(filterOvr){filterOvr.value=String(state.transferAdvanced.minOvr);filterOvr.addEventListener("change",()=>{state.transferAdvanced.minOvr=Number(filterOvr.value);renderTransfers();});}
    if(filterTier){filterTier.value=state.transferAdvanced.tier;filterTier.addEventListener("change",()=>{state.transferAdvanced.tier=filterTier.value;renderTransfers();});}
    if(filterAge){filterAge.value=String(state.transferAdvanced.maxAge);filterAge.addEventListener("change",()=>{state.transferAdvanced.maxAge=Number(filterAge.value);renderTransfers();});}
    if(filterPrice){filterPrice.value=String(state.transferAdvanced.maxPrice);filterPrice.addEventListener("change",()=>{state.transferAdvanced.maxPrice=Number(filterPrice.value);renderTransfers();});}
    document.getElementById("clearAdvancedFilters")?.addEventListener("click",()=>{state.transferAdvanced={minOvr:0,tier:"ALL",maxAge:99,maxPrice:999999999};renderTransfers();});

    const search = document.getElementById("transferSearch");
    if (search) search.addEventListener("input", () => {
      state.transfers.search = search.value;
      renderTransfers();
    });

    container.querySelectorAll("[data-market-watch]").forEach(btn => {
      btn.addEventListener("click", () => showToast("Watchlist UI is local-only in Production Bridge V1."));

    container.querySelectorAll("[data-market-offer]").forEach(btn => {

        const player = market.transferList.find(p=>p.id===btn.dataset.marketOffer);

        state.transfers.offerAmount = player.price;
        renderTransfers();
      });
    });

    wireOfferPanel(container, market, club, availableSlots, wageRoom);
  }

  function buildOfferPanel(player, club, squadSize, availableSlots, wageRoom) {
    if (!player) return "";
    const amount = state.transfers.offerAmount || player.price;
    const afterBudget = club.transferBudget - amount;
    const contractYears = player.contract || 1;
    const financeOk = amount <= club.transferBudget;
    const wageOk = player.wage <= wageRoom;
    const squadOk = availableSlots > 0;
    const allOk = financeOk && wageOk && squadOk;

    return `
      <div style="height:16px"></div>
      <div class="offer-panel">
        <article class="card offer-box">
          <div class="section-head">
            <div>
              <p class="eyebrow">DIRECT OFFER</p>
              <h2>${player.name}</h2>
              <p>${player.club} · Asking ${money(player.price)}</p>
            </div>
            <span class="badge">${player.pos} · OVR ${player.ovr}</span>
          </div>

          <div class="offer-player">
            <div class="market-avatar">${initials(player.name)}</div>
            <div>
              <strong>${player.name}</strong>
              <span>${player.pos} · Age ${player.age} · Tier ${player.tier}</span>
            </div>
            <strong>${money(player.price)}</strong>
          </div>

          <div style="height:14px"></div>

          <div class="offer-form">
            <div>
              <label for="offerAmount">Transfer Fee</label>
              <input id="offerAmount" class="money-input" type="number" min="0" step="500000" value="${amount}" />
            </div>
            <div class="production-status-box"><strong>Contract term</strong><p>${contractYears} season${contractYears>1?"s":""} remaining. Direct transfer settlement preserves the current remaining term; wage is validated server-side.</p></div>
            <button class="primary-btn" id="submitOfferBtn" type="button" ${allOk ? "" : "disabled"}>Submit Offer</button>
          </div>
        </article>

        <article class="card offer-box">
          <div class="section-head">
            <div>
              <p class="eyebrow">DEAL CHECK</p>
              <h2>Financial Preview</h2>
            </div>
          </div>

          <div class="offer-preview">
            <div class="preview-row"><span>Transfer Budget</span><strong>${money(club.transferBudget)}</strong></div>
            <div class="preview-row"><span>Offer</span><strong>${money(amount)}</strong></div>
            <div class="preview-row"><span>Budget After Deal</span><strong class="${afterBudget>=0?"good":"danger"}">${money(Math.max(0,afterBudget))}</strong></div>
            <div class="preview-row"><span>Player Wage</span><strong>${wage(player.wage)}</strong></div>
            <div class="preview-row"><span>Wage Room</span><strong class="${wageOk?"good":"danger"}">${wage(wageRoom)}</strong></div>
            <div class="preview-row"><span>Squad Slots</span><strong class="${squadOk?"good":"danger"}">${availableSlots}</strong></div>
            <div class="preview-row"><span>Contract</span><strong>${contractYears} season${contractYears>1?"s":""}</strong></div>
          </div>

          <div style="height:12px"></div>
          ${allOk
            ? `<div class="finance-ok">Offer passes client preview checks: transfer budget, wage room and squad limit. Real settlement will be atomic server-side; accepted purchase receives a 2-matchday resale cooldown.</div>`
            : `<div class="finance-warning">${!financeOk?"Transfer budget insufficient. ":""}${!wageOk?"Wage room insufficient. ":""}${!squadOk?"Squad already at maximum size.":""}</div>`}
        </article>
      </div>
    `;
  }

  function wireOfferPanel(container, market, club, availableSlots, wageRoom) {
    const amountInput = document.getElementById("offerAmount");
    const submit = document.getElementById("submitOfferBtn");

    if (amountInput) {
      amountInput.addEventListener("change", () => {
        state.transfers.offerAmount = Math.max(0, Number(amountInput.value || 0));
        renderTransfers();
      });
    }
    if (submit) {
      submit.addEventListener("click", async () => {
        const p = market.transferList.find(x=>x.id===state.transfers.selectedPlayer);
        submit.disabled=true;
        try { await GameService.makeTransferOffer(p.id,state.transfers.offerAmount,p.wage); showToast(`Offer ${money(state.transfers.offerAmount)} submitted for ${p.name}.`); state.transfers.selectedPlayer=null; }
        catch(err){ showToast(`Offer gagal: ${err.message}`); }
        await renderTransfers();
      });
    }
  }

  function matchEventIcon(type) {
    return {goal:"⚽",shot:"↗",save:"🧤",card:"■",sub:"⇄",info:"i"}[type] || "•";
  }

  function generateEvent(minute) {
    const homeAttack = 0.53;
    const isHome = Math.random() < homeAttack;
    const team = isHome ? "MS7 FC" : "Northstar United";
    const shotRoll = Math.random();

    if (shotRoll < 0.22) {
      const xg = +(0.04 + Math.random()*0.36).toFixed(2);
      if (isHome) {
        state.match.shotsHome++;
        state.match.xgHome = +(state.match.xgHome + xg).toFixed(2);
      } else {
        state.match.shotsAway++;
        state.match.xgAway = +(state.match.xgAway + xg).toFixed(2);
      }

      const onTarget = Math.random() < 0.48;
      if (onTarget) {
        if (isHome) state.match.sotHome++; else state.match.sotAway++;
        const goal = Math.random() < Math.min(.72, xg + .15);
        if (goal) {
          if (isHome) state.match.homeScore++; else state.match.awayScore++;
          return {minute,type:"goal",text:`GOAL — ${team} finish a ${xg.toFixed(2)} xG chance.`};
        }
        return {minute,type:"save",text:`Save! ${team} test the goalkeeper.`};
      }
      return {minute,type:"shot",text:`${team} attempt misses the target.`};
    }

    if (shotRoll < 0.28) {
      if(Math.random()<0.5){state.match.cardsHome++;state.match.foulsHome++;}else{state.match.cardsAway++;state.match.foulsAway++;}
      return {minute,type:"card",text:`Yellow card shown after a late challenge.`};
    }
    if (shotRoll < 0.31) return {minute,type:"sub",text:`Substitution made to refresh the team.`};
    if (shotRoll < 0.38) { if(isHome) state.match.cornersHome++; else state.match.cornersAway++; return {minute,type:"info",text:`${team} win a corner.`}; }
    if (shotRoll < 0.46) { if(isHome) state.match.foulsAway++; else state.match.foulsHome++; return {minute,type:"info",text:`Foul in midfield.`}; }
    return null;
  }

                <div class="finance-card"><span>Wage Usage</span><strong>${wagePct}%</strong></div>
              </div>
            </article>
            <article class="card section-card">
              <div class="section-head"><div><p class="eyebrow">LEDGER</p><h2>Transaction History</h2></div></div>
              <div class="ledger-list">
                ${finance.ledger.map(l=>`
                  <div class="ledger-row">
                    <span>${l.date}</span><span>${l.type}</span><strong>${l.detail}</strong>
                    <strong class="ledger-amount ${l.amount>=0?"positive":"negative"}">${l.amount>=0?"+":""}${money(Math.abs(l.amount))}</strong>
                  </div>`).join("")}
              </div>
            </article>
          </div>
          <aside class="stack">
            <article class="card section-card">
              <div class="section-head"><div><p class="eyebrow">INCOME</p><h2>Season Revenue</h2></div></div>
              <div class="form-bars">
                ${strengthRow("Sponsor", Math.min(100,finance.sponsorIncome/120000))}
                ${strengthRow("Matchday", Math.min(100,finance.matchdayIncome/60000))}
                ${strengthRow("Prize", Math.min(100,finance.seasonPrize/200000))}
              </div>
            </article>
            <article class="card section-card"><div class="training-safe">Dalam backend asli, ledger dan saldo hanya dapat dimutasi server-side.</div></article>
          </aside>
        </div>`;
    } else if (state.clubView.tab === "facilities") {
      content.innerHTML = `
        <article class="card section-card">
          <div class="section-head"><div><p class="eyebrow">FACILITIES</p><h2>Club Infrastructure</h2><p>Training, medical and stadium progression.</p></div><span class="badge">Balance ${money(finance.balance)}</span></div>
          <div class="facility-grid">
            ${facilities.map((f,i)=>`
              <div class="facility-card">
                <div class="facility-head"><div><strong>${f.type}</strong><p>${f.effect}</p></div><span class="facility-level">Level ${f.level}</span></div>
                <div class="facility-next">Next: ${f.nextEffect} · Upgrade time ${f.upgradeTime}</div>
                <div class="facility-action"><span>${money(f.upgradeCost)}</span><button class="secondary-btn" type="button" data-facility-upgrade="${i}">Preview Upgrade</button></div>
              </div>`).join("")}
          </div>
        </article>`;
      content.querySelectorAll("[data-facility-upgrade]").forEach(btn=>{
        btn.addEventListener("click",async()=>{
          const f=facilities[Number(btn.dataset.facilityUpgrade)];
          if(!f.upgradeCost){showToast(`${f.type} sudah max level.`);return;}
          if(!confirm(`Upgrade ${f.type} for ${money(f.upgradeCost)}?`))return;
          btn.disabled=true;
          try{await GameService.upgradeFacility(f.facilityKey);showToast(`${f.type} upgraded server-side.`);}catch(err){showToast(`Upgrade gagal: ${err.message}`);}
          await renderClub();
        });
      });
    } else if (state.clubView.tab === "trophies") {
      content.innerHTML = `
        <article class="card section-card">
          <div class="section-head"><div><p class="eyebrow">TROPHY CABINET</p><h2>Honours</h2><p>Permanent club achievements across game seasons.</p></div></div>
          <div class="trophy-grid">
            ${history.trophies.map(t=>`<div class="trophy-card"><strong>${t.name}</strong><b>${t.count}</b><span class="subtext">Career total</span></div>`).join("")}
          </div>
        </article>`;
    } else {
      content.innerHTML = `
        <article class="card section-card">
          <div class="section-head"><div><p class="eyebrow">CLUB HISTORY</p><h2>Timeline</h2><p>Records persist across season rollover.</p></div></div>
          <div class="club-history-list">
            ${history.events.map(e=>`<div class="club-history-row"><span>${e.season}</span><strong>${e.event}</strong></div>`).join("")}
          </div>
        </article>`;
    }

    root.querySelectorAll("[data-club-tab]").forEach(btn=>{
      btn.addEventListener("click",()=>{ state.clubView.tab = btn.dataset.clubTab; renderClub(); });
    });
  }

  async function renderInbox() {
    setHeader("Inbox", "NOTIFICATIONS");
    const notes = await GameService.getNotifications();
    const categories = ["All","Unread","Match","Transfer","Player","Finance","League"];
    const filtered = notes.filter(n => {
      if (state.inbox.filter === "All") return true;
      if (state.inbox.filter === "Unread") return !n.read;
      return n.category === state.inbox.filter;
    });

    root.innerHTML = `
      <div class="inbox-layout">
        <aside class="inbox-filters">
          ${categories.map(c=>`<button type="button" class="inbox-filter ${state.inbox.filter===c?"active":""}" data-inbox-filter="${c}">${c}</button>`).join("")}
          <button class="secondary-btn" id="markAllReadBtn" type="button">Mark all read</button>
        </aside>
        <article class="card section-card">
          <div class="section-head">
            <div><p class="eyebrow">MANAGER INBOX</p><h2>${state.inbox.filter}</h2><p>Match, transfer, player, finance and league updates.</p></div>
            <span class="badge">${filtered.length} items</span>
          </div>
          <div class="notification-list">
            ${filtered.length ? filtered.map(n=>`
              <div class="notification-card ${n.read?"":"unread"}">
                <div class="notification-symbol">${{Match:"▶",Transfer:"£",Player:"XI",Finance:"$",League:"LG"}[n.category]||"i"}</div>
                <div>
                  <strong>${n.title}</strong>
                  <p>${n.message}</p>
                  <div class="notification-actions">
                    ${!n.read?`<button class="auth-link" type="button" data-note-read="${n.id}">Mark read</button>`:""}
                  </div>
                </div>
                <time>${n.time}</time>
              </div>`).join("") : `<div class="placeholder"><div><strong>No notifications</strong><p>Nothing in this category.</p></div></div>`}
          </div>
        </article>
      </div>`;

    root.querySelectorAll("[data-inbox-filter]").forEach(btn=>{
      btn.addEventListener("click",()=>{state.inbox.filter=btn.dataset.inboxFilter;renderInbox();});
    });
    root.querySelectorAll("[data-note-read]").forEach(btn=>{
      btn.addEventListener("click",async()=>{try{await GameService.markNotificationRead(btn.dataset.noteRead);showToast("Notification marked read.");}catch(err){showToast(`Read gagal: ${err.message}`);}await refreshNotificationCounts();await renderInbox();});
    });
    document.getElementById("markAllReadBtn")?.addEventListener("click",async()=>{try{const c=state.inbox.filter;await GameService.markAllNotificationsRead(["Match","Transfer","Player","Finance","League"].includes(c)?c.toUpperCase():null);showToast("Notifications marked read.");}catch(err){showToast(`Mark all gagal: ${err.message}`);}await refreshNotificationCounts();await renderInbox();});
  }

  async function renderSeason() {
    setHeader("Season", "WORLD CYCLE");
    const s = await GameService.getSeasonCentre();

    root.innerHTML = `
      <div class="module-tabs">
        ${[["overview","Overview"],["awards","Awards"],["hall","Hall of Fame"],["rollover","Rollover"]].map(([k,l])=>`
          <button class="module-tab ${state.seasonView.tab===k?"active":""}" type="button" data-season-tab="${k}">${l}</button>`).join("")}
      </div>
      <div id="seasonContent"></div>`;

    const content = document.getElementById("seasonContent");
    if (state.seasonView.tab === "overview") {
      content.innerHTML = `
        <div class="season-hero">
          <article class="card section-card">
            <div class="section-head">
              <div><p class="eyebrow">SEASON ${s.currentSeason}</p><h2>${s.phaseLabel}</h2><p>Matchday ${s.currentMatchday} / ${s.totalMatchdays}</p></div>
              <span class="badge live">${s.progressPct}% complete</span>
            </div>
            <div class="match-progress"><i style="width:${s.progressPct}%"></i></div>
            <div style="height:16px"></div>
            <div class="phase-track">
              ${s.timeline.map(p=>`<div class="phase-item ${p.status}"><strong>${p.label}</strong><span>${p.note}</span><span class="phase-state">${p.status}</span></div>`).join("")}
            </div>
          </article>
          <aside class="card section-card">
            <p class="eyebrow">NEXT MILESTONE</p><h2>Midseason Break</h2>
            <p style="color:var(--muted);font-size:11px;line-height:1.6">2 full days without league matches for transfer window, recovery and tactical rebuild.</p>
            <div class="finance-card"><span>Estimated in</span><strong>${s.daysUntilMidseason} days</strong></div>
          </aside>
        </div>`;
    } else if (state.seasonView.tab === "awards") {
      content.innerHTML = `
        <article class="card section-card">
          <div class="section-head"><div><p class="eyebrow">AWARDS RACE</p><h2>Current Leaders</h2><p>Final awards are locked only after the final matchday.</p></div></div>
          <div class="award-grid">
            ${s.awardsRace.map(a=>`<div class="award-card"><span>${a.award}</span><strong>${a.leader}</strong><span>${a.club}</span><b>${a.value}</b></div>`).join("")}
          </div>
        </article>`;
    } else if (state.seasonView.tab === "hall") {
      content.innerHTML = `
        <article class="card table-card">
          <div class="section-card" style="padding-bottom:8px"><div class="section-head"><div><p class="eyebrow">HALL OF FAME</p><h2>World History</h2><p>Permanent record across seasons.</p></div></div></div>
          <div class="table-wrap">
            <table class="hof-table"><thead><tr><th>Season</th><th>Champion</th><th>Runner-up</th><th>Golden Boot</th><th>Player of Season</th></tr></thead>
            <tbody>${s.hallOfFame.map(h=>`<tr><td>${h.season}</td><td>${h.champion}</td><td>${h.runnerUp}</td><td>${h.goldenBoot}</td><td>${h.playerSeason}</td></tr>`).join("")}</tbody></table>
          </div>
        </article>`;
    } else {
      content.innerHTML = `
        <article class="card section-card">
          <div class="section-head"><div><p class="eyebrow">SEASON ROLLOVER</p><h2>Execution Order</h2><p>Must run once and be idempotent in the real backend.</p></div></div>
          <div class="rollover-list">${s.rollover.map((r,i)=>`<div class="rollover-row"><i>${i+1}</i><strong>${r}</strong></div>`).join("")}</div>
        </article>`;
    }
    root.querySelectorAll("[data-season-tab]").forEach(btn=>{
      btn.addEventListener("click",()=>{state.seasonView.tab=btn.dataset.seasonTab;renderSeason();});
    });
  }

  async function renderAdmin() {
    setHeader("Admin", "WORLD CONTROL");
    root.innerHTML = `
      <article class="card section-card">
        <div class="section-head">
          <div>
            <p class="eyebrow">OWNER / ADMIN</p>
            <h2>Production Admin Console</h2>
            <p>Kelola manager, klub, dan Founding Draw melalui console Owner/Admin production.</p>
          </div>
        </div>
        <div class="production-status-box">
          <strong>Production only</strong>
          <p>Tidak ada data manager dummy atau  di build final ini.</p>
        </div>
      </article>`;
  }

  async function openPlayer(id) {
    const p = await GameService.getPlayerById(id);
    if (!p) return;
    dialogPlayerName.textContent = p.name;

    dialogPlayerBody.innerHTML = `
      <div class="player-summary">
        <div class="big-rating">
          <div>
            <strong>${p.ovr}</strong>
            <span>${p.pos} · Tier ${p.tier}</span>
          </div>
        </div>
        <div class="player-facts">
          ${fact("Age", p.age)}
          ${fact("Fitness", p.fitness + "%")}
          ${fact("Form", p.form)}
          ${fact("Potential", p.potential)}
          ${fact("Contract", p.contract + " season")}
          ${fact("Wage", wage(p.wage))}
          ${fact("Reference Season", p.refSeason)}
          ${fact("Reference Club", p.refClub)}
          ${fact("Reference Age", p.refAge ?? "-")}
          ${fact("Career Stage", p.careerStage || "-")}
          ${fact("Primary / Secondary", p.pos + " / " + (p.secondary||"-"))}
          ${fact("Injury", p.injury?.level||"None")}
          ${fact("Suspension", p.suspension?.active ? p.suspension.matches+" match" : "None")}
          ${fact("Retirement Risk", p.retirementRisk||"Low")}
          ${fact("Resale Cooldown", (p.resaleCooldown||0)+" matchday")}
        </div>
      </div>

      <div class="attributes"><h3>Positional OVR & Familiarity</h3><div class="player-facts">${(p.positionOvrs||[]).map(x=>fact(x.position,`${x.ovr} · ${x.familiarity}`)).join("")}</div></div>
      <div class="attributes"><h3>Season Statistics</h3><div class="player-facts">${fact("Appearances",p.stats?.appearances??0)}${fact("Starts",p.stats?.starts??0)}${fact("Minutes",p.stats?.minutes??0)}${fact("Goals",p.stats?.goals??0)}${fact("Assists",p.stats?.assists??0)}${fact("Avg Rating",p.stats?.avgRating??"-")}${fact("Clean Sheets",p.stats?.cleanSheets??0)}</div></div>
      <div class="attributes"><h3>Injury / Availability</h3><div class="player-facts">${fact("Level",p.injury?.level||"None")}${fact("Matches Affected",p.injury?.matchesAffected??0)}${fact("Playable",p.injury?.playable===false?"No":"Yes")}${fact("Expected Return Fitness",(p.injury?.returnFitness??p.fitness)+"%")}</div></div>
      <div class="attributes"><h3>Development Outlook</h3><div class="player-facts">${fact("Age Multiplier",p.age<=20?"1.35×":p.age<=22?"1.25×":p.age<=24?"1.15×":p.age<=26?"1.00×":p.age<=28?"0.85×":p.age<=30?"0.60×":p.age<=32?"0.35×":"0.15×")}${fact("Season Growth Band",p.age<=24?"Typically +1 to +3 OVR":p.age<=28?"Typically 0 to +1 OVR":"Stable / decline risk")}${fact("Potential",p.potential)}${fact("Retirement Risk",p.retirementRisk||"Low")}</div><div class="subtext">Potential remains a hidden soft ceiling; only the label is shown. Physical attributes decline earlier than technical/positioning attributes.</div></div>
      <div class="attributes"><h3>Contract Actions</h3><div class="contract-panel"><div class="contract-actions"><select id="renewContractYears" class="game-select">${[1,2,3].map(y=>`<option value="${y}">${y} season${y>1?'s':''}</option>`).join("")}</select><button class="secondary-btn" id="renewContractBtn">Renew Contract</button><button class="secondary-btn" id="listTransferBtn">List for Transfer</button><button class="reject-btn" id="releasePlayerBtn">Release Player</button></div><div class="subtext">Contract max 3 seasons. Early release compensation: approximately 30–50% remaining wages.</div></div></div>
      <div class="attributes"><h3>Game Career History</h3><div class="table-wrap"><table class="career-table"><thead><tr><th>Season</th><th>Club</th><th>Apps</th><th>Goals</th><th>Assists</th><th>Rating</th></tr></thead><tbody>${(p.careerHistory||[]).map(h=>`<tr><td>${h.season}</td><td>${h.club}</td><td>${h.apps}</td><td>${h.goals}</td><td>${h.assists}</td><td>${h.rating}</td></tr>`).join("")}</tbody></table></div></div>

      <div class="attributes">
        <h3>Attributes</h3>
        <div class="attr-grid">
          ${Object.entries(p.attributes).map(([name,value]) => `
            <div class="attr">
              <span>${name}</span>
              <div class="attr-bar"><i style="width:${value}%"></i></div>
              <strong>${value}</strong>
            </div>
          `).join("")}
        </div>
      </div>
    `;

    document.getElementById("renewContractBtn")?.addEventListener("click",async()=>{const y=Number(document.getElementById("renewContractYears").value);try{await GameService.renewContract(p.id,y,p.wage);showToast(`${p.name}: renewal ${y} season queued server-side.`);}catch(err){showToast(`Renew gagal: ${err.message}`);}});
    document.getElementById("listTransferBtn")?.addEventListener("click",async()=>{const ask=Number(prompt(`Asking price for ${p.name} (£)`,String(Math.max(1000000,Math.round(p.ovr*p.ovr*4000)))));if(!ask)return;try{await GameService.listPlayerForTransfer(p.id,ask);showToast(`${p.name} listed for ${money(ask)}.`);playerDialog.close();}catch(err){showToast(`Listing gagal: ${err.message}`);}});
    document.getElementById("releasePlayerBtn")?.addEventListener("click",async()=>{if(!confirm(`Release ${p.name}? Server will enforce minimum 18 squad and 2 GK.`))return;try{await GameService.releasePlayer(p.id);showToast(`${p.name} released server-side.`);playerDialog.close();await render();}catch(err){showToast(`Release gagal: ${err.message}`);}});
    playerDialog.showModal();
  }

  function fact(label, value) {
    return `<div class="fact"><span>${label}</span><strong>${value}</strong></div>`;
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, ch => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    })[ch]);
  }

  async function render() {
    if (state.preseason.active) {
      if (state.view === "home") await renderPreseasonHome();
      else if (state.view === "squad") await renderPreseasonSquad();
      else if (state.view === "club") await renderPreseasonClub();
      else if (state.view === "inbox") await renderPreseasonInbox();
      else await renderPreseasonLocked(state.view);
      return;
    }

    if (state.view === "draw") await renderDraw();
    else if (state.view === "squad") await renderSquad();
    else if (state.view === "tactics") await renderTactics();
    else if (state.view === "training") await renderTraining();
    else if (state.view === "transfers") await renderTransfers();
    else if (state.view === "league") await renderLeague();
    else if (state.view === "match") await renderMatch();
    else if (state.view === "club") await renderClub();
    else if (state.view === "season") await renderSeason();
    else if (state.view === "inbox") await renderInbox();
    else if (state.view === "admin") await renderAdmin();
    else await renderHome();
    refreshNotificationCounts();
  }

  if (false && "serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }

  MS7Service.client.auth.onAuthStateChange((event) => {
    if (event === "SIGNED_OUT") {
      state.production.bootstrap = null;
      state.session.screen = "login";
    }
  });

  showAuth(true);
})();

</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.warn('Service worker registration failed', err));
  });
}
</script>

</body>
</html>
