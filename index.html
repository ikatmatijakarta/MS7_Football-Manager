        violet:["#c084fc","#4c1d95","#10071a"],
        silver:["#e2e8f0","#334155","#0b1018"]
      };
      const [accent,mid,dark] = legacy[themeId] || legacy.lime;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${accent}"/><stop offset="1" stop-color="${mid}"/></linearGradient></defs><path d="M64 5 112 24 104 89 64 122 24 89 16 24Z" fill="url(#g)" stroke="${accent}" stroke-width="4"/><path d="M64 14 101 29 95 84 64 109 33 84 27 29Z" fill="${dark}" opacity=".82"/><text x="64" y="67" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="900" fill="${accent}">${short}</text></svg>`;
      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
    }

    const [accent,mid,dark] = CLUB_LOGO_THEMES[themeId] || CLUB_LOGO_THEMES["pulse-lime"];
    const meta = CLUB_LOGO_META[themeId] || CLUB_LOGO_META["pulse-lime"];
    const gradientId = `g${themeId.replace(/[^a-z0-9]/gi,"")}`;
    const outer = crestOuter(meta.shape, `url(#${gradientId})`, accent);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
      <defs>
        <linearGradient id="${gradientId}" x1="0" y1="0" x2="1" y2="1">
          <stop stop-color="${dark}"/>
          <stop offset=".58" stop-color="${mid}"/>
          <stop offset="1" stop-color="${dark}"/>
        </linearGradient>
        <filter id="glow"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      ${outer}
      ${crestPattern(meta.pattern,accent,mid,dark)}
      <g opacity=".98" filter="url(#glow)">${crestMark(meta.mark,accent)}</g>
      <rect x="29" y="88" width="70" height="23" rx="10" fill="${dark}" opacity=".86" stroke="${accent}" stroke-width="1.4"/>
      <text x="64" y="104" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="${short.length>3?16:19}" font-weight="900" letter-spacing="1" fill="${accent}">${short}</text>
    </svg>`;
    return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
  }

  function crestMarkup({short="FC",name="Club",logoUrl=null,className="team-logo"}={}) {
    let src = logoUrl || makeClubLogoDataUrl(short || initials(name), "pulse-lime");
    if (String(logoUrl||"").startsWith("crest2:")) {
      const [,theme,tokenShort] = String(logoUrl).split(":");
      src = makeClubLogoDataUrl(tokenShort || short || initials(name), theme || "pulse-lime");
    } else if (String(logoUrl||"").startsWith("crest:")) {
      const [,theme,tokenShort] = String(logoUrl).split(":");
      src = makeClubLogoDataUrl(tokenShort || short || initials(name), theme || "lime");
    }
    return `<div class="${htmlSafe(className)}" title="${htmlSafe(name)}"><img src="${htmlSafe(src)}" alt="Logo ${htmlSafe(name)}" loading="lazy"></div>`;
  }

  async function productionLogout() {
    try { await MS7Service.signOut(); } catch (err) { console.error(err); }
    state.production.bootstrap = null;
    state.session.screen = "login";
    state.session.loggedIn = false;
    configurePreseasonNavigation(false);
    window.GameService = window.RealGameService;
    mobileBottomNav?.classList.add("is-hidden");
    await showAuth();
  }

  async function resolveProductionState() {
    state.production.loading = true;
    state.production.error = null;
    state.session.screen = "loading";
    authRoot.innerHTML = authTemplate("loading");
    gameApp.classList.add("is-hidden");
    try {
      const b = await MS7Service.bootstrap();
      state.production.bootstrap = b;
      state.session.screen = b.screen || "login";
      state.session.pending = b.profile?.approval_status === "pending";
      state.session.approved = b.profile?.approval_status === "approved";
      state.session.clubCreated = !!b.club;
      state.session.loggedIn = !!b.session;
      return b;
    } catch (err) {
      console.error("Supabase bootstrap error", err);
      state.production.error = err.message || String(err);
      state.session.screen = "error";
      return null;
    } finally {
      state.production.loading = false;
    }
  }

  async function enterPreseasonLobby() {
    const b = state.production.bootstrap || {};
    if (!b.session || !b.profile || !b.club) {
      showToast("Preseason Lobby belum tersedia untuk akun ini.");
      return;
    }

    window.GameService = window.RealGameService;
    configurePreseasonNavigation(true);

    state.session.loggedIn = true;
    state.session.approved = true;
    state.session.clubCreated = true;

    authRoot.innerHTML = "";
    gameApp.classList.remove("is-hidden");
    mobileBottomNav?.classList.remove("is-hidden");

    const hiddenAdminNav = nav.querySelector('[data-view="admin"]');
    if (hiddenAdminNav) hiddenAdminNav.classList.add("is-hidden");

    state.view = "home";
    syncActiveNav();

  async function ensureTacticsInitialized() {
    if (Object.keys(state.lineup).length) return;

  }

  function compatibleScore(slot, player) {
    const p = player.pos;
    const s = slot;
    if (s === p) return 100;
    const map = {
      RWB:["RB","RW"], LWB:["LB","LW"], RM:["RW","RB","CM"], LM:["LW","LB","CM"],
      DM:["CM","CB"], CM:["DM","AM"], AM:["CM","RW","LW"], ST:["LW","RW"],
      RW:["AM","ST"], LW:["AM","ST"], RB:["CB"], LB:["CB"], CB:["DM"]
    };
    if ((map[s] || []).includes(p)) return 80;
    if (player.secondary && player.secondary !== "-" && player.secondary.split("/").includes(s)) return 90;
    return 35;
  }

  function playerEligibleForLineup(player) {
    if (!player) return false;
    if (player.suspension?.active) return false;
    if (player.injury?.playable === false) return false;
    return true;
  }

  function assignDefaultLineup(players, formation) {
    const slots = formations[formation];
    const available = players.filter(playerEligibleForLineup);
    const lineup = {};

    slots.forEach((slot, idx) => {
      const role = slot[0];
      available.sort((a,b) => {
        const scoreA = compatibleScore(role,a) * 10 + a.ovr + a.fitness/20;
        const scoreB = compatibleScore(role,b) * 10 + b.ovr + b.fitness/20;
        return scoreB - scoreA;
      });

      // Goalkeeper slot must use a goalkeeper.
      let chosenIndex = role === "GK" ? available.findIndex(p => p.pos === "GK") : 0;
      if (chosenIndex < 0) chosenIndex = 0;
      const chosen = available.splice(chosenIndex,1)[0];
      if (chosen) lineup[idx] = chosen.id;
    });

    state.lineup = lineup;
    const used = new Set(Object.values(lineup));
    state.bench = players
      .filter(p => playerEligibleForLineup(p) && !used.has(p.id))
      .sort((a,b)=>b.ovr-a.ovr || b.fitness-a.fitness)
      .slice(0,9)
      .map(p => p.id);
  }

  function validateLineupClient(players, formationCode) {
    const shape = formations[formationCode] || [];
    const playerById = new Map(players.map(p=>[p.id,p]));
    const starterIds = shape.map((_,idx)=>state.lineup[idx]).filter(Boolean);
    const benchIds = state.bench.filter(Boolean).slice(0,9);
    const unique = new Set([...starterIds,...benchIds]);

    const errors = [];
    if (starterIds.length !== 11) errors.push("Starting XI harus berisi tepat 11 pemain.");
    if (unique.size !== starterIds.length + benchIds.length) errors.push("Pemain yang sama tidak boleh berada di dua slot.");
    const gkSlot = shape.findIndex(x=>x[0]==="GK");
    const gk = gkSlot >= 0 ? playerById.get(state.lineup[gkSlot]) : null;
    if (!gk || gk.pos !== "GK") errors.push("Slot GK wajib diisi goalkeeper.");
    const ineligible = starterIds.map(id=>playerById.get(id)).filter(p=>p && !playerEligibleForLineup(p));
    if (ineligible.length) errors.push(`Ada pemain tidak eligible: ${ineligible.map(p=>p.name).join(", ")}.`);
    return {ok:errors.length===0, errors, starters:starterIds.length, bench:benchIds.length, unique:unique.size};
  }

  }

    ]);

    const positionGroups = [
      ["ALL","All"],
      ["GK","GK"],
      ["DEF","DEF"],
      ["MID","MID"],
      ["ATT","ATT"]
    ];

    const avg = arr => arr.length ? Math.round(arr.reduce((a,b)=>a+b,0)/arr.length) : 0;
    const totalWage = players.reduce((sum,p)=>sum+Number(p.wage||0),0);
    const avgOvr = avg(players.map(p=>Number(p.ovr||0)));
    const avgFitness = avg(players.map(p=>Number(p.fitness||0)));
    const availableCount = players.filter(p=>p.availabilityKey==="AVAILABLE").length;
    const tierCounts = ["S","A","B","C","D"].reduce((acc,t)=>(acc[t]=players.filter(p=>p.tier===t).length,acc),{});
    const expectedFoundingSize = 22;
    const integrityOk = players.length === expectedFoundingSize;
    const squadCapacity = 25;

    const statusOptions = [
      ["ALL","All status"],
      ["AVAILABLE","Available"],
      ["INJURED","Injured"],
      ["SUSPENDED","Suspended"]
    ];
    const tierOptions = [["ALL","All tiers"],["S","Tier S"],["A","Tier A"],["B","Tier B"],["C","Tier C"],["D","Tier D"]];
    const sortOptions = [
      ["OVR_DESC","OVR · High to Low"],
      ["OVR_ASC","OVR · Low to High"],
      ["NAME_ASC","Name · A–Z"],
      ["AGE_ASC","Age · Youngest"],
      ["FITNESS_DESC","Fitness · Highest"],
      ["WAGE_DESC","Wage · Highest"]
    ];

    root.innerHTML = `
      <div class="squad-production-head">
        <article class="squad-summary-card">
          <div class="squad-summary-top">
            <div>
              <p class="eyebrow">PRODUCTION SQUAD</p>

            </div>
          </div>

            <div class="squad-kpi"><span>Average OVR</span><strong>${avgOvr || "—"}</strong></div>
            <div class="squad-kpi"><span>Avg Fitness</span><strong>${players.length ? avgFitness+"%" : "—"}</strong></div>
            <div class="squad-kpi"><span>Available</span><strong>${availableCount}/${players.length}</strong></div>
            <div class="squad-kpi"><span>Weekly Wage</span><strong>${wage(totalWage)}</strong></div>
          </div>

          <div class="squad-integrity ${integrityOk?"":"warn"}">
            ${integrityOk
              ? `Founding squad integrity: ${expectedFoundingSize}/${expectedFoundingSize} owned players detected.`
              : `Squad currently contains ${players.length} owned players. Founding allocation target is ${expectedFoundingSize}; later transfers can move the roster within the 18–25 rule.`}
          </div>
        </article>

        <aside class="squad-tier-panel">
          <p class="eyebrow">TIER DISTRIBUTION</p>
          <h3>Current squad</h3>
          <div class="squad-tier-list">
            ${["S","A","B","C","D"].map(t=>{
              const n=tierCounts[t]||0;
              const pct=players.length?Math.round((n/players.length)*100):0;
              return `<div class="squad-tier-row"><b>${t}</b><i style="--tier-pct:${pct}%"></i><span>${n}</span></div>`;
            }).join("")}
          </div>
        </aside>
      </div>

      <div class="squad-controls">
        <input id="squadSearch" class="squad-control" type="search" placeholder="Search player / position / historical club..." value="${escapeHtml(state.squadSearch)}" />
        <select id="squadAvailability" class="squad-control">
          ${statusOptions.map(([v,l])=>`<option value="${v}" ${state.squadAvailability===v?"selected":""}>${l}</option>`).join("")}
        </select>
        <select id="squadTier" class="squad-control">
          ${tierOptions.map(([v,l])=>`<option value="${v}" ${state.squadTier===v?"selected":""}>${l}</option>`).join("")}
        </select>
        <select id="squadSort" class="squad-control">
          ${sortOptions.map(([v,l])=>`<option value="${v}" ${state.squadSort===v?"selected":""}>${l}</option>`).join("")}
        </select>
      </div>

      <div class="filters" id="positionFilters">
        ${positionGroups.map(([value,label]) => `<button class="filter-btn ${state.squadFilter === value ? "active":""}" type="button" data-filter="${value}">${label}</button>`).join("")}
      </div>

      <div class="squad-status-line">
        <span class="squad-status-chip">Showing <strong id="squadVisibleCount">${players.length}</strong></span>
        <span class="squad-status-chip">Injured <strong>${players.filter(p=>p.availabilityKey==="INJURED").length}</strong></span>
        <span class="squad-status-chip">Suspended <strong>${players.filter(p=>p.availabilityKey==="SUSPENDED").length}</strong></span>
        <span class="squad-status-chip">Squad rule <strong>18–25 · min 2 GK</strong></span>
      </div>

      <div class="squad-historical-note">
        <strong>Historical Reference</strong> menunjukkan klub dan musim EPL yang menjadi basis identitas/data pemain pada database game. Itu bukan berarti pemain tersebut saat ini dimiliki klub EPL tersebut.
      </div>

      <article class="card table-card squad-desktop-table">
        <div class="table-wrap">
          <table class="squad-table">
            <thead>
              <tr>
                <th>Player</th>
                <th>Pos</th>
                <th>OVR</th>
                <th>Tier</th>
                <th>Age</th>
                <th>Historical Reference</th>
                <th>Fitness</th>
                <th>Form</th>
                <th>Availability</th>
                <th>Contract</th>
                <th>Wage</th>
              </tr>
            </thead>
            <tbody id="squadBody"></tbody>
          </table>
        </div>
      </article>

      <div class="squad-mobile-cards" id="squadMobileCards"></div>
    `;

    const body = document.getElementById("squadBody");
    const cards = document.getElementById("squadMobileCards");
    const search = document.getElementById("squadSearch");
    const filterRoot = document.getElementById("positionFilters");
    const availability = document.getElementById("squadAvailability");
    const tier = document.getElementById("squadTier");
    const sort = document.getElementById("squadSort");
    const visibleCount = document.getElementById("squadVisibleCount");

    function groupOf(pos) {
      if (pos === "GK") return "GK";
      if (["RB","RWB","CB","LB","LWB"].includes(pos)) return "DEF";
      if (["DM","CDM","CM","AM","CAM"].includes(pos)) return "MID";
      return "ATT";
    }

    function filteredPlayers() {
      const q = state.squadSearch.trim().toLowerCase();

      let rows = players.filter(p => {
        const matchesFilter = state.squadFilter === "ALL" || groupOf(p.pos) === state.squadFilter;
        const matchesAvailability = state.squadAvailability === "ALL" || p.availabilityKey === state.squadAvailability;
        const matchesTier = state.squadTier === "ALL" || p.tier === state.squadTier;
        const haystack = [p.name,p.pos,p.secondary,p.refClub,p.refSeason,p.status,p.tier].join(" ").toLowerCase();
        const matchesSearch = !q || haystack.includes(q);
        return matchesFilter && matchesAvailability && matchesTier && matchesSearch;
      });

      rows = [...rows].sort((a,b)=>{
        switch(state.squadSort){
          case "OVR_ASC": return a.ovr-b.ovr || a.name.localeCompare(b.name);
          case "NAME_ASC": return a.name.localeCompare(b.name);
          case "AGE_ASC": return a.age-b.age || b.ovr-a.ovr;
          case "FITNESS_DESC": return b.fitness-a.fitness || b.ovr-a.ovr;
          case "WAGE_DESC": return b.wage-a.wage || b.ovr-a.ovr;
          default: return b.ovr-a.ovr || a.name.localeCompare(b.name);
        }
      });

      return rows;
    }

    function availabilityMarkup(p) {
      if (p.suspension?.active) return `<span class="injury-pill minor">Suspended · ${p.suspension.matches}</span>`;
      if (p.injury?.level && p.injury.level !== "None") {
        return `<span class="injury-pill ${String(p.injury.level).toLowerCase().replaceAll(" ","-")}">${htmlSafe(p.injury.level)}</span>`;
      }
      return `<span class="status-badge accepted">Available</span>`;
    }

    function drawRows() {
      const filtered = filteredPlayers();
      visibleCount.textContent = filtered.length;

      body.innerHTML = filtered.length ? filtered.map(p => `
        <tr>
          <td>
            <div class="player-cell">
              <div class="player-avatar">${initials(p.name)}</div>
              <div>
                <button class="player-name-btn" type="button" data-player="${htmlSafe(p.id)}">${htmlSafe(p.name)}</button>
                <span class="subtext">${htmlSafe(p.status)}</span>
              </div>
            </div>
          </td>
          <td><span class="pos">${htmlSafe(p.pos)}</span><span class="player-secondary">${htmlSafe(p.secondary||"-")}</span></td>
          <td><span class="ovr">${p.ovr}</span></td>
          <td><span class="tier-badge">${htmlSafe(p.tier)}</span></td>
          <td>${p.age}</td>
          <td><strong>${htmlSafe(p.refClub||"-")}</strong><span class="subtext">${htmlSafe(p.refSeason||"-")} · Ref age ${htmlSafe(p.refAge??"-")}</span></td>
          <td>
            <div class="fitness">
              <div class="fitness-bar"><i style="width:${p.fitness}%"></i></div>
              <span>${p.fitness}%</span>
            </div>
          </td>
          <td>${p.form}</td>
          <td>${availabilityMarkup(p)}</td>
          <td>${p.contract} season${p.contract===1?"":"s"}</td>
          <td>${wage(p.wage)}</td>
        </tr>
      `).join("") : `
        <tr><td colspan="11"><div class="squad-empty-production"><strong>No players match this filter.</strong><span>Clear search or filters to show the squad.</span></div></td></tr>
      `;

      cards.innerHTML = filtered.length ? filtered.map(p => `
        <article class="squad-player-card">
          <div class="squad-player-card-head">
            <div class="player-avatar">${initials(p.name)}</div>
            <div>
              <button class="squad-player-card-name" type="button" data-player="${htmlSafe(p.id)}">${htmlSafe(p.name)}</button>
              <div class="squad-player-card-sub">${htmlSafe(p.pos)}${p.secondary && p.secondary!=="-" ? " · "+htmlSafe(p.secondary) : ""} · Tier ${htmlSafe(p.tier)}</div>
            </div>

  function roleCompatibleText(slot, player) {
    const score = compatibleScore(slot, player);
    if (score >= 100) return "Natural";
    if (score >= 90) return "Secondary";
    if (score >= 70) return "Adaptable";
    return "Out of Position";
  }

  async function renderTactics() {
    await ensureTacticsInitialized();
    setHeader("Tactics", "MATCH PREPARATION · PRODUCTION");
    const [players, fixture, lineupRules] = await Promise.all([
      GameService.getSquad(),
      GameService.getNextFixture(),
      GameService.getLineupRules()
    ]);

    const playerById = Object.fromEntries(players.map(p => [p.id,p]));
    const formation = formations[state.tactics.formation];
    const selectedSlot = state.selectedSlot;
    const locked = !!lineupRules.currentlyLocked;
    const validation = validateLineupClient(players, state.tactics.formation);

    const attackPlayers = [];
    const midPlayers = [];
    const defPlayers = [];
    Object.entries(state.lineup).forEach(([slotIndex,pid]) => {
      const role = formation[Number(slotIndex)]?.[0] || "";
      const player = playerById[pid];
      if (!player) return;
      if (["ST","RW","LW","AM"].includes(role)) attackPlayers.push(player.ovr);
      else if (["DM","CM","RM","LM"].includes(role)) midPlayers.push(player.ovr);
      else if (role !== "GK") defPlayers.push(player.ovr);
    });

    const avg = arr => arr.length ? Math.round(arr.reduce((a,b)=>a+b,0)/arr.length) : 0;
    const attack = avg(attackPlayers);
    const midfield = avg(midPlayers);
    const defense = avg(defPlayers);

    const fatigueRisk =
      state.tactics.pressing === "Very High Press" || state.tactics.tempo === "Fast" ? 78 :
      state.tactics.pressing === "High Press" ? 62 : 42;

    const control =
      50 +
      (state.tactics.passingStyle === "Short" ? 10 : state.tactics.passingStyle === "Direct" ? -8 : 0) +
      (state.tactics.tempo === "Slow" ? 8 : state.tactics.tempo === "Fast" ? -3 : 0) +
      (state.tactics.width === "Narrow" ? 4 : 0);

    const aggression =
      42 +
      (state.tactics.mentality === "Attacking" ? 24 : state.tactics.mentality === "Positive" ? 12 : state.tactics.mentality === "Defensive" ? -18 : 0) +
      (state.tactics.pressing === "Very High Press" ? 18 : state.tactics.pressing === "High Press" ? 10 : 0);

    root.innerHTML = `
      <div class="lock-banner ${locked?"is-locked":""}">
        ${locked
          ? `Lineup & pre-match tactics are <strong>LOCKED</strong> by the server. Offline fallback: <strong>${htmlSafe(lineupRules.offlineFallback)}</strong>.`
          : `Lineup & pre-match tactics lock ${lineupRules.lockMinutesBeforeKickoff} minutes before kickoff · countdown <strong>${htmlSafe(lineupRules.lockCountdown)}</strong> · offline fallback: <strong>${htmlSafe(lineupRules.offlineFallback)}</strong>.`}
      </div>

      <article class="card tactics-toolbar">
        <div class="select-group">
          <label for="formationSelect">Formation</label>
          <select id="formationSelect" class="game-select" ${locked?"disabled":""}>
            ${Object.keys(formations).map(f => `<option ${f===state.tactics.formation?"selected":""}>${f}</option>`).join("")}
          </select>
          <span class="badge">${htmlSafe(fixture.dateLabel)} · ${htmlSafe(fixture.kickoff)}</span>
          <span class="server-source-pill">Supabase source of truth</span>
        </div>

        <div class="lineup-check ${validation.starters===11?"ok":"warn"}"><span>Starting XI</span><strong>${validation.starters}/11</strong></div>
        <div class="lineup-check ${validation.bench<=9?"ok":"warn"}"><span>Bench</span><strong>${validation.bench}/9</strong></div>
        <div class="lineup-check ${validation.ok?"ok":"warn"}"><span>Local Validation</span><strong>${validation.ok?"Ready":"Needs attention"}</strong></div>
      </div>
      ${validation.ok ? "" : `<div class="core-warning" style="margin-top:9px">${validation.errors.map(htmlSafe).join("<br>")}</div>`}

      <div class="tactics-layout" style="margin-top:12px">
        <div class="tactics-left">
          <article class="card pitch-card">
            <div class="section-head">
              <div>
                <p class="eyebrow">STARTING XI</p>
                <h2>${htmlSafe(state.tactics.formation)}</h2>
                <p>${locked ? "Server lock aktif; lineup read-only." : "Tap a player on the pitch to replace him."}</p>
              </div>
              <span class="badge ${locked?"":"live"}">${locked?"Lineup locked":"Lineup unlocked"}</span>
            </div>

            <div class="pitch-shell">
              <div class="pitch-lines"></div><div class="pitch-mid"></div><div class="pitch-circle"></div>

              <div class="goal-box top"></div><div class="goal-box bottom"></div>
              <div class="goal-mouth top"></div><div class="goal-mouth bottom"></div>

              <div class="pitch-players" id="pitchPlayers">
                ${formation.map((slot,idx) => {
                  const player = playerById[state.lineup[idx]];
                  const role = slot[0];
                  return `
                    <div class="pitch-player ${selectedSlot === idx ? "selected":""}" style="left:${slot[1]}%;top:${slot[2]}%">
                      <button type="button" data-slot="${idx}" aria-label="${htmlSafe(role)} ${player ? htmlSafe(player.name) : "Empty"}" ${locked?"disabled":""}>
                        ${player ? initials(player.name) : "+"}
                      </button>
                      ${player ? `<span class="ovr-dot">${player.ovr}</span>` : ""}
                      <span class="pname">${player ? htmlSafe(player.name) : "Empty"}</span>
                      <span class="ppos">${htmlSafe(role)}</span>

                }).join("")}

            <div class="lineup-summary">
              <div class="lineup-stat"><span>Attack</span><strong>${attack || "-"}</strong></div>

              <div class="lineup-stat"><span>Defense</span><strong>${defense || "-"}</strong></div>
            </div>

            <div class="status-strip">
              <span class="tag">Mentality: ${htmlSafe(state.tactics.mentality)}</span>
              <span class="tag">Press: ${htmlSafe(state.tactics.pressing)}</span>
              <span class="tag">Tempo: ${htmlSafe(state.tactics.tempo)}</span>
              <span class="tag">Transition: ${htmlSafe(state.tactics.transition)}</span>

          </article>

          <article class="card section-card">

              <div><p class="eyebrow">BENCH</p><h2>Matchday Bench</h2><p>Maximum 9 players.</p></div>

            <div class="bench-list">
              ${state.bench.map((pid,idx) => {
                const p = playerById[pid];
                return p ? `<div class="bench-player">
                    <div class="bench-num">${idx+1}</div>
                    <div><strong>${htmlSafe(p.name)}</strong><span>${htmlSafe(p.pos)} · OVR ${p.ovr} · Fitness ${p.fitness}%</span></div>
                    <button type="button" data-bench-player="${htmlSafe(p.id)}">Profile</button>
                  </div>` : "";
              }).join("") || `<div class="placeholder"><div><strong>No eligible bench players.</strong></div></div>`}
            </div>
          </article>
        </div>

        <aside class="tactics-right">
          <article class="card section-card">
            <div class="section-head">
              <div><p class="eyebrow">TACTICAL SETTINGS</p><h2>Team Instructions</h2><p>Saved to production through server RPC.</p></div>
            </div>
            <div class="tactic-control-grid">
              ${tacticSelect("Mentality","mentality",tacticalOptions.mentality,state.tactics.mentality)}
              ${tacticSelect("Pressing","pressing",tacticalOptions.pressing,state.tactics.pressing)}
              ${tacticSelect("Defensive Line","defensiveLine",tacticalOptions.defensiveLine,state.tactics.defensiveLine)}
              ${tacticSelect("Tempo","tempo",tacticalOptions.tempo,state.tactics.tempo)}
              ${tacticSelect("Passing Style","passingStyle",tacticalOptions.passingStyle,state.tactics.passingStyle)}
              ${tacticSelect("Width","width",tacticalOptions.width,state.tactics.width)}
              ${tacticSelect("Attack Focus","attackFocus",tacticalOptions.attackFocus,state.tactics.attackFocus)}
              ${tacticSelect("Transition","transition",tacticalOptions.transition,state.tactics.transition)}
            </div>
          </article>

          <article class="card section-card">
            <div class="section-head"><div><p class="eyebrow">TACTICAL PROFILE</p><h2>Style Preview</h2><p>Informational UI preview; match engine remains server-authoritative.</p></div></div>
            <div class="tactical-profile">
              ${profileLine("Control", Math.max(10,Math.min(95,control)))}
              ${profileLine("Aggression", Math.max(10,Math.min(95,aggression)))}
              ${profileLine("Fatigue Risk", fatigueRisk)}
            </div>
          </article>

          <article class="card section-card">
            <div class="section-head"><div><p class="eyebrow">OFFLINE AUTO-SUB</p><h2>Fallback Rules</h2><p>Used if the manager is offline during a live match.</p></div></div>
            <div class="autosub-grid">
              <div class="autosub-card"><span>Auto-sub</span><div class="toggle-row"><strong>${lineupRules.autoSubEnabled?"Enabled":"Disabled"}</strong><button id="autoSubToggle" class="toggle-btn ${lineupRules.autoSubEnabled?"on":""}" type="button" ${locked?"disabled":""}>${lineupRules.autoSubEnabled?"ON":"OFF"}</button></div></div>
              <div class="autosub-card"><span>Fatigue threshold</span><strong>${lineupRules.autoSubRules.fatigueThreshold}%</strong></div>
              <div class="autosub-card"><span>Injury-risk replacement</span><strong>${lineupRules.autoSubRules.injuryRiskReplacement?"Yes":"No"}</strong></div>
              <div class="autosub-card"><span>Maximum substitutions</span><strong>${lineupRules.autoSubRules.maxSubs}</strong></div>

          <article class="selection-panel ${!locked && selectedSlot !== null ? "show":""}" id="selectionPanel">
            ${!locked && selectedSlot !== null ? buildPlayerPicker(selectedSlot,formation,players,playerById) : ""}
          </article>
        </aside>
      </div>
    `;

    // Tactical controls become true read-only when the server lineup lock is active.
    if (locked) root.querySelectorAll("[data-tactic]").forEach(x=>x.disabled=true);

    document.getElementById("formationSelect")?.addEventListener("change", (e) => {
      if (locked) return;
      state.tactics.formation = e.target.value;
      assignDefaultLineup(players, state.tactics.formation);
      state.selectedSlot = null;
      renderTactics();
    });

    document.getElementById("autoPickBtn")?.addEventListener("click", () => {
      if (locked) return;
      assignDefaultLineup(players, state.tactics.formation);
      state.selectedSlot = null;
      showToast("Best eligible XI selected from the production squad.");
      renderTactics();
    });

    document.getElementById("saveTacticsBtn")?.addEventListener("click", async () => {
      if (locked) { showToast("Lineup is locked by the server."); return; }
      state.selectedSlot = null;
      const check = validateLineupClient(players,state.tactics.formation);
      if (!check.ok) { showToast(check.errors[0] || "Lineup belum valid."); return; }

      const btn=document.getElementById("saveTacticsBtn");
      btn.disabled=true;
      try {
        await GameService.saveTactics({...state.tactics,autoSubEnabled:state.tactics.autoSubEnabled!==false});
        const shape=formations[state.tactics.formation];
        const starters=shape.map((slot,idx)=>state.lineup[idx]).filter(Boolean);
        const bench=state.bench.filter(Boolean).slice(0,9);
        await GameService.saveLineup(state.tactics.formation,starters,bench);
        showToast("Tactics + lineup saved to production.");
      } catch(err){ showToast(`Save gagal: ${err.message}`); }
      finally { btn.disabled=false; await renderTactics(); }
    });

    root.querySelectorAll("[data-tactic]").forEach(select => {
      select.addEventListener("change", () => {
        if (locked) return;
        state.tactics[select.dataset.tactic] = select.value;
        renderTactics();
      });
    });

    root.querySelectorAll("[data-slot]").forEach(btn => {
      btn.addEventListener("click", () => {
        if (locked) return;
        const idx = Number(btn.dataset.slot);
        state.selectedSlot = state.selectedSlot === idx ? null : idx;
        renderTactics();
      });
    });

    root.querySelectorAll("[data-bench-player]").forEach(btn => {
      btn.addEventListener("click", () => openPlayer(btn.dataset.benchPlayer));
    });

    document.getElementById("autoSubToggle")?.addEventListener("click",()=>{
      if (locked) return;
      state.tactics.autoSubEnabled=!(state.tactics.autoSubEnabled!==false);
      showToast("Auto-sub preference changed. Save to persist.");
      renderTactics();
    });

    root.querySelectorAll("[data-pick-player]").forEach(btn => {
      btn.addEventListener("click", () => {
        if (locked) return;
        const newPlayerId = btn.dataset.pickPlayer;
        const player = playerById[newPlayerId];
        if (!playerEligibleForLineup(player)) { showToast("Player is not eligible for this lineup."); return; }

        const slotIndex = Number(btn.dataset.pickSlot);
        const role = formation[slotIndex][0];
        if (role === "GK" && player.pos !== "GK") { showToast("GK slot must use a goalkeeper."); return; }

        const oldPlayerId = state.lineup[slotIndex];
        const otherSlot = Object.entries(state.lineup).find(([idx,pid]) => pid === newPlayerId && Number(idx) !== slotIndex);

        if (otherSlot) state.lineup[Number(otherSlot[0])] = oldPlayerId;
        else {
          const benchIndex = state.bench.indexOf(newPlayerId);
          if (benchIndex >= 0) state.bench[benchIndex] = oldPlayerId;
        }

        state.lineup[slotIndex] = newPlayerId;
        state.bench = state.bench.filter(id => !Object.values(state.lineup).includes(id)).slice(0,9);
        if (oldPlayerId && !Object.values(state.lineup).includes(oldPlayerId) && !state.bench.includes(oldPlayerId)) {
          const old = playerById[oldPlayerId];
          if (playerEligibleForLineup(old)) state.bench.unshift(oldPlayerId);
          state.bench = state.bench.slice(0,9);
        }

        state.selectedSlot = null;
        showToast("Lineup updated locally. Save to production when ready.");
        renderTactics();
      });
    });
  }

  function buildPlayerPicker(slotIndex,formation,players,playerById) {
    const role = formation[slotIndex][0];
    const currentId = state.lineup[slotIndex];

    const candidates = [...players]
      .filter(p => p.id !== currentId && playerEligibleForLineup(p))
      .sort((a,b) => {
        const sa = compatibleScore(role,a) * 10 + a.ovr + a.fitness/10;
        const sb = compatibleScore(role,b) * 10 + b.ovr + b.fitness/10;
        return sb-sa;
      })
      .slice(0,12);

    const current = playerById[currentId];

    return `
      <h3>Replace ${role}</h3>
      <div class="selection-info">
        Current: <strong>${current ? current.name : "Empty"}</strong>.
        Recommended players are sorted by position fit, OVR and fitness.
      </div>
      <div class="player-picker">
        ${candidates.map(p => `
          <button type="button" class="pick-row" data-pick-player="${p.id}" data-pick-slot="${slotIndex}">
            <div class="pick-av">${initials(p.name)}</div>
            <div>
              <strong>${htmlSafe(p.name)}</strong>
              <span>${p.pos}${p.secondary && p.secondary!=="-" ? " / "+p.secondary : ""} · ${roleCompatibleText(role,p)} · Fitness ${p.fitness}%</span>
            </div>
            <div class="pick-ovr">${p.ovr}</div>
          </button>
        `).join("")}
      </div>
    `;
  }

  function profileLine(label,value) {
    return `
      <div class="profile-line">
        <span>${label}</span>
        <div class="profile-bar"><i style="width:${value}%"></i></div>
        <strong>${Math.round(value)}</strong>
      </div>
    `;

  function trainingModeMeta(type) {
    const map = {
      Recovery: {dxp:2, fitness:10, fatigue:"Very Low", risk:"Very Low"},
      Light: {dxp:5, fitness:-2, fatigue:"Low", risk:"Low"},
      Normal: {dxp:8, fitness:-4, fatigue:"Moderate", risk:"Low"},
      Intensive: {dxp:12, fitness:-9, fatigue:"High", risk:"High"},
      Attacking: {dxp:8, fitness:-5, fatigue:"Moderate", risk:"Moderate"},
      Defensive: {dxp:8, fitness:-5, fatigue:"Moderate", risk:"Moderate"},
      Technical: {dxp:7, fitness:-3, fatigue:"Low", risk:"Low"},
      Fitness: {dxp:7, fitness:-6, fatigue:"Moderate", risk:"Moderate"}
    };
    return map[type] || map.Normal;
  }

  function playerReadiness(player) {
    if (player.status && player.status.toLowerCase().includes("injur")) {
      return {label:"Risk", cls:"risk"};
    }
    if (player.fitness >= 85) return {label:"Ready", cls:"ready"};
    if (player.fitness >= 65) return {label:"Manage", cls:"manage"};
    return {label:"Risk", cls:"risk"};
  }

  function recommendedIndividualFocus(player) {
    if (player.pos === "ST") return "Finishing";
    if (["RW","LW","AM"].includes(player.pos)) return "Dribbling";
    if (["CM","DM"].includes(player.pos)) return "Passing";
    if (["RB","LB"].includes(player.pos)) return "Crossing";
    if (player.pos === "CB") return "Tackling";
    if (player.pos === "GK") return "Reflexes";
    return "Balanced";
  }

  async function renderTraining() {
    setHeader("Training", "PLAYER DEVELOPMENT · PRODUCTION");

    const [players, trainingState, history, fixture] = await Promise.all([
      GameService.getSquad(),
      GameService.getTrainingState(),
      GameService.getTrainingHistory(),
      GameService.getNextFixture()
    ]);

    state.training.completed = !!trainingState.completed;
    if (trainingState.scheduled || trainingState.completed) state.training.type = trainingState.todayType;
    if (!state.training.type) state.training.type = trainingState.todayType || "Normal";

    const mode = trainingModeMeta(state.training.type);
    const avgFitness = players.length ? Math.round(players.reduce((sum,p)=>sum+p.fitness,0)/players.length) : 0;
    const readyCount = players.filter(p=>p.fitness>=85 && playerEligibleForLineup(p)).length;
    const manageCount = players.filter(p=>p.fitness>=65 && p.fitness<85 && playerEligibleForLineup(p)).length;
    const riskCount = Math.max(0,players.length-readyCount-manageCount);

    const trainingMultiplier = ({1:1.00,2:1.03,3:1.06,4:1.09,5:1.12})[trainingState.trainingCentreLevel] || 1;
    const medicalMultiplier = ({1:1.00,2:1.05,3:1.10,4:1.15,5:1.20})[trainingState.medicalCentreLevel] || 1;

    const projectedFitness = Math.max(0,Math.min(100,avgFitness + mode.fitness));
    const recoveryEffect = state.training.type === "Recovery" ? 82 :
      state.training.type === "Light" ? 62 :
      state.training.type === "Normal" ? 48 :
      state.training.type === "Intensive" ? 24 : 44;
    const devEffect = Math.min(95, Math.round((35 + mode.dxp * 4) * Math.min(1.12,trainingMultiplier)));
    const fatigueEffect = Math.min(95, Math.abs(mode.fitness) * 6 + (state.training.type === "Intensive" ? 30 : 10));

    const trainingModes = [
      ["Recovery","Restore fitness, minimal development."],
      ["Light","Small development load with low fatigue."],
      ["Normal","Balanced daily development."],
      ["Intensive","Maximum development load, high fatigue."],
      ["Attacking","Attacking-oriented session."],
      ["Defensive","Defensive-oriented session."],
      ["Technical","Technical skill session."],
      ["Fitness","Physical and stamina session."]
    ];

    const indivOptions = ["Balanced","Finishing","Passing","Dribbling","Crossing","Tackling","Positioning","Strength","Aerial","Stamina","Work Rate","Pace","Acceleration","Reflexes"];

    const warning = state.training.type === "Intensive"
      ? `<div class="core-warning">Intensive training has the highest load. Server-side training processing remains authoritative for the final DXP, fitness and injury outcome.</div>`
      : state.training.type === "Recovery"
      ? `<div class="core-success">Recovery is intended for restoring squad readiness; final recovery is processed by the server and medical facility level.</div>`
      : `<div class="core-production-note">The numbers below are a manager preview. Final development and fitness mutations are calculated server-side.</div>`;

    root.innerHTML = `
      <div class="training-layout">
        <div class="training-main">
          <article class="card section-card">
            <div class="section-head">
              <div>
                <p class="eyebrow">TODAY'S SESSION</p>
                <h2>Team Training</h2>
                <p>One team session per game day · next fixture ${htmlSafe(fixture.kickoff)}</p>
              </div>
              <span class="badge ${trainingState.completed ? "" : "live"}">${trainingState.completed ? "Completed" : trainingState.scheduled ? "Scheduled" : "Available"}</span>
            </div>

            <div class="training-server-status">
              <div><span>Server Status</span><strong>${trainingState.completed?"Completed":trainingState.scheduled?"Scheduled":"Not scheduled"}</strong></div>
              <div><span>Selected Session</span><strong>${htmlSafe(state.training.type)}</strong></div>
              <div><span>Training Centre</span><strong>Lv ${trainingState.trainingCentreLevel} · ×${trainingMultiplier.toFixed(2)}</strong></div>
              <div><span>Medical Centre</span><strong>Lv ${trainingState.medicalCentreLevel} · ×${medicalMultiplier.toFixed(2)}</strong></div>
            </div>

            <div class="training-mode-grid" id="trainingModes">
              ${trainingModes.map(([type,desc]) => {
                const m = trainingModeMeta(type);
                return `<button type="button" class="training-mode ${state.training.type===type?"active":""}" data-training-mode="${type}" ${trainingState.completed?"disabled":""}>
                    <strong>${type}</strong>

                        <td><span class="pos">${htmlSafe(p.pos)}</span></td>
                        <td><span class="ovr">${p.ovr}</span></td>

        <aside class="training-side">

            <div class="readiness-grid">
              <div class="readiness-card"><span>Ready</span><strong class="good">${readyCount}</strong></div>
              <div class="readiness-card"><span>Manage Load</span><strong class="warn">${manageCount}</strong></div>
              <div class="readiness-card"><span>At Risk / Unavailable</span><strong class="danger">${riskCount}</strong></div>

            <div class="recovery-bars">
              ${recoveryRow("Current Fitness",avgFitness)}
              ${recoveryRow("Preview After Session",projectedFitness)}
              ${recoveryRow("Recovery Profile",recoveryEffect)}
              ${recoveryRow("Development Profile",devEffect)}
              ${recoveryRow("Fatigue Load",fatigueEffect)}
            </div>
          </article>

          <article class="card section-card">
            <div class="section-head"><div><p class="eyebrow">FACILITIES</p><h2>Training Support</h2></div></div>
            <div class="grid quick-grid">
              <div class="quick-card"><strong>Level ${trainingState.trainingCentreLevel}</strong><p>Training Centre · ×${trainingMultiplier.toFixed(2)} configured development multiplier</p></div>
              <div class="quick-card"><strong>Level ${trainingState.medicalCentreLevel}</strong><p>Medical Centre · ×${medicalMultiplier.toFixed(2)} configured recovery multiplier</p></div>
            </div>
          </article>

          <article class="card section-card">
            <div class="section-head"><div><p class="eyebrow">HISTORY</p><h2>Recent Sessions</h2></div></div>
            <div class="history-list">
              ${history.length ? history.map(h => `<div class="history-row">
                  <div class="history-day">${htmlSafe(h.day)}</div>
                  <div><strong>${htmlSafe(h.type)}</strong><span>Server training session · ${htmlSafe(h.status || "")}</span></div>
                  <div class="history-impact"><b>DXP ${h.avgDxp>=0?"+":""}${h.avgDxp}</b><span>Fitness preview ${h.avgFitness>=0?"+":""}${h.avgFitness}%</span></div>
                </div>`).join("") : `<div class="placeholder"><div><strong>No training history yet</strong><p>Completed sessions will appear here.</p></div></div>`}
            </div>
          </article>
        </aside>
      </div>
    `;

    root.querySelectorAll("[data-training-mode]").forEach(btn => {
      btn.addEventListener("click", () => {
        if (trainingState.completed) return;
        state.training.type = btn.dataset.trainingMode;
        renderTraining();
      });
    });

    root.querySelectorAll("[data-individual-focus]").forEach(sel => {
      sel.addEventListener("change", async () => {
        const previous = state.training.individualFocus[sel.dataset.individualFocus] || recommendedIndividualFocus(players.find(p=>p.id===sel.dataset.individualFocus)||{});
        state.training.individualFocus[sel.dataset.individualFocus] = sel.value;
        sel.disabled = true;
        try {
          await GameService.setIndividualFocus(sel.dataset.individualFocus,sel.value);
          showToast(`Individual focus saved: ${sel.value}.`);
        } catch(err) {
          state.training.individualFocus[sel.dataset.individualFocus] = previous;
          sel.value = previous;
          showToast(`Focus gagal: ${err.message}`);
        } finally {
          sel.disabled = false;
        }
      });
    });

    root.querySelectorAll("[data-training-player]").forEach(btn => {
      btn.addEventListener("click", () => openPlayer(btn.dataset.trainingPlayer));
    });

    const startBtn = document.getElementById("startTrainingBtn");
    if (startBtn) {
      startBtn.addEventListener("click", async () => {
        if (trainingState.completed) return;
        startBtn.disabled=true;
        try {
          await GameService.scheduleTraining(state.training.type);
          showToast(`${state.training.type} training saved to production.`);
        } catch(err) {
          showToast(`Training gagal: ${err.message}`);
        }
        await renderTraining();
      });
    }

  function recoveryRow(label,value) {
    return `
      <div class="recovery-row">
        <span>${label}</span>
        <div class="recovery-bar"><i style="width:${Math.max(0,Math.min(100,value))}%"></i></div>
        <strong>${Math.round(value)}</strong>
      </div>
    `;
  }


  function transferPositionGroup(pos) {
    if (pos === "GK") return "GK";
    if (["RB","CB","LB","RWB","LWB"].includes(pos)) return "DEF";
    if (["DM","CM","AM","RM","LM"].includes(pos)) return "MID";
    return "ATT";
  }

  function statusClass(status) {
    const s = String(status || "").toLowerCase();
    if (s === "pending" || s === "countered") return "pending";
    if (s === "accepted") return "accepted";
    if (s === "outbid") return "outbid";
    if (s === "rejected") return "rejected";
    return "";
  }

  async function renderTransfers() {
    setHeader("Transfers", "MARKET & CONTRACTS · PRODUCTION");
    const [market, club, squad] = await Promise.all([
      GameService.getTransferMarket(),
      GameService.getClub(),
      GameService.getSquad()
    ]);

    const squadSize = Number(market.squadSize || squad.length);
    const availableSlots = Math.max(0, Number(market.squadMax||25) - squadSize);
    const wageRoom = Math.max(0, Number(club.wageLimit||0) - Number(club.wageUsed||0));
    const spendingAllowed = !!market.windowOpen && !club.transferSpendingFrozen;
    const sellingAllowed = !!market.windowOpen;
    const gkCount = squad.filter(p=>p.pos==="GK").length;

    const tabs = [
      ["list","Transfer List"],
      ["free","Free Agents"],
      ["bids","My Bids"],
      ["received","Offers Received"]
    ];

    root.innerHTML = `
      <div class="transfer-shell">
        <div class="competition-banner ${market.windowOpen?"live":"closed"}">
          <div>
            <strong>${market.windowOpen ? "Transfer Window OPEN" : "Transfer Window CLOSED"}</strong>
            <p>${htmlSafe(market.windowLabel)} · ${htmlSafe(market.closesIn)}${club.transferSpendingFrozen ? " · Club spending is frozen by finance state." : ""}</p>
          </div>
          <span class="badge">${htmlSafe(market.seasonPhase || "")} · MD ${Number(market.matchday||0)}</span>
        </div>

        <div class="transfer-summary">
          <div class="transfer-stat"><span>Transfer Budget</span><strong>${money(club.transferBudget)}</strong></div>
          <div class="transfer-stat"><span>Wage Room</span><strong>${wage(wageRoom)}</strong></div>
          <div class="transfer-stat"><span>Squad</span><strong>${squadSize}/${market.squadMax}</strong></div>
          <div class="transfer-stat"><span>Goalkeepers</span><strong>${gkCount}/${market.minGoalkeepers||2} min</strong></div>
        </div>

        <div class="transfer-rule-grid">
          <div><span>Squad Minimum</span><strong>${market.squadMin}</strong></div>
          <div><span>Squad Maximum</span><strong>${market.squadMax}</strong></div>
          <div><span>Minimum GK</span><strong>${market.minGoalkeepers||2}</strong></div>
          <div><span>Server Authority</span><strong>Final validation</strong></div>
        </div>

        <div class="transfer-tabs" id="transferTabs">
          ${tabs.map(([key,label]) => `<button type="button" class="transfer-tab ${state.transfers.tab===key?"active":""}" data-transfer-tab="${key}">${label}</button>`).join("")}
        </div>

        <div id="transferContent"></div>
      </div>
    `;

    const content = document.getElementById("transferContent");

    if (state.transfers.tab === "list") {
      renderTransferList(content, market, club, squadSize, availableSlots, wageRoom, spendingAllowed);
    } else if (state.transfers.tab === "free") {
      renderFreeAgents(content, market, club, availableSlots, wageRoom, spendingAllowed);
    } else if (state.transfers.tab === "bids") {
      renderMyBids(content, market);
    } else {
      renderOffersReceived(content, market, squad, sellingAllowed);
    }

    root.querySelectorAll("[data-transfer-tab]").forEach(btn => {
      btn.addEventListener("click", () => {
        state.transfers.tab = btn.dataset.transferTab;
        state.transfers.selectedPlayer = null;
        renderTransfers();
      });
    });
  }

  function renderTransferList(container, market, club, squadSize, availableSlots, wageRoom, spendingAllowed) {
    const positions = [["ALL","All"],["GK","GK"],["DEF","DEF"],["MID","MID"],["ATT","ATT"]];
    const q = state.transfers.search.trim().toLowerCase();

    const filtered = market.transferList.filter(p => {
      const matchesPos = state.transfers.position === "ALL" || transferPositionGroup(p.pos) === state.transfers.position;
      const hay = [p.name,p.club,p.pos,Array.isArray(p.secondary)?p.secondary.join(" "):p.secondary,p.tier].join(" ").toLowerCase();
      const matchesSearch = !q || hay.includes(q);
      const a=state.transferAdvanced;
      return matchesPos && matchesSearch && p.ovr>=a.minOvr && (a.tier==="ALL"||p.tier===a.tier) && p.age<=a.maxAge && p.price<=a.maxPrice;
    });

    container.innerHTML = `
      <article class="card section-card">
        <div class="section-head">
          <div><p class="eyebrow">DIRECT TRANSFERS</p><h2>Transfer List</h2><p>All offers are validated and settled by the production server.</p></div>
          ${spendingAllowed ? `<span class="badge live">${filtered.length} listed</span>` : `<span class="transfer-action-lock">Buying locked</span>`}
        </div>

        ${!spendingAllowed ? `<div class="core-warning" style="margin-bottom:12px">${!market.windowOpen?"Transfer window is closed. ":""}${club.transferSpendingFrozen?"Transfer spending is frozen by club finance state.":""}</div>` : ""}

        <div class="transfer-toolbar">
          <div class="transfer-filter-group" id="transferPosFilters">
            ${positions.map(([value,label]) => `<button type="button" class="filter-btn ${state.transfers.position===value?"active":""}" data-market-pos="${value}">${label}</button>`).join("")}
          </div>
          <input id="transferSearch" class="search-box" type="search" placeholder="Search player, club or position..." value="${escapeHtml(state.transfers.search)}" />
        </div>

        <div class="advanced-filters">
          <select class="game-select" id="filterOvr"><option value="0">Any OVR</option><option value="75">75+</option><option value="80">80+</option><option value="85">85+</option></select>
          <select class="game-select" id="filterTier"><option value="ALL">Any Tier</option><option>S</option><option>A</option><option>B</option><option>C</option><option>D</option></select>
          <select class="game-select" id="filterAge"><option value="99">Any Age</option><option value="23">≤23</option><option value="27">≤27</option><option value="30">≤30</option></select>
          <select class="game-select" id="filterPrice"><option value="999999999">Any Price</option><option value="10000000">≤£10M</option><option value="20000000">≤£20M</option><option value="40000000">≤£40M</option></select>
          <button class="secondary-btn" id="clearAdvancedFilters" type="button">Clear Filters</button>
        </div>
        <div style="height:14px"></div>

        <div class="transfer-grid">
          ${filtered.length ? filtered.map(p => {
            const secondary = Array.isArray(p.secondary) ? p.secondary.join(" / ") : p.secondary;
            return `<article class="market-card">
              <div class="market-head">
                <div class="market-avatar">${initials(p.name)}</div>
                <div><strong>${htmlSafe(p.name)}</strong><span>${htmlSafe(p.club)} · ${htmlSafe(p.pos)}${secondary && secondary!=="-" ? " / "+htmlSafe(secondary) : ""}</span></div>
                <div class="market-ovr">${Number(p.ovr||0)}</div>
              </div>
              <div class="market-meta">
                <div><span>Price</span><strong>${money(p.price)}</strong></div>
                <div><span>Wage</span><strong>${wage(p.wage)}</strong></div>
                <div><span>Age</span><strong>${Number(p.age||0)}</strong></div>
                <div><span>Tier</span><strong>${htmlSafe(p.tier)}</strong></div>
                <div><span>Potential</span><strong>${htmlSafe(p.potential)}</strong></div>
                <div><span>Fitness</span><strong>${Number(p.fitness||0)}%</strong></div>
              </div>
              <div class="cooldown-tag">Accepted purchase receives the server-defined resale cooldown.</div>
              <div class="market-actions">
                <button class="offer-btn" type="button" data-market-offer="${htmlSafe(p.id)}" ${spendingAllowed?"":"disabled"}>Make Offer</button>
              </div>
            </article>`;
          }).join("") : `<div class="competition-empty"><strong>No listed players match the filters.</strong><span>Try another search or filter.</span></div>`}
        </div>
      </article>

      ${state.transfers.selectedPlayer ? buildOfferPanel(
        market.transferList.find(p=>p.id===state.transfers.selectedPlayer),
        club, squadSize, availableSlots, wageRoom, spendingAllowed
      ) : ""}
    `;

    container.querySelectorAll("[data-market-pos]").forEach(btn => {
      btn.addEventListener("click", () => { state.transfers.position = btn.dataset.marketPos; renderTransfers(); });
    });

    const filterOvr=document.getElementById("filterOvr"), filterTier=document.getElementById("filterTier"), filterAge=document.getElementById("filterAge"), filterPrice=document.getElementById("filterPrice");
    if(filterOvr){filterOvr.value=String(state.transferAdvanced.minOvr);filterOvr.addEventListener("change",()=>{state.transferAdvanced.minOvr=Number(filterOvr.value);renderTransfers();});}
    if(filterTier){filterTier.value=state.transferAdvanced.tier;filterTier.addEventListener("change",()=>{state.transferAdvanced.tier=filterTier.value;renderTransfers();});}
    if(filterAge){filterAge.value=String(state.transferAdvanced.maxAge);filterAge.addEventListener("change",()=>{state.transferAdvanced.maxAge=Number(filterAge.value);renderTransfers();});}
    if(filterPrice){filterPrice.value=String(state.transferAdvanced.maxPrice);filterPrice.addEventListener("change",()=>{state.transferAdvanced.maxPrice=Number(filterPrice.value);renderTransfers();});}
    document.getElementById("clearAdvancedFilters")?.addEventListener("click",()=>{state.transferAdvanced={minOvr:0,tier:"ALL",maxAge:99,maxPrice:999999999};renderTransfers();});

    const search = document.getElementById("transferSearch");
    if (search) search.addEventListener("change", () => { state.transfers.search = search.value; renderTransfers(); });

    container.querySelectorAll("[data-market-offer]").forEach(btn => {
      btn.addEventListener("click", () => {
        if (!spendingAllowed) return;
        const player = market.transferList.find(p=>p.id===btn.dataset.marketOffer);
        if (!player) return;
        state.transfers.selectedPlayer = player.id;
        state.transfers.offerAmount = player.price;
        renderTransfers();
      });
    });

    wireOfferPanel(container, market, club, availableSlots, wageRoom, spendingAllowed);
  }

  function buildOfferPanel(player, club, squadSize, availableSlots, wageRoom, spendingAllowed) {
    if (!player) return "";
    const amount = Math.max(0,Number(state.transfers.offerAmount || player.price));
    const afterBudget = Number(club.transferBudget||0) - amount;
    const contractYears = Number(player.contract || 1);
    const financeOk = amount <= Number(club.transferBudget||0);
    const wageOk = Number(player.wage||0) <= wageRoom;
    const squadOk = availableSlots > 0;
    const allOk = spendingAllowed && financeOk && wageOk && squadOk;

    return `
      <div style="height:16px"></div>
      <div class="offer-panel">
        <article class="card offer-box">
          <div class="section-head">
            <div><p class="eyebrow">DIRECT OFFER</p><h2>${htmlSafe(player.name)}</h2><p>${htmlSafe(player.club)} · Asking ${money(player.price)}</p></div>
            <span class="badge">${htmlSafe(player.pos)} · OVR ${Number(player.ovr||0)}</span>
          </div>

          <div class="offer-player">
            <div class="market-avatar">${initials(player.name)}</div>
            <div><strong>${htmlSafe(player.name)}</strong><span>${htmlSafe(player.pos)} · Age ${Number(player.age||0)} · Tier ${htmlSafe(player.tier)}</span></div>
            <strong>${money(player.price)}</strong>
          </div>

          <div style="height:14px"></div>
          <div class="offer-form">
            <div><label for="offerAmount">Transfer Fee</label><input id="offerAmount" class="money-input" type="number" min="0" step="500000" value="${amount}" ${spendingAllowed?"":"disabled"} /></div>
            <div class="production-status-box"><strong>Contract settlement</strong><p>Current remaining term: ${contractYears} season${contractYears===1?"":"s"}. Wage and final contract settlement are validated by the server.</p></div>
            <button class="primary-btn" id="submitOfferBtn" type="button" ${allOk ? "" : "disabled"}>Submit Offer</button>
          </div>
        </article>

        <article class="card offer-box">
          <div class="section-head"><div><p class="eyebrow">DEAL CHECK</p><h2>Client Preview</h2></div></div>
          <div class="offer-preview">
            <div class="preview-row"><span>Transfer Budget</span><strong>${money(club.transferBudget)}</strong></div>
            <div class="preview-row"><span>Offer</span><strong>${money(amount)}</strong></div>
            <div class="preview-row"><span>Budget After Deal</span><strong class="${afterBudget>=0?"good":"danger"}">${money(Math.max(0,afterBudget))}</strong></div>
            <div class="preview-row"><span>Player Wage</span><strong>${wage(player.wage)}</strong></div>
            <div class="preview-row"><span>Wage Room</span><strong class="${wageOk?"good":"danger"}">${wage(wageRoom)}</strong></div>
            <div class="preview-row"><span>Squad Slots</span><strong class="${squadOk?"good":"danger"}">${availableSlots}</strong></div>
          </div>
          <div style="height:12px"></div>
          ${allOk
            ? `<div class="finance-ok">Client checks pass. Final budget, wage, ownership and settlement validation is server-side and atomic.</div>`
            : `<div class="finance-warning">${!spendingAllowed?"Buying is currently locked. ":""}${!financeOk?"Transfer budget insufficient. ":""}${!wageOk?"Wage room insufficient. ":""}${!squadOk?"Squad already at maximum size.":""}</div>`}
        </article>
      </div>`;
  }

  function wireOfferPanel(container, market, club, availableSlots, wageRoom, spendingAllowed) {
    const amountInput = document.getElementById("offerAmount");
    const submit = document.getElementById("submitOfferBtn");

    if (amountInput) {
      amountInput.addEventListener("change", () => {
        state.transfers.offerAmount = Math.max(0, Number(amountInput.value || 0));
        renderTransfers();
      });
    }
    if (submit) {
      submit.addEventListener("click", async () => {
        if (!spendingAllowed) return;
        const p = market.transferList.find(x=>x.id===state.transfers.selectedPlayer);
        if (!p) return;
        submit.disabled=true;
        try {
          await GameService.makeTransferOffer(p.id,state.transfers.offerAmount,p.wage);
          showToast(`Offer ${money(state.transfers.offerAmount)} submitted for ${p.name}.`);
          state.transfers.selectedPlayer=null;
        } catch(err){ showToast(`Offer gagal: ${err.message}`); }
        await renderTransfers();
      });
    }
  }

  function renderFreeAgents(container, market, club, availableSlots, wageRoom, spendingAllowed) {
    container.innerHTML = `
      <article class="card section-card">
        <div class="section-head">
          <div><p class="eyebrow">FREE AGENT AUCTIONS</p><h2>Open Auctions</h2><p>Auction end time and final winner are server-controlled.</p></div>
          ${spendingAllowed ? `<span class="badge live">${market.freeAgents.length} active</span>` : `<span class="transfer-action-lock">Bidding locked</span>`}
        </div>
        <div class="core-production-note" style="margin-bottom:12px">A late bid may extend an auction according to the backend rule. The displayed minimum next bid is a client preview; the RPC performs final validation.</div>
        <div class="transfer-grid">
          ${market.freeAgents.length ? market.freeAgents.map(p => {
            const increment = Math.max(1,Number(p.minIncrement||500000));
            const minBid = Number(p.currentBid||0) > 0 ? Number(p.currentBid)+increment : Number(p.openingBid||1000000);
            const canAfford = spendingAllowed && minBid <= Number(club.transferBudget||0) && Number(p.wage||0) <= wageRoom && availableSlots > 0;
            const secondary=Array.isArray(p.secondary)?p.secondary.join(" / "):p.secondary;
            return `<article class="auction-card">
                <div class="market-head">
                  <div class="market-avatar">${initials(p.name)}</div>
                  <div><strong>${htmlSafe(p.name)}</strong><span>${htmlSafe(p.pos)}${secondary&&secondary!=="-"?" / "+htmlSafe(secondary):""} · Age ${Number(p.age||0)}</span></div>
                  <div class="market-ovr">${Number(p.ovr||0)}</div>
                </div>
                <div class="market-meta">
                  <div><span>Current Bid</span><strong>${money(p.currentBid)}</strong></div>
                  <div><span>Leader</span><strong>${htmlSafe(p.currentBidder)}</strong></div>
                  <div><span>Latest Wage</span><strong>${wage(p.wage)}</strong></div>
                </div>
                <div class="bid-row">
                  <div><span class="auction-countdown">Ends in ${htmlSafe(p.endsIn)}</span><div class="subtext">Minimum next bid ${money(minBid)}</div></div>
                  <div class="market-actions"><button type="button" class="offer-btn" data-auction-bid="${htmlSafe(p.id)}" ${canAfford?"":"disabled"}>Bid ${money(minBid)}</button></div>
                </div>
              </article>`;
          }).join("") : `<div class="competition-empty"><strong>No open free-agent auctions.</strong><span>Auctions are created by the server/admin workflow.</span></div>`}
        </div>
      </article>
    `;

    container.querySelectorAll("[data-auction-bid]").forEach(btn => {
      btn.addEventListener("click", async () => {
        if (!spendingAllowed) return;
        const p = market.freeAgents.find(x=>x.id===btn.dataset.auctionBid);
        if (!p) return;
        const increment=Math.max(1,Number(p.minIncrement||500000));
        const nextBid = Number(p.currentBid||0)>0 ? Number(p.currentBid)+increment : Number(p.openingBid||1000000);
        const proposedWage=Math.max(0,Number(prompt(`Weekly wage for ${p.name} (£/week)`,String(p.wage||20000))));
        if(!proposedWage)return;
        const years=Math.min(3,Math.max(1,Number(prompt('Contract seasons (1-3)','2'))||2));
        btn.disabled=true;
        try {
          await GameService.placeFreeAgentBid(p.id,nextBid,proposedWage,years);
          showToast(`Bid submitted for ${p.name}.`);
        } catch(err){ showToast(`Bid gagal: ${err.message}`); }
        await renderTransfers();
      });
    });
  }

  function renderOffersReceived(container, market, squad, sellingAllowed) {
    const byId=new Map(squad.map(p=>[p.id,p]));
    const gkCount=squad.filter(p=>p.pos==="GK").length;

    container.innerHTML = `
      <article class="card table-card">
        <div class="section-card" style="padding-bottom:8px">
          <div class="section-head">
            <div><p class="eyebrow">OFFERS RECEIVED</p><h2>Incoming Transfer Offers</h2><p>Server rules: minimum squad ${market.squadMin}, maximum ${market.squadMax}, minimum ${market.minGoalkeepers||2} GK, plus resale eligibility.</p></div>
            ${sellingAllowed?"":`<span class="transfer-action-lock">Settlement locked</span>`}
          </div>
        </div>
        <div class="table-wrap">
          <table class="transfer-table">
            <thead><tr><th>Player</th><th>Buyer</th><th>Offer</th><th>Status</th><th>Submitted</th><th>Action</th></tr></thead>
            <tbody>
              ${market.offersReceived.length ? market.offersReceived.map(o => {
                const p=byId.get(o.playerId);
                const minSquadOk=squad.length-1>=Number(market.squadMin||18);
                const gkOk=!p || p.pos!=="GK" || gkCount-1>=Number(market.minGoalkeepers||2);
                const cooldownOk=!p || Number(p.resaleCooldown||0)<=0;
                const countered=o.rawStatus==="countered";
                const canSettle=!countered && sellingAllowed && minSquadOk && gkOk && cooldownOk;
                const reason=countered?"Counter sent · waiting for buyer":!sellingAllowed?"Window closed":!minSquadOk?"Minimum squad rule":!gkOk?"Minimum GK rule":!cooldownOk?`Resale cooldown ${p.resaleCooldown} MD`:"Eligible";
                return `<tr>
                    <td><strong>${htmlSafe(o.player)}</strong><span class="subtext">${htmlSafe(reason)}</span></td>
                    <td>${htmlSafe(o.buyer)}</td>
                    <td>${money(o.amount)}</td>
                    <td><span class="status-badge ${statusClass(o.status)}">${htmlSafe(o.status)}</span></td>
                    <td>${htmlSafe(o.submitted)}</td>
                    <td><div class="offer-response-actions">
                      ${countered
                        ? `<button class="reject-btn" type="button" data-offer-reject="${htmlSafe(o.id)}">Withdraw / Reject</button>`
                        : `<button class="accept-btn" type="button" data-offer-accept="${htmlSafe(o.id)}" ${canSettle?"":"disabled"}>Accept</button>
                           <button class="counter-btn" type="button" data-offer-counter="${htmlSafe(o.id)}" ${sellingAllowed?"":"disabled"}>Counter</button>
                           <button class="reject-btn" type="button" data-offer-reject="${htmlSafe(o.id)}">Reject</button>`}
                    </div></td>
                  </tr>`;
              }).join("") : `<tr><td colspan="6"><div class="competition-empty"><strong>No incoming offers.</strong></div></td></tr>`}
            </tbody>
          </table>
        </div>
      </article>
    `;

    container.querySelectorAll("[data-offer-accept]").forEach(btn => {
      btn.addEventListener("click", async () => {
        btn.disabled=true;
        try{await GameService.respondTransferOffer(btn.dataset.offerAccept,"accept");showToast("Offer accepted and settled server-side.");}
        catch(err){showToast(`Accept gagal: ${err.message}`);}
        await renderTransfers();
      });
    });
    container.querySelectorAll("[data-offer-counter]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const amount=Number(prompt("Counter amount (£)","20000000"));
        if(!amount)return;
        try{await GameService.respondTransferOffer(btn.dataset.offerCounter,"counter",amount);showToast("Counter-offer sent.");}
        catch(err){showToast(`Counter gagal: ${err.message}`);}
        await renderTransfers();
      });
    });
    container.querySelectorAll("[data-offer-reject]").forEach(btn => {
      btn.addEventListener("click", async () => {
        try{await GameService.respondTransferOffer(btn.dataset.offerReject,"reject");showToast("Offer rejected server-side.");}
        catch(err){showToast(`Reject gagal: ${err.message}`);}
        await renderTransfers();
      });
    });
  }

  async function renderMatch() {
    setHeader("Match Centre", "SERVER MATCH STATE · PRODUCTION");

    const [base, squad, savedSetup] = await Promise.all([
      GameService.getMatchCentre(),
      GameService.getSquad(),
      GameService.getSavedSetup()
    ]);

    if (!base.fixtureId) {
      root.innerHTML=`
        <article class="card module-error">
          <div>
            <div class="module-error-icon">⚽</div>
            <p class="eyebrow">NO FIXTURE</p>
            <h2>Belum ada pertandingan terjadwal</h2>
            <p class="subtext">Match Centre akan aktif ketika scheduler production membuat fixture untuk klub Anda.</p>
            <div class="module-error-actions"><button class="primary-btn" style="width:auto;padding:0 18px" id="noFixtureRefreshBtn" type="button">Refresh Match State</button></div>
          </div>
        </article>`;
      document.getElementById("noFixtureRefreshBtn")?.addEventListener("click",()=>renderMatch());
      return;
    }

    const awayPoss = Number(base.possessionAway ?? (100-Number(base.possessionHome||50)));
    const progress=Math.min(100,(Number(base.minute||0)/90)*100);
    const savedStarters=(savedSetup.entries||[]).filter(x=>x.role==='starter').sort((a,b)=>a.slot_index-b.slot_index).map(x=>x.player_id);
    const savedBench=(savedSetup.entries||[]).filter(x=>x.role==='bench').sort((a,b)=>a.slot_index-b.slot_index).map(x=>x.player_id);
    const onPitchIds=new Set(savedStarters);
    const availableBenchIds=new Set(savedBench);
    for(const e of (base.events||[])){
      if(e.rawType==='SUBSTITUTION' && e.playerId && e.secondaryPlayerId){
        onPitchIds.delete(e.secondaryPlayerId);
        onPitchIds.add(e.playerId);
        availableBenchIds.delete(e.playerId);
      }
    }
    const frozenIds=[...new Set([...savedStarters,...savedBench].filter(Boolean))];
    const frozenSquad=frozenIds.length ? squad.filter(p=>frozenIds.includes(p.id)) : squad;
    const onPitchSquad=frozenIds.length ? squad.filter(p=>onPitchIds.has(p.id)) : squad;
    const availableBenchSquad=frozenIds.length ? squad.filter(p=>availableBenchIds.has(p.id)) : squad;
    const liveControls=!!base.isLive;

    const stateClass=base.isLive?"live":base.isCompleted?"completed":"waiting";
    const stateTitle=base.isLive?"LIVE MATCH":base.isCompleted?"FULL TIME":"PRE-MATCH";
    const stateText=base.isLive
      ? "Live controls are available. Server processes changes on the match state."
      : base.isCompleted
        ? "This fixture is complete. Controls are read-only."
        : "Fixture is scheduled / lineup-locked. Live controls unlock only when server status becomes LIVE.";

    root.innerHTML=`
      <div class="match-state-banner ${stateClass}">
        <div><strong>${stateTitle}</strong><span>${htmlSafe(stateText)}</span></div>
        <span class="badge ${base.isLive?"live":""}">${htmlSafe(base.status)}</span>
      </div>

      <div class="match-layout">
        <div class="stack">
          <article class="card section-card">
            <div class="section-head">
              <div><p class="eyebrow">${htmlSafe(base.status)}</p><h2>${htmlSafe(base.venue)}</h2><p>${htmlSafe(base.kickoff)} · production server is authoritative</p></div>
              <span class="badge ${base.isLive?'live':''}">${Number(base.minute||0)}'</span>
            </div>
            <div class="scoreboard">
              <div class="score-main">
                <div class="score-team">${crestMarkup({short:base.homeShort,name:base.home,logoUrl:base.homeLogoUrl})}<strong>${htmlSafe(base.home)}</strong></div>
                <div class="score-centre"><strong>${Number(base.homeScore||0)} – ${Number(base.awayScore||0)}</strong><span>${htmlSafe(base.status)}</span></div>
                <div class="score-team">${crestMarkup({short:base.awayShort,name:base.away,logoUrl:base.awayLogoUrl})}<strong>${htmlSafe(base.away)}</strong></div>
              </div>
              <div class="match-progress"><i style="width:${progress}%"></i></div>
              <button class="primary-btn" id="refreshLiveMatchBtn" type="button">Refresh Server Match State</button>
            </div>
          </article>

          <article class="card section-card">
            <div class="section-head"><div><p class="eyebrow">MATCH STATS</p><h2>Server Statistics</h2></div></div>
            <div class="match-stat-grid">
              <div class="match-stat"><span>Possession</span><strong>${Number(base.possessionHome||50).toFixed(0)}% – ${awayPoss.toFixed(0)}%</strong></div>
              <div class="match-stat"><span>Shots</span><strong>${Number(base.shotsHome||0)} – ${Number(base.shotsAway||0)}</strong></div>
              <div class="match-stat"><span>Shots on Target</span><strong>${Number(base.sotHome||0)} – ${Number(base.sotAway||0)}</strong></div>
              <div class="match-stat"><span>xG</span><strong>${Number(base.xgHome||0).toFixed(2)} – ${Number(base.xgAway||0).toFixed(2)}</strong></div>
            </div>
          </article>

          <article class="card section-card">
            <div class="section-head"><div><p class="eyebrow">LIVE TACTICS</p><h2>In-Match Controls</h2><p>Only enabled while server fixture status is LIVE.</p></div></div>
            <div class="live-control-grid">
              <div class="live-control-card"><label class="kpi-label">Mentality</label><select class="game-select" id="liveMentality" style="width:100%" ${liveControls?"":"disabled"}>${["Defensive","Cautious","Balanced","Positive","Attacking"].map(v=>`<option>${v}</option>`).join("")}</select></div>
              <div class="live-control-card"><label class="kpi-label">Pressing</label><select class="game-select" id="livePressing" style="width:100%" ${liveControls?"":"disabled"}>${["Low Block","Standard","High Press","Very High Press"].map(v=>`<option>${v}</option>`).join("")}</select></div>
            </div>

      if(!base.isLive)return;
      const btn=document.getElementById('applyLiveTacticsBtn');btn.disabled=true;
      try{
        await GameService.submitLiveTactics(base.fixtureId,{
          mentality:document.getElementById('liveMentality').value,
          press:document.getElementById('livePressing').value
        });
        showToast('Live tactics accepted by server.');
      }catch(err){showToast(`Live tactics gagal: ${err.message}`);}
      await renderMatch();
    });

    document.getElementById('makeSubBtn')?.addEventListener('click',async()=>{
      if(!base.isLive)return;
      const outId=document.getElementById('liveSubOut').value,inId=document.getElementById('liveSubIn').value;

      await renderMatch();
    });
  }

  async function renderInbox() {
    setHeader("Inbox", "NOTIFICATIONS · PRODUCTION");

    let notes = [];
    let loadError = null;
    try {
      notes = await GameService.getNotifications();
    } catch (err) {
      loadError = err;
      console.error("Inbox load failed",err);
    }

    const categories = ["All","Unread","Match","Transfer","Player","Finance","League"];
    const filtered = notes.filter(n => {
      if (state.inbox.filter === "All") return true;
      if (state.inbox.filter === "Unread") return !n.read;
      return n.category === state.inbox.filter;
    });
    const unread = notes.filter(n=>!n.read).length;

    root.innerHTML = `
      <div class="inbox-layout">
        <aside class="inbox-filters">
          ${categories.map(c=>`<button type="button" class="inbox-filter ${state.inbox.filter===c?"active":""}" data-inbox-filter="${c}">${c}</button>`).join("")}
        </aside>

        <article class="card section-card">
          <div class="section-head">
            <div><p class="eyebrow">MANAGER INBOX</p><h2>${htmlSafe(state.inbox.filter)}</h2><p>Server notifications for match, transfer, player, finance and league events.</p></div>
            <div class="inbox-toolbar">
              <span class="badge">${unread} unread</span>
              <button class="secondary-btn inbox-refresh" id="refreshInboxBtn" type="button">Refresh</button>
              <button class="secondary-btn inbox-refresh" id="markAllReadBtn" type="button" ${!unread?"disabled":""}>Mark all read</button>
            </div>
          </div>

          ${loadError ? `<div class="core-warning">Inbox gagal dimuat: ${htmlSafe(loadError.message || String(loadError))}</div><div style="height:10px"></div>` : ""}

          <div class="notification-list">
            ${filtered.length ? filtered.map(n=>`
              <div class="notification-card ${n.read?"":"unread"}">
                <div class="notification-symbol">${{Match:"▶",Transfer:"£",Player:"XI",Finance:"$",League:"LG"}[n.category]||"i"}</div>
                <div>
                  <strong>${htmlSafe(n.title)}</strong>
                  <p>${htmlSafe(n.message)}</p>
                  <div class="notification-actions">
                    ${!n.read?`<button class="auth-link" type="button" data-note-read="${htmlSafe(n.id)}">Mark read</button>`:""}
                  </div>
                </div>
                <time>${htmlSafe(n.time)}</time>
              </div>`).join("") : `<div class="placeholder"><div><strong>No notifications</strong><p>${loadError?"Use Refresh after the connection recovers.":"Nothing in this category."}</p></div></div>`}
          </div>
        </article>
      </div>`;

    root.querySelectorAll("[data-inbox-filter]").forEach(btn=>{
      btn.addEventListener("click",()=>{state.inbox.filter=btn.dataset.inboxFilter;renderInbox();});
    });

    root.querySelectorAll("[data-note-read]").forEach(btn=>{
      btn.addEventListener("click",async()=>{
        btn.disabled=true;
        try{
          await GameService.markNotificationRead(btn.dataset.noteRead);
          showToast("Notification marked read.");
        }catch(err){
          showToast(`Read gagal: ${err.message}`);
        }
        await refreshNotificationCounts();
        await renderInbox();
      });
    });

    document.getElementById("refreshInboxBtn")?.addEventListener("click",async()=>{
      try { GameService.invalidate?.(); } catch(_){}
      await refreshNotificationCounts();
      await renderInbox();
    });

    document.getElementById("markAllReadBtn")?.addEventListener("click",async()=>{
      const btn=document.getElementById("markAllReadBtn");
      btn.disabled=true;
      try{
        const c=state.inbox.filter;
        await GameService.markAllNotificationsRead(["Match","Transfer","Player","Finance","League"].includes(c)?c.toUpperCase():null);
        showToast("Notifications marked read.");
      }catch(err){
        showToast(`Mark all gagal: ${err.message}`);
      }
      await refreshNotificationCounts();
      await renderInbox();
    });
  }
