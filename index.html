      </div>
      <div class="player-summary">
        <div class="big-rating">
          <div>
            <strong>${p.ovr}</strong>
            <span>${p.pos} · Tier ${p.tier}</span>
          </div>
        </div>
        <div class="player-facts">
          ${fact("Age", p.age)}
          ${fact("Fitness", p.fitness + "%")}
          ${fact("Form", p.form)}
          ${fact("Potential", p.potential)}
          ${fact("Contract", p.contract + " season")}
          ${fact("Wage", wage(p.wage))}
          ${fact("Reference Season", p.refSeason)}
          ${fact("Reference Club", p.refClub)}
          ${fact("Reference Age", p.refAge ?? "-")}
          ${fact("Career Stage", p.careerStage || "-")}
          ${fact("Primary / Secondary", p.pos + " / " + (p.secondary||"-"))}
          ${fact("Injury", p.injury?.level||"None")}
          ${fact("Suspension", p.suspension?.active ? p.suspension.matches+" match" : "None")}
          ${fact("Retirement Risk", p.retirementRisk||"Low")}
          ${fact("Resale Cooldown", (p.resaleCooldown||0)+" matchday")}
        </div>
      </div>

      <div class="attributes"><h3>Positional OVR & Familiarity</h3><div class="player-facts">${(p.positionOvrs||[]).map(x=>fact(x.position,`${x.ovr} · ${x.familiarity}`)).join("")}</div></div>
      <div class="attributes"><h3>Season Statistics</h3><div class="player-facts">${fact("Appearances",p.stats?.appearances??0)}${fact("Starts",p.stats?.starts??0)}${fact("Minutes",p.stats?.minutes??0)}${fact("Goals",p.stats?.goals??0)}${fact("Assists",p.stats?.assists??0)}${fact("Avg Rating",p.stats?.avgRating??"-")}${fact("Clean Sheets",p.stats?.cleanSheets??0)}</div></div>
      <div class="attributes"><h3>Injury / Availability</h3><div class="player-facts">${fact("Level",p.injury?.level||"None")}${fact("Matches Affected",p.injury?.matchesAffected??0)}${fact("Playable",p.injury?.playable===false?"No":"Yes")}${fact("Expected Return Fitness",(p.injury?.returnFitness??p.fitness)+"%")}</div></div>
      <div class="attributes"><h3>Development Outlook</h3><div class="player-facts">${fact("Age Multiplier",p.age<=20?"1.35×":p.age<=22?"1.25×":p.age<=24?"1.15×":p.age<=26?"1.00×":p.age<=28?"0.85×":p.age<=30?"0.60×":p.age<=32?"0.35×":"0.15×")}${fact("Season Growth Band",p.age<=24?"Typically +1 to +3 OVR":p.age<=28?"Typically 0 to +1 OVR":"Stable / decline risk")}${fact("Potential",p.potential)}${fact("Retirement Risk",p.retirementRisk||"Low")}</div><div class="subtext">Potential remains a hidden soft ceiling; only the label is shown. Physical attributes decline earlier than technical/positioning attributes.</div></div>
      <div class="attributes"><h3>Contract Actions</h3><div class="contract-panel"><div class="contract-actions"><select id="renewContractYears" class="game-select">${[1,2,3].map(y=>`<option value="${y}">${y} season${y>1?'s':''}</option>`).join("")}</select><button class="secondary-btn" id="renewContractBtn">Renew Contract</button><button class="secondary-btn" id="listTransferBtn">List for Transfer</button><button class="reject-btn" id="releasePlayerBtn">Release Player</button></div><div class="subtext">Contract max 3 seasons. Release is validated server-side for squad size, goalkeeper minimum, registration and wage commitment.</div></div></div>
      <div class="attributes"><h3>Game Career History</h3><div class="table-wrap"><table class="career-table"><thead><tr><th>Season</th><th>Club</th><th>Apps</th><th>Goals</th><th>Assists</th><th>Rating</th></tr></thead><tbody>${(p.careerHistory||[]).map(h=>`<tr><td>${h.season}</td><td>${h.club}</td><td>${h.apps}</td><td>${h.goals}</td><td>${h.assists}</td><td>${h.rating}</td></tr>`).join("")}</tbody></table></div></div>

      <div class="attributes">
        <h3>Attributes</h3>
        <div class="attr-grid">
          ${Object.entries(p.attributes).map(([name,value]) => `
            <div class="attr">
              <span>${name}</span>
              <div class="attr-bar"><i style="width:${value}%"></i></div>
              <strong>${value}</strong>
            </div>
          `).join("")}
        </div>
      </div>
    `;

    document.getElementById("renewContractBtn")?.addEventListener("click",async()=>{const y=Number(document.getElementById("renewContractYears").value);try{await GameService.renewContract(p.id,y,p.wage);showToast(`${p.name}: renewal ${y} season queued server-side.`);}catch(err){showToast(`Renew gagal: ${err.message}`);}});
    document.getElementById("listTransferBtn")?.addEventListener("click",async()=>{const ask=Number(prompt(`Asking price for ${p.name} (£)`,String(Math.max(1000000,Math.round(p.ovr*p.ovr*4000)))));if(!ask)return;try{await GameService.listPlayerForTransfer(p.id,ask);showToast(`${p.name} listed for ${money(ask)}.`);playerDialog.close();}catch(err){showToast(`Listing gagal: ${err.message}`);}});
    document.getElementById("releasePlayerBtn")?.addEventListener("click",async()=>{if(!confirm(`Release ${p.name}? Server will enforce minimum 18 squad and 2 GK.`))return;try{await GameService.releasePlayer(p.id);showToast(`${p.name} released server-side.`);playerDialog.close();await render();}catch(err){showToast(`Release gagal: ${err.message}`);}});
    playerDialog.showModal();
  }

  function fact(label, value) {
    return `<div class="fact"><span>${label}</span><strong>${value}</strong></div>`;
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, ch => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    })[ch]);
  }

  function renderModuleError(view, err) {
    const message = err?.message || String(err || "Unknown error");
    const title = ({
      squad:"Squad",tactics:"Tactics",training:"Training",transfers:"Transfers",
      league:"League",match:"Match Centre",club:"Club",season:"Season",inbox:"Inbox"
    })[view] || "Module";

    setHeader(title, "PRODUCTION ERROR");
    root.innerHTML = `
      <article class="card module-error">
        <div>
          <div class="module-error-icon">!</div>
          <p class="eyebrow">MODULE LOAD FAILED</p>
          <h2>${htmlSafe(title)} tidak dapat dimuat</h2>
          <p class="subtext">Data production tidak diubah. Coba ulangi setelah koneksi/server kembali normal.</p>
          <code>${htmlSafe(message)}</code>
          <div class="module-error-actions">
            <button class="primary-btn" style="width:auto;padding:0 18px" id="moduleRetryBtn" type="button">Retry</button>
            <button class="secondary-btn" id="moduleHomeBtn" type="button">Home</button>
          </div>
        </div>
      </article>`;
    document.getElementById("moduleRetryBtn")?.addEventListener("click",()=>render());
    document.getElementById("moduleHomeBtn")?.addEventListener("click",()=>{state.view="home";syncActiveNav();render();});
  }


  function applyUxEnhancements() {
    document.body.dataset.ms7View = state.view || "home";

    // Turn data-heavy tables into readable mobile cards without touching backend/data logic.
    root.querySelectorAll(".table-wrap table").forEach(table => {
      table.classList.add("ux-responsive-table");
      const headers = [...table.querySelectorAll("thead th")].map(th => th.textContent.trim());
      table.querySelectorAll("tbody tr").forEach(row => {
        [...row.children].forEach((cell, index) => {
          if (!cell.dataset.label) cell.dataset.label = headers[index] || "";
        });
      });
    });

    // Make horizontal tab groups swipe-friendly on touch devices.
    root.querySelectorAll(".module-tabs,.transfer-tabs,.filters,.inbox-filters").forEach(el => {
      el.classList.add("ux-scroll-tabs");
    });

    // Give every rendered page a consistent entry transition.
    root.classList.remove("ux-view-enter");
    void root.offsetWidth;
    root.classList.add("ux-view-enter");
  }

  async function render() {
    try {
      if (state.preseason.active) {
        if (state.view === "home") await renderPreseasonHome();
        else if (state.view === "squad") await renderPreseasonSquad();
        else if (state.view === "club") await renderPreseasonClub();
        else if (state.view === "inbox") await renderPreseasonInbox();
        else await renderPreseasonLocked(state.view);
        applyUxEnhancements();
        return;
      }

      if (state.view === "draw") await renderDraw();
      else if (state.view === "squad") await renderSquad();
      else if (state.view === "tactics") await renderTactics();
      else if (state.view === "training") await renderTraining();
      else if (state.view === "transfers") await renderTransfers();
      else if (state.view === "league") await renderLeague();
      else if (state.view === "match") await renderMatch();
      else if (state.view === "club") await renderClub();
      else if (state.view === "season") await renderSeason();
      else if (state.view === "inbox") await renderInbox();
      else if (state.view === "admin") await renderAdmin();
      else await renderHome();

      applyUxEnhancements();
      try { await refreshNotificationCounts(); }
      catch (notifyErr) { console.warn("Notification refresh failed", notifyErr); }
    } catch (err) {
      console.error(`Render failed: ${state.view}`, err);
      const msg=err?.message||String(err);
      if (/AUTH_REQUIRED|ACCOUNT_NOT_APPROVED|CLUB_NOT_FOUND_FOR_MANAGER/.test(msg)) {
        showToast("Session/akses berubah. Memuat ulang login.");
        try { await showAuth(true); } catch (_) {}
        return;
      }
      renderModuleError(state.view, err);
    }
  }

  if (false && "serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }

  MS7Service.client.auth.onAuthStateChange((event) => {
    if (event === "SIGNED_OUT") {
      state.production.bootstrap = null;
      state.session.screen = "login";
    }
  });

  showAuth(true);
})();

</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.warn('Service worker registration failed', err));
  });
}
</script>

</body>
</html>
